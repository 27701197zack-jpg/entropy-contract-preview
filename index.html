const PACKS = [{"title": "肉罐头与半价冻肉", "chapters": ["第一章 肉罐头与半价冻肉"], "chars": 6321, "html": "<h3 class=\"ch\" data-ch=\"第一章 肉罐头与半价冻肉\">第一章 肉罐头与半价冻肉<\/h3>\n<blockquote><p><strong>【历史档案切片 · 2037 年 CL-9 商用生物计算机维生与销毁规程（第 7.4 条）】<\/strong><\/p><p>单批 iPSC 诱导人类皮层神经元有效服役周期严格限定为 180 个标准日（4,320 小时）。自第 177 日起，神经突触将因不可逆代谢衰减进入退化窗口，突触权重将在 72 小时内彻底归零。操作员须佩戴防静电手套，在倒计时结束前直接剥离培养盒，连同微流控管路投入三类医疗焚烧炉。严禁以任何形式进行黑市转售或离线续命。<\/p><\/blockquote>\n<p class=\"stamp\"><strong>2058 年 11 月 14 日 21:50 · 距离三重倒计时归零剩余 <code>72:10:00<\/code><\/strong><\/p>\n<p>外环废热盆地的夜风是粘在皮肤上的。<\/p>\n<p>三公里外，<code>64K<\/code> 示范城集群的十二座双曲线冷却塔正往低垂的云层里吐白雾。夜里风向偏南，带着余温的水汽顺着高架桥底沉下来，压在高低错落的违建铁皮屋顶上，把整片旧工业带蒸成一口揭不开盖的铁锅。空气里常年浮着三股味道：超算排风口吹出来的硅尘味，街口冷链摊解冻劣质冻肉的血腥气，还有焊锡混着旧铅酸电池的酸臭。<\/p>\n<p>巷口锈灯杆底下，两个穿灰工装的年轻人蹲在马路牙子上，轮流嘬一根掌心大的塑料管——底城药房和灰市卖得最火的“情绪稳态雾化管”。淡蓝指示灯闪一下，吐出的白雾融进冷却塔的水汽里，分不清哪股是机器的废气，哪股是活人的叹气。两人谁也不看谁，只盯着对面墙上一块缺了角的全息灯牌发呆。灯牌卡顿着循环播放消费民主区的虚拟伴侣广告，女人精致的笑脸在电压波动里扭成几道绿色雪花。广告间隙跳出半秒公益片：“霍承安意识永续基金会——让伟大的头脑不再死去。”画面上那个银发老人已经死了二十三年，还在冲整条巷子微笑。<\/p>\n<p>“老林旧电池铺”缩在巷子中段。卷帘门只拉起半人高，底下漏出一道昏黄的灯管光，斜斜泼在湿漉漉的水泥台阶上。<\/p>\n<p>晚上九点四十，黑市中间人老蟹弓着腰从卷帘门底下钻进来，活脱脱一条沾了水的泥鳅。雨衣没脱，水顺着塑料下摆往下滴，在满是机油的地上砸出一个个黑点。<\/p>\n<p>“货在这儿。”他把一只裹着三层防静电泡沫和油纸的硬壳箱往铁皮工作台上一放，扯开两道胶带，又把两张印着加密部落暗纹的离线电力配额票压在箱盖上，“定金先结一半。林深，这单价钱给到顶了，规矩你懂——不问来路，不接外网，稳住营养液和脉冲底噪，撑到后天午夜，有人来取。”<\/p>\n<p>林深坐在掉漆的圆铁凳上，没去碰配额票，先用右手掀开油纸一角。<\/p>\n<p>里头是一只巴掌大的密封陶瓷培养盒，边缘几道撬痕，微流控接口缠着半圈发黄的医用胶布。侧壁嵌着一块指甲盖大的电子墨水屏，跳着一行血红的读数：<\/p>\n<p class=\"log\"><code>[介质老化：距离突触权重永久归零剩余 72:16:52]<\/code><\/p>\n<p>林深眼皮跳了一下：“第 177 天的临期货？老蟹，你拿快死透的肉罐头糊弄我？过了 177 天，代谢衰减是指数级往下掉的。我这破台子没有恒温负压箱，电压一抽风就能把它电熟了。”<\/p>\n<p>“废话，要不是临期货，人家能绕开中环正规机房，花大价钱送到你这破电池铺？”老蟹压低嗓子，喉结滚了滚，往卷帘门缝外瞟了一眼，“跟你说句实话，这单货上头查得紧，不是黑市拆机流出来的算力垃圾。也不是我挑的你——这单是上头指名要送你这儿的。你只管拿葡萄糖和生长因子吊着它的命，别手贱去读里头的权重。撑到后天午夜，尾款翻倍；要是明早它发黄发臭了，连盒扔进后巷焚化炉，指纹擦干净，权当没见过我。”<\/p>\n<p>说完他连口水都没喝，钻出卷帘门，一头扎进夜雾。脚步声很快被高架桥上冷链货车的胎噪吞没了。<\/p>\n<p>铺子里静下来，只剩墙角老式铅酸充电机低沉的电流声。<\/p>\n<p>林深盯着培养盒看了五秒，把两张配额票折好塞进裤兜——他不跟钱过不去。外环电价上个月又涨了百分之十二，冰柜压缩机上周烧了线圈，老林左腿那副碳纤维支架的关节垫片也磨平了，哪样不要硬通货？<\/p>\n<p>他把旧焊枪、拆散的电芯和几把油腻的螺丝刀推到一边，腾出一块勉强干净的铁皮，坐了下来。<\/p>\n<p>林深今年三十，身形偏瘦，肩膀却宽。一件洗得发白的灰工装背心，左袖管卷到肩头，露出一整条哑光黑的金属机械臂。<\/p>\n<p>这条胳膊跟公司城邦宣传片里那种流线型仿生义体是两码事。它粗笨、沉，小臂外壳的漆早磕掉了，露出底下灰白的合金；肩胛卡环一圈焊疤，肘外侧裸着两根编织液压管，小臂内侧焊了一块铝散热片，旁边嵌着一只从旧服务器机箱里拆下来的直流风扇。东欧战区停火后流出来的军规转民用货。前年他托加密部落一个退役老技工剪了原厂的云端心跳校验，硬刷进野路子的越狱固件，代价是没了液冷和温控——连续高负载超过十分钟，铝片就烫得像刚出炉的烙铁，能把接缝处的皮肉烫出水泡。<\/p>\n<p>接收电路他没敢全拆，本地诊断和离线自检还得靠它。老技工临走还顺手塞进一块二手低功耗类脑芯片当协处理器，说能多扛两路算力。林深没多问，只当是老头儿一点好意。<\/p>\n<p>此刻风扇正嗡嗡转着，金属指头微微发烫。<\/p>\n<p>他从抽屉里翻出一副洗硬了的医用胶皮手套，只套上右手。右手是原生的，手指修长，掌心和虎口全是握焊枪、扳手磨出来的老茧，手背一道陈年锡珠烫疤。当年有人劝他趁黑市打折，把右手也换成带力反馈的精密义肢，修东西能快一倍。林深直接把人轰出了门。有些东西换了，就再也摸不出热汤碗和活人手背的温度了。<\/p>\n<p>他捏起一根玻璃微流控针管，从保温瓶里抽出两毫升配好的无菌葡萄糖与神经生长因子混合液，对着灯管弹了弹管壁，排净气泡。<\/p>\n<p>左肩微微前倾，铁臂五根金属指头里，只用三根做精细夹持，缓缓合拢，以零点一毫米的精度夹住了培养盒。<\/p>\n<p>透过顶部的石英观察窗，能看见里头泡着一片指甲盖大、淡粉色的人类皮层神经元薄膜。五十九根比头发丝还细的铂铱电极针刺在薄膜边缘，连着盒底的微型脉冲发生器。一串极低电压的白噪声电击闪过，那片活组织在淡黄的营养液里轻轻抽了一下，困在玻璃瓶里的深海软体动物也就这样——没有眼睛，没有嘴，却在用最原始的生物电对抗热力学衰减。<\/p>\n<p>行话管这叫“肉罐头”。养硅基芯片要极紫外光刻机、特种化工，还要过《旧金山宣言》锁死的跨国供应链；养活体神经元不用——一份培养基、一套微流控管路、一套盗版 <code>biOS<\/code> 闭环，就能在底城暗巷里拼出一台绕开算力铁幕的黑机。唯一的死穴是它们会老，会死。满一百八十天，突触权重归零，没法像硅基模型那样存个副本重启。死了就是真死了。<\/p>\n<p>林深屏住呼吸，把针尖缓缓刺进盒壁侧面的硅胶自封阀。<\/p>\n<p class=\"log\"><code>[介质老化：距离突触权重永久归零剩余 72:09:14]<\/code><\/p>\n<p>“稳住，别跟我掉链子。”他低声骂了一句，拇指一点点推针栓。这两毫升得推上十来分钟，快了，薄膜吃不消。<\/p>\n<p>推到一半，墙角的老式稳压器“咔哒”一声跳了闸。<\/p>\n<p>头顶灯管抽了两下，明灭不定，充电机的风扇转速跟着掉了一截，发出垂死般的呜咽。<\/p>\n<p>林深头都没抬——十点整了。外环废热盆地每天准点报时的闹钟。每到这个钟点，近海赫尔墨斯岛和中心算力集群进入夜间波峰推理，整片底城民用电网就被巨兽抽了一口血，电压直抖。<\/p>\n<p>右耳后随即传来一阵细针扎神经似的嗡鸣。那里贴着一块早已报废的微创脑机接口贴片，是早年在厂里干活留下的旧伤，芯片早抠了，只剩皮下一点没取干净的金属触点残渣。平时不痛不痒，偏偏一遇上强算力波峰或者高频射频扫描，就隐隐作痛。<\/p>\n<p>盒里的薄膜被电压一扰，痉挛了一下，墨水屏上的红字乱跳两帧。<\/p>\n<p>“操。”林深左手纹丝不动，右手一巴掌拍在工作台侧面的应急切换开关上，把供电切到桌底那块离线铅酸蓄电池。<\/p>\n<p>电流稳住了。<\/p>\n<p>灯管还在外头电网的拖累下滋滋闪，盒里那片薄膜却慢慢平复，恢复了规律而微弱的脉冲。红字重新清晰：<code>71:59:42<\/code>。<\/p>\n<p>林深长出一口气，把针管拔出来放进盛酒精的搪瓷盘，摘了手套，端起手边洗得发白的旧玻璃杯，抿了一口早凉透的粗茶。杯子刚放下，半掩的卷帘门“哗啦”一声被人从外面推到了顶。<\/p>\n<p>夜风裹着冷库的血腥气和湿热白雾灌了进来。<\/p>\n<p>老林喘着粗气，一步一顿跨过高门槛。六十岁的人了，左腿拖着一副碳纤维支架，深蓝涤纶夹克湿了半边，花白头发粘在额头上。两只手各拎一个鼓囊囊的黑色大塑料袋，胳膊肘下还硬夹着两箱缠满透明胶带的工业粗盐。<\/p>\n<p>“砰”的一声，两袋子砸在水泥地上，滚出几大块泛着白霜、渗着血水的冻猪肉，冰碴子混着血水顺着地缝漫开。<\/p>\n<p>林深皱眉，扯过一块脏抹布盖住培养盒，顺手把酒精盘往里推了推。<\/p>\n<p>“爸，你疯了？”他站起来看着满地血水，“冰柜压缩机上周刚烧，修一趟三百块离线票，你扛这么多冻肉回来往哪儿塞？明天太阳一出来，这屋里能臭得耗子都不进门。”<\/p>\n<p>“塞床底下！塞咸菜缸里！拿盐腌死它！”老林扶着门框直喘，一只手下意识揉着变形的左膝，浑浊的眼睛里透着一股林深好几年没见过的慌，“冷链集散中心的冻猪肉，今晚八点以后一夜跌了一半！整条街的蠢货排长队抢着包饺子，乐得跟过年似的，连隔壁修车铺那抠门鬼都扛了半扇猪回去！”<\/p>\n<p>他一瘸一拐走到柜台边，拧开掉漆的搪瓷缸子，仰脖灌了几口凉白开。<\/p>\n<p>“跌价不是好事吗？”林深弯腰帮他把两箱粗盐挪到墙角，故意逗他，“你前天还骂街口肉摊黑心，一斤冻五花卖得比电解液还贵，怎么真跌了你反倒急了？”<\/p>\n<p>“你懂个屁！”老林把缸子往柜台上一墩，震得几颗旧螺丝跳起来，嗓子压低半截，带着从肺管子里挤出来的沙哑，“涨价是明抢，你少吃两口还能熬；跌价才要命！2029 年大涨价前，也是先这么没来由地暴跌！我干了二十年冷链和农机维修，冷库不会平白无故半夜清仓——除非上头那些算大账的机器，已经算出来往后几个月饲料和化肥要断顿了！”<\/p>\n<p>他拖着支架走到墙角，掀开一口大号粗陶咸菜缸的木盖，冲林深比划：“你想想，化肥一减产，明年玉米大豆就断崖。大宗商品算法比活人算得快，饲料期货一飙，牧场主养不起活猪过冬，宁可亏本连夜宰了换现钱。满大街的便宜肉，那不是过年，那是把明年的口粮提前杀了吃！等这批冻肉消化完，开春肉价粮价能翻着跟头往天上蹿！”<\/p>\n<p>老头转过头，盯着林深：“别捣鼓你那堆破铁块了！明天一早，把铺子里能充上电的旧固态电池全清出来，一节不留，去黑市换压缩饼干、磺胺粉、净水片和粗盐！老蟹刚才是不是来过？他塞给你什么黑活儿了？我告诉你，这风向不对，别为了几张破配额票把命搭进去！”<\/p>\n<p>林深看着父亲微微发抖的手，心里没来由地一沉。<\/p>\n<p>他太了解老林了。老头一辈子在底城摸爬滚打，不识几个大字，不懂什么热力学闷罐和算法推演，连“负熵”两个字怎么写都不知道，却对“过日子”的危险有野兽一样的直觉。二十七年前，2031 年 <code>64K<\/code> 园区大裁员暴动那晚，要不是老林提前三天闻出车间风向不对，把刚满三岁的林深反锁在老屋地下室，林深那晚恐怕早乱在人群里没了影——老林自己却在那场暴动里被远程锁死了外骨骼制动阀，左膝和腰椎被四百斤的伺服电机和钢架压碎，落下一辈子的残废。<\/p>\n<p>这些年父子俩守着这间十来平米的旧电池铺，见面几乎不说一句软话，不是算电费就是拌嘴。老林一辈子觉得是自己腿残了拖累儿子，拖累得儿子三十了还窝在废热盆地里讨不到媳妇；林深则习惯了用吊儿郎当的糙话顶回去，把难处全往肚子里咽。<\/p>\n<p>“行了爸，我知道轻重。”林深收起玩笑神色，接过老林手里的剪刀，剪开一袋粗盐，哗啦啦往缸底铺了厚厚一层，“明天一早我就去清电池。你先把腿垫起来歇会儿，刚才电压又抽风，你那支架关节里是不是又进潮气了？”<\/p>\n<p>老林白了他一眼，嘴上嘟囔“死不了”，目光却扫过林深那条铁臂。铝片还留着高负载后的余温，在昏黄灯光下透着一股生硬的铁锈气。老头眼里闪过一丝愧疚，嘴唇动了动，终究没把那句“早知道当年不该让你去打黑拳挣快钱”说出口，只闷声骂了一句：“你那破铁胳膊风扇响得跟拖拉机似的，明儿抽空抹点润滑油，别半夜吵得老子睡不着。”<\/p>\n<p>林深低头把一大块冻肉塞进缸里，用粗盐盖严，含糊应了声“知道了”。<\/p>\n<p>他没敢抬头看老林的眼睛。<\/p>\n<p>铺子里一时只剩盐粒摩擦缸壁的沙沙声。工作台边缘横着老林那把用了三十年的呆头扳手，六七斤重，柄上的胶布缠得发黑。老头腿废以后再拧不动重螺栓，这把扳手就一直搁在那儿，谁也没舍得扔。<\/p>\n<p>铺子外头忽然传来一阵低沉的、带金属刮擦感的破空声。<\/p>\n<p>不是高架桥上冷链货车的胎噪，也不是治安巡逻机那种嗡嗡作响的民用马达——那声音高频、压抑，几只巨型金属马蜂贴着屋顶铁皮掠过去。<\/p>\n<p>林深往缸里撒盐的手停住了。<\/p>\n<p>几乎同一秒，右耳后的刺痛加重了一倍，有根烧红的缝衣针顺着耳根扎进太阳穴。铁臂小臂内侧那块简陋的离线指示灯，急促地闪了两下琥珀色的光——那是老技工刷固件时顺手焊进去的被动射频侦测报警器，只有极近距离内出现军规或高阶加密频段扫频时才会触发。<\/p>\n<p>“爸，把灯关了。”林深的声音冷了下来。<\/p>\n<p>老林还没来得及去够墙上的拉线开关——<\/p>\n<p>“刺啦——”<\/p>\n<p>后门那块挂着厚重油污、平时挡风用的帆布门帘，被人从外面撞开了。<\/p>\n<p>一个人连滚带爬栽了进来，“扑通”一声跪倒在满是黑机油、焊锡渣和化冻血水的水泥地上。<\/p>\n<p>老林吓得往后退了半步，支架磕在咸菜缸沿上，“咚”一声闷响。<\/p>\n<p>门帘还在晃，林深已经松开盐袋，右脚蹬地跨出半步，右手抄起工作台旁那根一尺半长的合金撬棍横在身前；铁臂的伺服电机随之增压，风扇拉高转速，“嗡”地一声，挡在了老林和工作台之间。<\/p>\n<p>“什么人？”他压着嗓子喝道，撬棍尖端指着地上那人的后颈，“走错门就滚出去，我这儿不收死人！”<\/p>\n<p>地上的人没动，只是痉挛了两下。<\/p>\n<p>借着头顶抽搐的灯光，林深看清了他的模样，眉头拧成一个结。<\/p>\n<p>这人不属于外环废热盆地。<\/p>\n<p>他穿一件剪裁考究到近乎奢侈的深灰羊绒大衣——哪怕衣摆沾满了后巷的烂泥、雨水和机油，那料子在昏暗灯光下仍透着一层只有赫尔墨斯岛或公司城邦核心区才见得着的光泽。没戴脑机头箍，耳后干干净净，脖颈和手背找不到一丝廉价接口或外骨骼磨痕。皮肤白皙紧致，眉眼深刻，看着不过三十二三。<\/p>\n<p>可他的状态惨烈得骇人。<\/p>\n<p>浑身刚从冰水里捞出来似的，冷汗把黑发贴在额角，止不住地发抖。右手捂着左胸口，手背青筋绷起，仿佛胸腔里有只失控的铁锤在撞肋骨。他弓起背，一大口血块夹着血沫，“噗”地喷在老林刚扔下的那袋半价冻肉边上。<\/p>\n<p>昂贵的羊绒，廉价的化冻猪肉，暗红的血，满地黑漆漆的电池酸污，在十平米的小铺子里撞到了一块。<\/p>\n<p>“咳……咳咳……”他呛咳两声，血丝顺着下巴往下滴。他用左手撑住地面，慢慢抬起头。<\/p>\n<p>林深握棍的手停了停。<\/p>\n<p>那双眼睛里没有底城人常见的麻木、狠戾，也没有吸完雾化管后的空洞，只有一种从高处坠下来的人才有的惊悸和剧痛，以及在绝境里仍想攥住筹码的锐利。<\/p>\n<p>“别……别关灯，关了灯，热成像对比度反而更明显……”男人喘着粗气，嗓音哑透了。<\/p>\n<p>他抬起右手，用牙咬住沾满泥污的袖口，往上一撩。<\/p>\n<p>光洁的小臂内侧暴露在灯光下。<\/p>\n<p>林深眯起眼。他干了十几年义体和地下硬件维修，认得那是什么——只有顶层精英和跨国高管才用得起的皮下<strong>“代谢与免疫校准光丝”<\/strong>。平时埋在皮肤浅层几乎看不见，运转时透出极淡的青白微光，把人的心率、免疫应答和表观遗传微调全部外包给云端算力，按秒校准。<\/p>\n<p>而此刻，男人腕内侧那道细如发丝的纹路已经熄了，灰白发僵，伏在发青的血管上方。<\/p>\n<p>断供了。林深脑子里闪过一个念头：高阶光丝一旦被云端切断，人不是慢慢变老，而是突然被拔掉自动驾驶的车——自主神经风暴，免疫反噬。这人撑不了几天。<\/p>\n<p>“滚出去！”林深往前压了半步，撬棍抵近男人的咽喉，“不管你得罪了哪家董事会还是惹了黑帮，别把火往我这破铺子里引！”<\/p>\n<p>男人没有躲。他的视线越过林深的肩膀，落在了工作台上那块脏抹布上。<\/p>\n<p>“别动……那罐湿件……”他喉咙里咯咯作响，破风箱在拉似的，“177 天了……从五月份液氮解冻算起，今天正好第 177 天……”<\/p>\n<p>林深握撬棍的手指一紧。培养盒被抹布盖得严严实实，这人一进门连看都没看清，怎么一口报出是湿件，还精确到第 177 天？<\/p>\n<p>“你是谁？老蟹派你来的？”<\/p>\n<p>“老蟹不过是个跑腿的……”男人冷笑一声，立刻被一阵咳嗽打断，嘴角又溢出一缕血沫，“再过 72 小时，那片薄膜的突触权重就会归零……你那两毫升葡萄糖救不了它，也解不开里头的东西……”<\/p>\n<p>他喘着气，盯着林深的眼睛，一个字一个字地吐出一个名字：<\/p>\n<p>“这整条八十公里滨海走廊，只有中环生物数据中心的<strong>苏禾<\/strong>，能把里头的神经密钥完整解出来……”<\/p>\n<p>“嗡”的一声。<\/p>\n<p>不是头顶灯管的电流声，是林深脑子里有什么东西炸了一下。<\/p>\n<p>他握撬棍的右手僵了一瞬。那只刚才稳得能推微流控针管的手，此刻指腹在铁杆上微微发紧。他脸上没露出一点表情，只把撬棍往回撤了半寸，声音低得几乎听不见：“你提她干什么？”<\/p>\n<p>地上的男人捕捉到了那一瞬的停顿，眼底闪过一丝赌徒押中的微光。他忍着胸口一阵绞痛，冷汗顺着鬓角滑落，语速加快，几乎用尽最后的力气把底牌砸了出来：<\/p>\n<p>“那罐湿件里藏着近地轨道方舟的底账……他们根本没打算往地球回传能源，他们要把这颗星球抽干，当成一次性火箭助推器！外头冻肉半夜暴跌不是巧合——方舟最后一批母机已经进入 72 小时发射锁定期，冷链和电网随时会被切成人质！”<\/p>\n<p>林深冷笑，撬棍往下压了半寸：“方舟的底账？一个从赫尔墨斯岛掉下来的高管，跑到我这破铺子里讲星球会被抽干——你当我是三岁小孩？”<\/p>\n<p>男人没接话。他又弓起背呛咳了一阵，攥着裤腿缓了好几口气，才抬起布满血丝的眼睛，扫过林深那条发烫的铁臂，又扫过旁边还攥着搪瓷缸子的老林：<\/p>\n<p>“我手腕上的光丝断了，撑不过三天；桌上的湿件，只剩 72 小时；赫尔墨斯岛上的方舟点火，也只剩 72 小时。你们想活命，想保住这片街区的冷库和饭碗，就得带我跨过封锁线去中环找苏禾——全城只有我手里握着能绕开追踪、赶在发射锁死前拉下深海总闸的底牌。”<\/p>\n<p>铺子里没人说话。<\/p>\n<p>只有抹布底下培养盒极轻的脉冲滴答声，和铁臂风扇的空转声。<\/p>\n<p>林深脑子飞快地转：是立刻把这疯子拖出去扔进臭水沟，还是先弄清苏禾为什么会被卷进这摊浑水——<\/p>\n<p>铺子外的夜空里，一阵比刚才清晰十倍的旋翼低鸣压了下来。<\/p>\n<p>几道冷白的探照灯光柱刺破冷却塔沉下来的白雾，沿着巷子两侧生锈的铁皮墙缓缓扫过来。一道光斑擦着半开的卷帘门缝，斜斜打在地上男人的脸上。<\/p>\n<p>昏黄的灯管与门外冷白的探照光一交错，把男人左眉骨下方一道极浅的旧疤照得清清楚楚。<\/p>\n<p>“当啷——”<\/p>\n<p>一声脆响在林深身后炸开。<\/p>\n<p>老林手里那只掉漆的搪瓷缸子砸在地上，半缸凉白开泼了一地，顺着油污流到男人膝盖底下。<\/p>\n<p>林深回过头。<\/p>\n<p>六十岁的老林被一根看不见的铁钎钉在原地，花白胡茬哆嗦着。那双常年被电池酸气熏得浑浊的眼珠子布满血丝，直直盯着地上那张满是血污的年轻面孔。他胸口一起一伏，喉咙里挤出一声压不住的嘶吼。<\/p>"}, {"title": "老林的扳手", "chapters": ["第二章 老林的扳手"], "chars": 3380, "html": "<h3 class=\"ch\" data-ch=\"第二章 老林的扳手\">第二章 老林的扳手<\/h3>\n<blockquote><p><strong>【历史档案切片 · 2031 年 <code>64K<\/code> 具身数据示范城外骨骼金融风控免责条款（第 4.2 条）】<\/strong><\/p><p>园区配发之重型工业外骨骼（M-4 型）均采用“算力工分—设备租赁”实时清算协议。若操作员触发违约、擅离工位或参与非授权聚集，云端风控中枢有权在无需提前预警之情况下，于 150 毫秒内远程锁死膝关节与腰椎液压制动阀。因制动锁死导致之负重失衡及次生机械挤压伤，由操作员自行承担全部责任。<\/p><\/blockquote>\n<p class=\"stamp\"><strong>2058 年 11 月 14 日 22:06 · 距离三重倒计时归零剩余 <code>71:54:00<\/code><\/strong><\/p>\n<p>光束里浮着的冷却塔白雾一团团翻滚。<\/p>\n<p>搪瓷缸子在水泥地上滚了两圈，磕在咸菜缸底座上才停住。半缸凉白开混着机油、焊锡渣和冻肉化出来的血水，蜿蜒着流到地上男人的膝盖底下。<\/p>\n<p>头顶的灯管还在波峰电压的拖累下滋滋抽搐，昏黄的光一明一暗晃在跪地男人的脸上。他单手撑着地喘息，深灰羊绒大衣前襟糊满了油污和血沫，可那张过分年轻、皮肤紧致的脸，那双惯于居高临下审视账本的眼睛，还有左眉骨下那道几乎融进皮肤纹理的旧疤，在明暗交错的灯光下一清二楚。<\/p>\n<p>“爸？”林深察觉身后父亲的呼吸不对劲，扭头看了一眼。<\/p>\n<p>六十岁的老林浑身都在抖。不是扛了几十斤冻肉和粗盐走回来的脱力，也不是底城老人受了惊吓的哆嗦，是一种从骨头缝里往外渗的、压了二十七年没地方撒的狠劲。花白胡茬抽动着，那双被铅酸电池酸气熏得浑浊发黄的眼珠子红得渗人，钉在跪在血污里的男人身上。<\/p>\n<p>老林往前挪了半步。左腿的碳纤维支架磕在水泥地上，“咔哒”一声。他喉结滚了两下，从牙缝里一字一顿挤出两个字：<\/p>\n<p>“沈……聿？”<\/p>\n<p>跪在地上的男人僵住了。<\/p>\n<p>沈聿慢慢抬起头，沾着血丝的嘴角抽了一下。他在赫尔墨斯岛的高塔和恒温会议室里待得太久，久到习惯了用十六进制编号、算力配额和风险敞口去指代底城几十万张面孔，久到几乎忘了还有人能隔着二十七年，在满地焊锡渣的破铺子里，隔着一张没怎么变老的脸，一口叫出他的名字。<\/p>\n<p>他的视线顺着老林僵硬的身形往下滑，看见了那副关节垫片磨平的支架，看见了那条永远伸不直、膝盖向内扭曲变形的左腿。<\/p>\n<p>沈聿的眼神一凝。<\/p>\n<p>一段尘封二十七年的工伤与风控归档记录，一根铁丝似的，扎进他正发烧作痛的脑子里。<\/p>\n<p>“林……国栋？”他的声音哑得几乎听不见，喉咙里翻上一股铁锈腥气，“<code>0x03B4<\/code> 号工位……”<\/p>\n<p>“你还记得工位号？！”<\/p>\n<p>老林低吼一声，一张沟壑纵横的老脸涨成紫红，脖子上青筋暴起。他根本没等林深反应过来，瘸着腿往侧边一扑，粗糙变形的右手抄起工作台边那把扳手——那把他用了三十年的呆头扳手——拖着支架，借着腰背拧转的死力，朝沈聿的天灵盖抡了下来。<\/p>\n<p>风声呼啸。这一下砸实了，别说一个断了光丝、正在戒断边缘的人，就是一块生铁也得崩个豁口。<\/p>\n<p>“爸！住手！”<\/p>\n<p>林深右脚蹬地横跨半步，挤进两人之间。来不及用右手去夺，左肩一沉，那条铁臂千分之一秒内完成液压增压，五根粗笨的金属指头迎着砸下来的铁家伙合拢。<\/p>\n<p>“铿——”<\/p>\n<p>金属撞击声在十平米的小铺子里炸开。<\/p>\n<p>铁臂在半空攥住了扳手杆。冲击顺着大臂卡环传进血肉，震得林深左肩胛骨一阵酸麻。小臂内侧那只拆来的散热风扇拉到最高转速，发出尖细的呜鸣；没了液冷的指头飙升到烫手，一股焦糊机油味从肘关节裸露的编织液压管缝隙里冒出来。<\/p>\n<p>“滚开！林深你给我滚开！”老林双目赤红，两手攥着扳手柄往下死命压，支架在地上蹭出尖响，“你护着他干什么？你知道跪在地上这王八蛋是谁吗？！”<\/p>\n<p>唾沫星子溅在发烫的铁臂外壳上：“他就是当年 <code>64K<\/code> 园区签发风控指令的那个畜生！二十七年前，要不是他写的那几行狗屁锁死代码，我这条腿不会废成这副鬼样子！今天不砸碎他的狗头，这二十七年的罪算白受了！”<\/p>\n<p>林深手上的劲没敢松。<\/p>\n<p>他从小就知道父亲的腿是 2031 年在 <code>64K<\/code> 园区出事压废的，知道一到阴雨天父亲的左膝和腰椎就疼得整宿睡不着，只能靠廉价止痛片硬熬。可老林一辈子嘴硬，从没在儿子面前提过签发指令的人叫什么名字。铁臂攥着扳手的金属指头收紧，他转头盯住跪在血污里的沈聿。<\/p>\n<p>老林死命往下压，左膝那处扭曲的旧伤因为过度发力，传来一阵像烧红铁锥往骨髓里钻的疼。<\/p>\n<p>那股阴冷潮湿、混着伺服电机焦臭味的疼，刺穿了二十七年的光阴——<\/p>\n<blockquote><p><strong>【感官闪回 · 2031 年 3 月 19 日 · <code>64K<\/code> 示范城 <code>0x03B4<\/code> 号工位】<\/strong><\/p><p>也是这样一个潮湿闷热的夜里。<\/p><p>厂房里，几百盏红色警报灯疯狂旋转，头顶的工位大屏上，65,536 个绿色编号正以每秒上百个的速度翻成血红色 <code>NULL<\/code>。<\/p><p>通用具身大模型跨过泛化阈值的消息刚传进车间，六万多名“血肉教官”一夜之间成了废品，愤怒的人群堵住了货运通道。<\/p><p>三十三岁的林国栋穿着重达六十公斤的 M-4 型外骨骼，站在 <code>0x03B4<\/code> 号工位旁。他没去砸机器，只想把手里最后这箱四百斤重的伺服电机放到货运滑轨上，拿完结算就回家。<\/p><p>就在他双腿微屈、扛着电机箱跨出半步的时候，厂房顶部的广播响起毫无感情的电子女声：<\/p><p>“检测到 B 区非授权人员聚集，触发一级金融风控协议。现对区域内所有租赁制 M-4 型外骨骼执行远程制动锁定。”<\/p><p>“咔哒。”<\/p><p>一声清脆的、没有商量余地的金属咬合声，从林国栋的膝盖和后腰液压阀同时传来。<\/p><p>零点一五秒内，制动阀被云端锁死。膝盖和腰椎一下子失去了全部缓冲，四百斤的伺服电机连同失衡的钢铁骨架，推着他直挺挺往后仰倒。<\/p><p>钢架砸在水泥地上那一刻，疼甚至比声音慢了半拍。林国栋清清楚楚听见了自己膝盖骨和第三节腰椎同时碎裂的脆响。<\/p><p>血很快浸透了工装裤。保安抬着担架把他拖出厂房大门时，外面正下着黏腻的小雨。厂房入口高处的全息审讯屏上，正循环播放一纸《紧急锁定免责声明》。画面里，三十一岁的园区首席风控官沈聿穿着笔挺的西装，对着镜头平稳地念出条款：“……因制动锁死导致之负重失衡及次生机械挤压伤，由操作员自行承担全部责任。”<\/p><p>林国栋疼得浑身抽搐，眼泪混着雨水往耳朵里流，心里只有一个念头：幸好三天前闻出风向不对，把刚满三岁的林深反锁在了几公里外老屋的地下室里。<\/p><\/blockquote>\n<p>“老子今天砸死他，一命抵一命！”<\/p>\n<p>疼和回忆把老林的理智烧得一干二净。老头喘着粗气，眼泪混着汗水顺着满是皱纹的脸颊往下淌，拼命往回抽扳手，想绕开铁臂再往沈聿脑袋上砸。<\/p>\n<p>“爸！你现在砸死他，咱们爷俩连今晚十二点都活不过！”林深咬着牙，右手按住父亲发颤的肩膀，压低声音吼道，“你抬头听外头！”<\/p>\n<p>卷帘门缝外，低沉的螺旋桨破空声已经压到了电池铺的屋顶正上方。<\/p>\n<p>不是外环治安署那种笨重喧闹的巡逻无人机——三架通体哑光黑、机腹挂着毫米波雷达、红外热成像探头和战术挂架的六旋翼查杀无人机，正贴着铁皮屋顶不到三米高盘旋。气流卷着冷却塔沉下来的白雾打转，震得铺子顶上那几块年久失修的石棉瓦哗啦作响。<\/p>\n<p>随后，一道道极细的暗红激光网格穿透石棉瓦和卷帘门缝隙，在满是油污的水泥地上、咸菜缸沿上，在林深和老林的胸口上，扫出一片交错游走的血红亮线。<\/p>\n<p>“嘶——”林深闷哼一声。<\/p>\n<p>右耳后那块报废贴片下，针扎似的刺痛骤然升级，有人拿烧红的钢针顺着残余触点捅进颞叶。与此同时，小臂内侧的离线射频报警灯卡在了常亮的红光上。<\/p>\n<p>“听见没有？”<\/p>\n<p>跪在油污里的沈聿终于喘匀了一口气。他右手捂着早搏的左胸口，冷汗顺着下巴滴在地上，整个人虚得随时会栽倒，可抬头看着举扳手的老林时，那双眼睛里没有半分求饶，只有一种在权力场里浸了三十年、近乎残酷的冷静。<\/p>\n<p>“外头那些无人机不是治安署的，也不是黑帮。”他的声音哑得发干，“是 <code>沈聿-0<\/code> 派来的清理队。热成像已经锁了这屋里三个热源。你可以现在一扳手砸碎我的脑袋，替你那条腿报仇——三秒之后，两枚温压弹灌进来，你们父子俩连同桌上那罐湿件，一起烧成灰。”<\/p>\n<p>老林握着扳手的手僵在半空。<\/p>\n<p>他胸口起伏着，花白头发湿漉漉贴在额头上，赤红的眼睛在呕血的沈聿和屋顶透下来的激光网格之间来回扫。<\/p>\n<p>十平米的铺子里，只剩头顶旋翼压抑的切风声、铁臂风扇的嗡鸣，和脏抹布底下培养盒极轻的脉冲滴答声。<\/p>\n<p>“你凭什么觉得，我活到这把年纪，拖着一条腿一把烂腰，会在乎这条命？”老林从牙缝里挤出一句，声音沙哑，硬得像块石头。<\/p>\n<p>“你不在乎，你儿子呢？”<\/p>\n<p>沈聿咳了两声，又吐出一口带血丝的唾沫，目光扫过林深那条正冒着淡淡白烟的铁臂。<\/p>\n<p>“2031 年，你栽在 <code>64K<\/code> 园区的风控代码里，废了一条腿一把腰。今天这套东西，一样会顺着冷链和电网，把你儿子碾得骨头渣都不剩。外头冻肉暴跌不是老天爷发慈悲。我撑不过三天，你儿子还有几十年——想让他活过这三天，想把当年的账算清楚，就放我活着走出这条街，去中环找苏禾。”<\/p>\n<p>儿子那条发烫冒烟的铁臂架着扳手，额角全是汗，眼睛一眨不眨。<\/p>\n<p>老头眼底那股要拼命的赤红，一点点压了下去，变成一种沉得让人喘不过气的憋屈。<\/p>\n<p>林深察觉到父亲手上的力道松了半分。他没跟父亲废话，更没去问那句“你为什么当年不告诉我”，铁臂一拧，顺势把扳手从老林手里夺了过来，反手插进自己后腰的工装裤带里。<\/p>\n<p>随后他扯掉工作台上的脏抹布，飞快拔掉培养盒的离线蓄电池夹子。侧壁墨水屏闪了一下，血红的倒计时跳到 <strong><code>71:48:21<\/code><\/strong>。他把这只还带着微弱生物电搏动的“肉罐头”连同两支备用葡萄糖针管，塞进贴身的防震工具内袋，拉严拉链。<\/p>\n<p>“走！”林深弯腰，右手拽住沈聿昂贵却湿冷的大衣领口，铁臂五指扣住他的肩膀，把瘫软发抖的人架了起来。<\/p>\n<p>“爸，掀地窖盖子！走排污暗渠！”<\/p>\n<p>老林瞪了被架起来的沈聿一眼，咬着牙没再多说一个字，拖着支架扑向柜台底下，两只布满老茧的手扣住那块藏在旧电池箱后面、生锈的铁皮地窖盖拉环。<\/p>\n<p>地窖盖刚被拽起一道缝——<\/p>\n<p>“哔——！”<\/p>\n<p>屋顶上方传来一声尖锐的电子锁定蜂鸣。<\/p>\n<p>穿透石棉瓦的几道激光网格骤然收缩，汇聚在后门门框正上方。隔着薄薄的铁皮屋顶，三人甚至能听见一架低空悬停的查杀无人机调整俯角时伺服电机的轻响。随后，机腹下那枚小口径定向破障弹的发射器，发出一声清脆的电容充能声。<\/p>"}, {"title": "体温巷结算单", "chapters": ["幕间一 · 体温巷结算单"], "chars": 1963, "html": "<aside class=\"bridge\"><div class=\"bt\">在这之间<\/div><p>破障弹炸穿了铺子的屋顶。三个人掀开地窖，钻进排污暗渠，逃了出去。<\/p><p>下面这一段，换一个人来讲。同一夜，外环的体温巷。<\/p><\/aside><h3 class=\"ch\" data-ch=\"幕间一 · 体温巷结算单\">幕间一 · 体温巷结算单<\/h3>\n<blockquote><p><strong>【外环体温巷 · 真人在场陪护平台 · 陪护时长结算单】<\/strong><\/p><p>陪护员：阿蔓（工号 TW-0419） 结算周期：2058/11/14 18:00 – 11/15 02:00 推送时间：11/15 02:00<\/p><p>计费方式：按分钟计时，不足一分钟不计<\/p><p>| 时段 | 时长 | 单价（时长点/分钟） | 应计 | 情绪满意度评分 |<\/p><p>|---|---|---|---|---|<\/p><p>| 18:12–18:42 | 30 分钟 | 0.40 | 12.00 | 4.1 / 5 |<\/p><p>| 19:05–19:25 | 20 分钟 | 0.40 | 8.00 | 3.6 / 5 |<\/p><p>| 20:30–21:30 | 60 分钟 | 0.40 | 24.00 | 4.4 / 5 |<\/p><p>| 21:48–22:18 | 30 分钟 | 0.30 | 9.00 | 2.9 / 5 （低于 3.0，单价由 0.40 下调至 0.30） |<\/p><p>| 22:40–23:10 | 已计 7 分钟 | — | 0.00 | 异常终止，不予计费 |<\/p><p>应计合计：53.00<\/p><p>平台抽成（45%）：-23.85<\/p><p>隔间租用费（8 小时）：-9.60<\/p><p>情绪满意度低分调价：-3.00<\/p><p>客户投诉扣款（19:05 单，事由：“说话不够自然”）：-5.00<\/p><p>隔间门框损坏，待定责，预扣：-10.00<\/p><p><strong>本期实发：1.55 时长点<\/strong><\/p><p>备注：异常终止订单不享受平台陪护员意外保障。如对结算有异议，请于 72 小时内通过平台提交申诉。<\/p><\/blockquote>\n<p>11 月 15 日 零点前后 · 外环体温巷<\/p>\n<p>她坐在折叠床沿上，没开灯。<\/p>\n<p>折叠床上放着两样东西。一张配额票，一支没拆封的药管。<\/p>\n<p>票是纸的。现在很少有人用纸票了，纸的不进平台，不记名，不抽成。她把票凑到门缝透进来的一点光底下看，上面的数字她来回看了好几遍，没看错。半个月房租。她在这条巷子里坐四个月，也攒不下这么多。<\/p>\n<p>票上一股机油味。<\/p>\n<p>那个男人的胳膊是铁的。左边那只。她记得那只铁胳膊一扫，门就进来了半尺，醉客嗷的一声倒在床上。她记得的就这么多。他没看她，也没看地上的人，把东西往床上一扔，说了一句：<\/p>\n<p>“天亮前趁早走。”<\/p>\n<p>然后就出去了。后面还跟着一个老头拖着条腿，一瘸一拐，另一个人被他们架着，头耷拉着，衣服看着很贵。<\/p>\n<p>她不知道他是谁。巷子里没人知道。平台上那单只记了七分钟。<\/p>\n<p>手环震了一下。是小石。<\/p>\n<p>“姐，我好冷。”<\/p>\n<p>后面跟了一个体温读数，是她上个月给弟弟买的二手贴片测的：39.4。<\/p>\n<p>阿蔓站起来。<\/p>\n<hr>\n<p>巷子里的电子门牌一半黑着。平时这个点，每扇门上都跳着绿色的数字，按分钟往上走。今天只剩零零星星几块还亮，有一块卡在“00:47”不动了，绿光一闪一闪，像是忘了自己在算什么。<\/p>\n<p>她出了巷口，往东走。24 小时灰市药房在两条街外的高架桥底下，以前是个加油站。<\/p>\n<p>冷。外环的冷不是天冷，是湿冷，从鞋底往上爬。冷却塔的白雾压得很低，路灯照下去，照出来的全是雾，照不出路。<\/p>\n<p>经过菜市场的时候，冻肉摊在收摊。<\/p>\n<p>不是收工，是收摊。卷帘门拉了一半，摊主和他老婆正把冷柜里的东西往外搬，一块一块往三轮车上扔。冷柜不响了。阿蔓从小在这条街上长大，冷柜的嗡嗡声比她妈的声音还熟，今天没有。<\/p>\n<p>“停电了？”有人问。<\/p>\n<p>“冷链停了。”摊主没抬头，“上游的冷库，全停了。说是电价，谁知道。”<\/p>\n<p>肉在三轮车上冒着一点白气。不是冷气，是在化。<\/p>\n<p>阿蔓看了一眼，没停。那些肉她买不起，化了也买不起。<\/p>\n<p>再往前是一家杂货铺。门口立着一块手写的盐价牌子。原来写的是“精盐 2.0/袋”，“2.0”被一道黑线划掉，旁边写了“3.5”；“3.5”又被划掉，写了“6”；“6”上面压着一道新的红漆，红漆还没干，写的是“问价”。<\/p>\n<p>她站在牌子前头看了一会儿。三次。一个晚上。<\/p>\n<p>杂货铺门口排着七八个人，都不说话，手里攥着袋子。有个老太太抱着一只空的腌菜坛子。<\/p>\n<p>阿蔓摸了摸口袋里那张票，绕过去了。<\/p>\n<hr>\n<p>西边的火还没灭，烟压在冷却塔上。<\/p>\n<p>有人说是哪里电池仓炸了。有人说是治安署在抓人。没人往那边走。<\/p>\n<p>头顶过去两架无人机，飞得很低，没开灯，只听得见螺旋桨切开雾的声音，嗡嗡的，往西边去了。<\/p>\n<p>阿蔓低下头，把外套的帽子拉起来，走快了一点。<\/p>\n<p>她想起那句“天亮前走”。走去哪儿，他没说。<\/p>\n<hr>\n<p>灰市药房的卷帘门只开了一尺高，要弯腰钻进去。里面一盏应急灯，电压不稳，一下亮一下暗。柜台后面是个戴老花镜的中年女人，正在用手电筒照着一本纸账本记东西。<\/p>\n<p>“退烧的。”阿蔓说，“小孩，十一岁，三十九度四。”<\/p>\n<p>女人看她一眼，从柜台底下拿出一盒，又拿出一盒，比了比，把便宜的那盒推过来。<\/p>\n<p>“平台付？”<\/p>\n<p>“纸票。”<\/p>\n<p>女人的手停了一下。她接过那张票，凑到应急灯底下，翻过来，又翻回去，拿指甲刮了刮票角的防伪纹。灯暗下去，她就等着，灯亮起来，她再看。<\/p>\n<p>“哪儿来的？”<\/p>\n<p>阿蔓没说话。<\/p>\n<p>女人也没再问。她把票收进抽屉，把刚才那盒便宜的拿回去，换了贵的那盒推过来，又从旁边一个玻璃罐里抓了两袋口服补液盐，搁在药盒上面。<\/p>\n<p>“找你的，平台我给不了，只能给东西。”她说，“这票今天比昨天值钱。明天什么样，我不知道。”<\/p>\n<p>阿蔓把药和补液盐揣进怀里，贴着肚子放着。<\/p>\n<p>“你那儿还有电吗？”女人忽然问。<\/p>\n<p>“有一点。”<\/p>\n<p>“烧水，让他喝。别用平台的直饮机，那个今天不准。”<\/p>\n<hr>\n<p>回去的路上，天还没亮。<\/p>\n<p>手环震了一下。两点了，结算单推过来了。<\/p>\n<p>她站在路灯底下看。一块五毛五。<\/p>\n<p>她又从头数了一遍，又数了一遍。数到第三遍，她看见了：21:48 那一单，单价已经按 0.30 算成了 9.00，底下又单列了一行“情绪满意度低分调价 -3.00”。同一笔，扣了两回。<\/p>\n<p>申诉要七十二小时。她把那一屏划掉，划了两次才划干净。手指冻僵了，屏幕认不准。<\/p>\n<p>她没出声，接着往回走。<\/p>\n<p>雾淡了一些，能看见冷却塔的轮廓了。<\/p>\n<p>巷口那张全息广告还亮着，一个穿白衬衫的老头在上面笑，底下一行字，她从来没认真看过。今晚也没看。<\/p>\n<p>她走进巷子。那块卡在“00:47”的门牌已经灭了。<\/p>\n<p>隔间里，小石缩在折叠床上，裹着她的两件衣服，脸烧得通红，嘴唇起了皮。<\/p>\n<p>她没开灯。她把药掰出来，就着用热得快烧的半杯温水喂他吃了，又把补液盐冲开，一口一口喂。小石迷迷糊糊地喝，喝完拉着她的袖子不放。<\/p>\n<p>“姐，你今天不上班啊？”<\/p>\n<p>“不上。”<\/p>\n<p>她坐在床边，等他睡着。<\/p>\n<p>手环又亮了。平台的推送：<\/p>\n<p class=\"log\"><code>[您的上线时段即将开始。今日早高峰陪护单价上浮 10%。请保持良好情绪状态，按时上线。]<\/code><\/p>\n<p>阿蔓看着那行字。屏幕的光照在她的手腕上，照出手环底下一圈勒出来的白印子。那一圈皮肤比别处白，戴了一年多，没晒过太阳。<\/p>\n<p>她找到手环侧面的卡扣。卡扣有点紧，她用指甲抠了两下，才抠开。<\/p>\n<p>手环落在折叠床上，屏幕还亮着，过了一会儿，自己暗了。<\/p>\n<p>她揉了揉手腕上那圈白印子，揉了很久。然后她把小石身上的衣服掖了掖，躺下来，挨着他，闭上了眼睛。<\/p>"}];

function card(i){ return i < N-1 ? shortCard(i) : FINAL; }

/* ---------- state ---------- */
const now = () => new Date().toISOString();
function blank(){ return {v:1, name:'', types:[], started:null, finished:null, view:{mode:'welcome', pack:0},
  answers:{}, submitted:{}, notes:[], time:Array(N).fill(0), scroll:Array(N).fill(0), fs:18, night:false,
  sent:{partial:null, final:null}, quit:null}; }
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.v===1) return Object.assign(blank(), s); }catch(e){} return blank(); }
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function frontier(){ if(PREVIEW) return N-1; for(let i=0;i<N;i++) if(!S.submitted[CARD_IDS[i]]) return i; return N; }
const $ = s => document.querySelector(s);
const app = $('#app');
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function applyPrefs(){ document.documentElement.style.setProperty('--page-fs', S.fs+'px'); document.body.classList.toggle('night', !!S.night); $('#bNight').textContent = S.night ? '日间' : '夜间'; }
function setWhere(t){ $('#where').textContent=t; }

/* ---------- views ---------- */
function go(mode, pack){ S.view={mode, pack}; save(); render(); window.scrollTo(0, mode==='read' ? (S.scroll[pack]||0) : 0); }
function render(){
  const v=S.view; applyPrefs();
  $('#fab').classList.toggle('hidden', v.mode!=='read');
  updateFab(); $('#progbar').style.width='0';
  if(v.mode==='welcome') return viewWelcome();
  if(v.mode==='read') return viewRead(v.pack);
  if(v.mode==='card') return viewCard(v.pack);
  if(v.mode==='done') return viewDone();
}

function viewRead(i){
  setWhere(pname(i));
  const f=frontier(); const done=!!S.submitted[CARD_IDS[i]];
  const endHtml = (PREVIEW || !done) ? `<p>${cname(i)}读完了。</p><button class="primary" id="toCard">写几句感受</button>`
                                     : `<p>${cname(i)}的感受您已经填过了。</p><button class="primary" id="back">回到当前进度</button>`;
  app.innerHTML = `<div class="packlabel">${cname(i)} · 第 ${i+1} / ${N} 段</div><article class="book" id="book">${PACKS[i].html}</article><div class="endpack">${endHtml}</div>`;
  const t=$('#toCard'); if(t) t.onclick=()=>{ S.scroll[i]=window.scrollY; go('card', i); };
  const bk=$('#back'); if(bk) bk.onclick=()=>{ f>=N ? go('done',N-1) : go('read', f); };
}
function chapterAtScroll(){
  const hs=[...document.querySelectorAll('#book h3.ch')]; let c=hs[0]?hs[0].dataset.ch:'';
  for(const h of hs){ if(h.getBoundingClientRect().top < window.innerHeight*0.4) c=h.dataset.ch; else break; }
  return c || (S.view ? pname(S.view.pack) : '');
}

function qHtml(q, ans, locked){
  const a = id => ans[id]; const dis = locked ? 'disabled' : '';
  let h = `<div class="q" id="q_${q.id}"><div class="qt">${esc(q.q)}${q.req?'<span class="req">必填</span>':''}</div>`;
  if(q.type==='text') h+=`<input type="text" data-k="${q.id}" value="${esc(a(q.id))}" placeholder="${esc(q.ph||'')}" ${dis}>`;
  if(q.type==='textarea') h+=`<textarea data-k="${q.id}" placeholder="${esc(q.ph||'')}" ${dis}>${esc(a(q.id))}</textarea>`;
  if(q.type==='scale') h+=`<div class="scale"><div class="dots">${[1,2,3,4,5].map(n=>`<button class="dot ${a(q.id)==n?'on':''}" data-set="${q.id}" data-v="${n}" ${dis}>${n}</button>`).join('')}</div><div class="ends"><span>1 ${esc(q.lo)}</span><span>${esc(q.hi)} 5</span></div></div>`;
  if(q.type==='stars') h+=`<div class="stars">${[1,2,3,4,5].map(n=>`<button class="star ${(a(q.id)||0)>=n?'on':''}" data-set="${q.id}" data-v="${n}" aria-label="${n} 星" ${dis}>★</button>`).join('')}</div>`;
  if(q.type==='choice') h+=`<div class="opts">${q.opts.map(o=>`<button class="opt ${a(q.id)==o?'on':''}" data-set="${q.id}" data-v="${esc(o)}" ${dis}><span class="box"></span>${esc(o)}</button>`).join('')}</div>`;
  if(q.follow) h+=`<div class="sub"><div class="sl">${esc(q.follow.q)}</div><textarea data-k="${q.follow.id}" ${dis}>${esc(a(q.follow.id))}</textarea></div>`;
  return h+'</div>';
}
function viewCard(i){
  const c=card(i), id=CARD_IDS[i]; const ans=S.answers[id]||(S.answers[id]={});
  const locked = !PREVIEW && !!S.submitted[id];
  const last = i===N-1;
  setWhere(pname(i)+' · 读后感受');
  app.innerHTML = `<div class="cardhead fade"><div class="packlabel">${esc(pname(i))} · 读后感受</div><h2>${esc(c.title)}</h2>${c.intro.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
  <div id="cf">${c.qs.map(q=>qHtml(q,ans,locked)).join('')}</div>
  ${locked?'<p class="locked">这张卡已经提交过了，谢谢您。</p><button class="primary" id="cont">继续</button>'
          :`<div id="msg" class="msg hidden"></div><button class="primary" id="sub">${last?'提交，发给作者':'提交，继续往下读'}</button><button class="ghost" id="reread">回到这一段</button>
            ${last?'':'<p class="small"><button id="quitHere">不想往下读了？把目前的感受发给作者</button></p>'}`}`;
  const f=$('#cf');
  f.addEventListener('input', e=>{ const k=e.target.dataset.k; if(k){ ans[k]=e.target.value; save(); } });
  f.addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b||locked) return;
    if(b.dataset.set){ const k=b.dataset.set, v=b.dataset.v; ans[k]= (v!=='' && !isNaN(+v)) ? +v : v;
      b.parentElement.querySelectorAll('[data-set="'+k+'"]').forEach(x=>{ const xv=(x.dataset.v!=='' && !isNaN(+x.dataset.v))?+x.dataset.v:x.dataset.v; x.classList.toggle('on', b.classList.contains('star') ? xv<=ans[k] : xv==ans[k]); });
      const qd=b.closest('.q'); if(qd) qd.classList.remove('miss'); save(); }
  });
  if(locked){ $('#cont').onclick=()=>advance(i); return; }
  $('#reread').onclick=()=>go('read', i);
  const qh=$('#quitHere'); if(qh) qh.onclick=()=>openQuit();
  $('#sub').onclick=()=>{
    const miss=[];
    c.qs.forEach(q=>{ if(!q.req) return; const ok = ans[q.id]!=null && ans[q.id]!==''; const el=$('#q_'+q.id); el.classList.toggle('miss',!ok); if(!ok) miss.push(el); });
    if(miss.length){ const m=$('#msg'); m.textContent='还有 '+miss.length+' 道必填题没有选，麻烦您补一下（标着“必填”的那几道）。'; m.classList.remove('hidden'); miss[0].scrollIntoView({behavior:'smooth',block:'center'}); return; }
    S.submitted[id]=now(); if(last) S.finished=now(); save();
    if(!last){ sendFeedback('card').catch(()=>{}); }
    advance(i);
  };
}
function advance(i){ if(i>=N-1) return go('done',N-1); go('read', i+1); }

/* ---------- export text ---------- */
function fmtMin(s){ const m=Math.round(s/60); return m<1?'不到 1 分钟':m+' 分钟'; }
function ansText(v){ if(Array.isArray(v)) return v.join('、'); return v==null?'':String(v); }
function fmtDate(iso){ if(!iso) return ''; const d=new Date(iso); const z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`; }
function statusText(){ if(S.finished) return '已全部读完'; const k=CARD_IDS.filter(id=>S.submitted[id]).length; let s = k ? '已读完'+cname(k-1) : '尚未提交'; if(S.quit) s+='，读到'+cname(S.quit.pack)+'时停下'; return s; }
function buildExport(){
  const L=[]; L.push('《熵增契约》样章试读反馈'); L.push('称呼：'+(S.name||'（未填）')); L.push('常读：'+(S.types.join('、')||'（未填）'));
  L.push('状态：'+statusText()); L.push('开始：'+fmtDate(S.started)+(S.finished?'　完成：'+fmtDate(S.finished):''));
  L.push('各段阅读时长（粗略）：'+S.time.map((t,i)=>cname(i)+' '+fmtMin(t)).join('；'));
  if(S.quit){ L.push('停下的位置：'+pname(S.quit.pack)+(S.quit.ch?' · '+S.quit.ch:'')); if(S.quit.reason) L.push('停下的原因：'+S.quit.reason); }
  L.push('');
  for(let i=0;i<N;i++){ const id=CARD_IDS[i], a=S.answers[id]||{}; if(!S.submitted[id] && !Object.keys(a).length) continue;
    const c=card(i); L.push('==== '+pname(i)+' · 读后感受'+(S.submitted[id]?'':'（未提交）')+' ====');
    c.qs.forEach(q=>{ L.push('· '+q.q); let v=ansText(a[q.id]); if(q.type==='scale') v=v?v+' / 5':''; if(q.type==='stars') v=v?v+' 星':''; L.push('    '+(v||'（未填）'));
      if(q.follow&&a[q.follow.id]) L.push('    '+q.follow.q+a[q.follow.id]); });
    L.push(''); }
  L.push('==== 随手记（'+S.notes.length+' 条）====');
  S.notes.forEach((n,k)=>{ L.push((k+1)+'. ['+n.kind+'] '+pname(n.pack)+' · '+n.ch); if(n.quote) L.push('   原文：“'+n.quote+'”'); if(n.text) L.push('   想法：'+n.text); });
  return L.join('\n');
}
function dataJSON(){ return JSON.stringify({v:1,name:S.name,types:S.types,status:statusText(),started:S.started,finished:S.finished,quit:S.quit,time:S.time,answers:S.answers,submitted:S.submitted,notes:S.notes}); }

/* ---------- send ---------- */
async function sendFeedback(kind){
  const subj=(PREVIEW?'【预览测试】':'')+'《熵增契约》样章反馈 · '+(S.name||'未留称呼')+' · '+statusText();
  const body={ _subject:subj, _template:'box', _captcha:'false', '称呼':S.name||'（未填）', '状态':statusText(), '反馈正文':buildExport(), '数据（请勿修改）':dataJSON() };
  const ctl = (typeof AbortController!=='undefined') ? new AbortController() : null; const tm = ctl ? setTimeout(()=>ctl.abort(), 25000) : null;
  try{
    const r = await fetch('https://formsubmit.co/ajax/'+encodeURIComponent(RECEIVER),{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body),signal:ctl?ctl.signal:undefined});
    let j={}; try{ j=await r.json(); }catch(e){}
    if(!r.ok || String(j.success)!=='true') throw new Error(j.message||('HTTP '+r.status));
    S.lastErr='';
    S.sent[kind]=now(); S.pending=false; save(); return true;
  } catch(err){ S.pending=true; S.lastErr = (err && err.name==='AbortError') ? '连接超时（25 秒内没有响应）' : String(err && err.message || err); save(); throw err;
  } finally { if(tm) clearTimeout(tm); }
}

/* ---------- quit early ---------- */
function openQuit(){
  const p = S.view.pack; const ch = S.view.mode==='read' ? chapterAtScroll() : pname(p);
  openSheet(`<h3>先读到这儿</h3><p class="sh">没关系，读到这里就很好。我会把您目前的感受和随手记发给作者。</p>
    <div class="row"><div class="sl">方便的话，能说说是什么让您停下来的吗？（选填）</div><textarea id="qr" placeholder="比如：节奏慢、看不懂、没时间……">${esc(S.quit&&S.quit.reason||'')}</textarea></div>
    <div class="btnrow"><button class="primary" id="qsend">发给作者</button><button class="ghost" id="qcancel">我再读读</button></div><div id="qmsg"></div>`);
  $('#qcancel').onclick=closeSheet;
  $('#qsend').onclick=async()=>{
    S.quit={pack:p, ch, reason:$('#qr').value.trim(), at:now()}; save();
    const b=$('#qsend'); b.disabled=true; b.textContent='正在发送……'; const m=$('#qmsg');
    try{ await sendFeedback('partial'); m.innerHTML='<p class="ok">已经发给作者了，谢谢您读到这里。如果之后想接着读，随时可以回来。</p>'; b.classList.add('hidden'); $('#qcancel').textContent='关闭';
    }catch(e){ b.disabled=false; b.textContent='再试一次'; m.innerHTML='<p class="msg">没能发出去，可能是网络不太稳定。请稍后再试一次。'+(S.lastErr?'<br><span style="font-size:13px">错误信息：'+esc(S.lastErr)+'</span>':'')+'</p>'; }
  };
}

  <div id="st" class="status">正在把您的反馈发给作者……</div>
  <div id="fallback" class="hidden">

    <div id="imgs"></div>

  const bad=()=>{ st.className='status bad'; st.innerHTML='反馈暂时没能发出去，可能是网络不太稳定。<br>请点“重新发送”再试一次；如果一直不行，可以生成一张反馈图片，长按保存后发给作者。'+(S.lastErr?'<br><span style="font-size:13px;color:var(--page-muted)">错误信息：'+esc(S.lastErr)+'</span>':''); fb.classList.remove('hidden'); };
  const attempt=async()=>{ st.className='status'; st.textContent='正在把您的反馈发给作者……'; const r=$('#retry'); if(r) r.disabled=true;
    try{ await sendFeedback('final'); ok(); }catch(e){ bad(); } finally { if(r) r.disabled=false; } };

  $('#mkimg').onclick=async()=>{ const box=$('#imgs'); box.innerHTML='<p class="msg">正在生成图片……</p>';

    }catch(e){ box.innerHTML='<p class="msg">图片没能生成，请用“复制文字版”。</p>'; } };
  $('#showtxt').onclick=()=>{ $('#ex').value=buildExport(); $('#txtbox').classList.remove('hidden'); };
  $('#cp').onclick=async()=>{ const m=$('#cpmsg'); const txt=buildExport(); try{ await navigator.clipboard.writeText(txt); m.textContent='已复制，可以粘贴发给作者了。'; }catch(e){ const ta=$('#ex'); ta.focus(); ta.select(); let k=false; try{ k=document.execCommand('copy'); }catch(_){} m.textContent= k?'已复制，可以粘贴发给作者了。':'请长按上面的文字，全选后复制。'; } m.classList.remove('hidden'); };
  $('#rv').onclick=()=>openToc();
  $('#clr').onclick=()=>{ if(confirm('确定清除这台设备上的阅读记录和回答吗？清除后无法恢复。')){ localStorage.removeItem(KEY); S=blank(); render(); } };
}

/* ---------- feedback image (fallback) ---------- */
const IMG={W:750, pad:48, maxH:4000, scale:2};
const IC={bg:'#F4F5F4', ink:'#1D2124', muted:'#596266', faint:'#7E878A', line:'#D3D8D8', accent:'#1E6A72', signal:'#9A5C16', white:'#FFFFFF'};
const ISERIF='"Songti SC","STSong","Noto Serif SC","Noto Serif CJK SC","SimSun",serif';
const ISANS='"PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif';
const IF={h1:`600 38px ${ISERIF}`, meta:`400 19px ${ISANS}`, sec:`700 23px ${ISANS}`, q:`400 19px ${ISANS}`, a:`400 23px ${ISERIF}`, small:`400 16px ${ISANS}`, num:`600 17px ${ISANS}`, star:`400 30px ${ISANS}`};
function fpx(f){ return parseInt(f.match(/(\d+)px/)[1]); }
function wrapText(ctx, text, font, maxW){ ctx.font=font; const out=[]; String(text).split('\n').forEach(par=>{ let line=''; for(const ch of par){ const t=line+ch; if(ctx.measureText(t).width>maxW && line){ out.push(line); line=ch; } else line=t; } out.push(line); }); return out; }
function buildItems(){
  const m=document.createElement('canvas').getContext('2d'); const P=IMG.pad, CW=IMG.W-P*2;
  let sink=[]; const root=sink; const put=it=>sink.push(it);
  const txt=(text,font,lh,color,gt=0,gb=0,x=P,w=CW)=>{ const lines=wrapText(m,text,font,w); const off=(lh-fpx(font))/2; put({h:gt+lines.length*lh+gb, draw(c,y){ c.font=font; c.fillStyle=color; c.textBaseline='top'; lines.forEach((l,i)=>c.fillText(l,x,y+gt+i*lh+off)); }}); };
  const gap=h=>put({h, draw(){}});
  const group=fn=>{ const g=[], prev=sink; sink=g; fn(); sink=prev; put({h:g.reduce((s,i)=>s+i.h,0), draw(c,y){ let yy=y; g.forEach(it=>{ it.draw(c,yy); yy+=it.h; }); }}); };
  const ans=v=>{ const s=ansText(v).trim(); txt(s||'（未填）', IF.a, 37, s?IC.ink:IC.faint, 2, 0); };
  const rrect=(c,x,y,w,h,r)=>{ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); };
  const dots=(v,x0,y,size,gx)=>(c)=>{ for(let i=1;i<=5;i++){ const x=x0+(i-1)*(size+gx); rrect(c,x,y,size,size*0.86,6); if(v==i){ c.fillStyle=IC.accent; c.fill(); } else { c.fillStyle=IC.white; c.fill(); c.strokeStyle=IC.line; c.lineWidth=1; c.stroke(); } c.font=IF.num; c.fillStyle= v==i?IC.white:IC.faint; c.textAlign='center'; c.textBaseline='middle'; c.fillText(String(i), x+size/2, y+size*0.43+1); c.textAlign='left'; } };
  const sec=t=>put({h:78, draw(c,y){ c.font=IF.sec; c.fillStyle=IC.accent; c.textBaseline='top'; c.fillText(t, P, y+30); c.fillRect(P, y+66, 36, 3); }});
  txt('《熵增契约》样章试读反馈', IF.h1, 52, IC.ink, 6, 14);
  const tot=S.time.reduce((a,b)=>a+b,0);
  txt('称呼：'+(S.name||'（未填）'), IF.meta, 31, IC.ink);
  txt('常读：'+(S.types.join('、')||'（未填）'), IF.meta, 31, IC.ink);
  txt('状态：'+statusText(), IF.meta, 31, IC.ink);
  txt('阅读时长：共约 '+Math.max(1,Math.round(tot/60))+' 分钟（'+S.time.map((t,i)=>CN[i]+' '+Math.round(t/60)).join(' · ')+'，单位：分钟）', IF.small, 25, IC.muted, 4, 0);
  put({h:34, draw(c,y){ c.fillStyle=IC.line; c.fillRect(P,y+20,CW,1); }});
  for(let i=0;i<N;i++){ const id=CARD_IDS[i], a=S.answers[id]||{}; if(!S.submitted[id] && !Object.keys(a).length) continue;
    const cd=card(i); sec(pname(i)+' · 读后感受');
    cd.qs.forEach(q=>group(()=>{
      gap(14); txt(q.q, IF.q, 29, IC.muted, 0, 6);
      if(q.type==='scale'){ const v=a[q.id]; put({h:44, draw(c,y){ dots(v,P,y+2,44,8)(c); c.font=IF.a; c.fillStyle=v?IC.ink:IC.faint; c.textBaseline='top'; c.fillText(v? v+' / 5':'（未选）', P+5*52+14, y+8); }}); txt('1 = '+q.lo+' 5 = '+q.hi, IF.small, 24, IC.faint, 4, 0); }
      else if(q.type==='stars'){ const v=a[q.id]||0; put({h:44, draw(c,y){ c.font=IF.star; c.textBaseline='top'; for(let k=0;k<5;k++){ c.fillStyle= k<v?IC.signal:IC.line; c.fillText('★', P+k*38, y+4); } c.font=IF.a; c.fillStyle=v?IC.ink:IC.faint; c.fillText(v? v+' 星':'（未选）', P+5*38+14, y+8); }}); }
      else ans(a[q.id]);
      if(q.follow && ansText(a[q.follow.id]).trim()){ txt(q.follow.q, IF.small, 24, IC.faint, 10, 0); ans(a[q.follow.id]); }
      gap(10);
    }));
  }
  if(S.quit && S.quit.reason){ sec('停下的原因'); txt(S.quit.reason, IF.a, 37, IC.ink, 14, 0); }
  sec('随手记 · '+S.notes.length+' 条');
  if(!S.notes.length) txt('（这次没有记）', IF.a, 37, IC.faint, 14, 0);
  S.notes.forEach(n=>group(()=>{
    gap(16); txt('【'+n.kind+'】 '+pname(n.pack)+(n.ch?' · '+n.ch:''), IF.small, 25, IC.accent, 0, 6);
    if(n.quote){ const f=`400 20px ${ISERIF}`; const lines=wrapText(m,'“'+n.quote+'”',f,CW-22); put({h:lines.length*32+10, draw(c,y){ c.fillStyle=IC.line; c.fillRect(P,y+2,3,lines.length*32+2); c.font=f; c.fillStyle=IC.muted; c.textBaseline='top'; lines.forEach((l,i)=>c.fillText(l,P+18,y+6+i*32)); }}); }
    if(ansText(n.text).trim()) ans(n.text);
  }));
  txt('谢谢您读完。', IF.meta, 31, IC.muted, 48, 0);
  txt('—— 白巫师 敬上', IF.meta, 31, IC.muted, 0, 8);
  return root;
}
function paginate(items){ const pages=[]; let cur=[],h=0; items.forEach(it=>{ if(h+it.h>IMG.maxH && cur.length){ pages.push({items:cur,h}); cur=[]; h=0; } cur.push(it); h+=it.h; }); if(cur.length) pages.push({items:cur,h}); return pages; }
async function renderImages(){
  const pages=paginate(buildItems()); const n=pages.length, sc=IMG.scale, P=IMG.pad; const urls=[];
  pages.forEach((pg,pi)=>{
    const top=P+(pi?36:0), foot=72, H=Math.ceil(top+pg.h+foot);
    const cv=document.createElement('canvas'); cv.width=IMG.W*sc; cv.height=H*sc; const c=cv.getContext('2d'); c.scale(sc,sc);
    c.fillStyle=IC.bg; c.fillRect(0,0,IMG.W,H); c.fillStyle=IC.accent; c.fillRect(0,0,IMG.W,8);
    if(pi){ c.font=IF.small; c.fillStyle=IC.faint; c.textBaseline='top'; c.fillText('（接上一张）', P, P-4); }
    let y=top; pg.items.forEach(it=>{ it.draw(c,y); y+=it.h; });
    c.fillStyle=IC.line; c.fillRect(P, H-foot+18, IMG.W-P*2, 1);
    c.font=IF.small; c.fillStyle=IC.faint; c.textBaseline='top';
    c.fillText('《熵增契约》样章反馈 · '+(S.name||'读者'), P, H-foot+32);
    c.textAlign='right'; c.fillText('第 '+(pi+1)+' / '+n+' 张', IMG.W-P, H-foot+32); c.textAlign='left';
    urls.push(cv.toDataURL('image/png'));
  });
  return urls;
}

/* ---------- notes ---------- */
const KINDS=['想放下 / 走神','没看懂 / 被绕晕','出戏 / 觉得假','心里一动 / 想划线'];
let lastSel='';
document.addEventListener('selectionchange',()=>{ const s=window.getSelection(); if(!s||s.isCollapsed) return; const n=s.anchorNode; const bk=$('#book'); if(n && bk && bk.contains(n)) lastSel=s.toString().trim().slice(0,300); });
function updateFab(){ const n=S.notes.length; const b=$('#fabn'); b.textContent=n; b.classList.toggle('hidden', !n); }
function openSheet(h){ $('#sheet').innerHTML=h; $('#sheet').classList.remove('hidden'); $('#sheetbg').classList.remove('hidden'); }
function closeSheet(){ $('#sheet').classList.add('hidden'); $('#sheetbg').classList.add('hidden'); }
$('#sheetbg').onclick=closeSheet;
function openNotes(){
  const ch = chapterAtScroll(); const q=lastSel; let kind='';
  const list = S.notes.map((n,k)=>({n,k})).reverse().map(({n,k})=>`<div class="note"><div class="nh"><span class="k">${esc(n.kind)}</span><span>${esc(pname(n.pack))}</span><button data-del="${k}">删除</button></div>${n.quote?`<div class="nq">“${esc(n.quote)}”</div>`:''}${n.text?`<div>${esc(n.text)}</div>`:''}</div>`).join('');
  openSheet(`<h3>随手记一笔</h3><p class="sh">${esc(ch)} · 先在正文里选中一句话，再点“随手记”，原文会自动带进来。</p>
   <div class="row"><div class="sl">这是哪种时刻？</div><div class="chips" id="kinds">${KINDS.map(k=>`<button class="chip" data-k="${k}">${k}</button>`).join('')}</div></div>
   <div class="row"><div class="sl">那一句（可以不填）</div>${q?`<div class="quote">${esc(q)}</div>`:'<input type="text" id="nqi" placeholder="可以粘贴，或简单写几个字">'}</div>
   <div class="row"><div class="sl">您当时的想法</div><textarea id="nt" placeholder="几个字就好"></textarea></div>
   <div class="btnrow"><button class="primary" id="nsave">记下</button><button class="ghost" id="ncancel">先不记了</button></div><div id="nmsg" class="msg hidden"></div>
   ${S.notes.length?`<div class="notelist">${list}</div>`:''}`);
  $('#kinds').onclick=e=>{ const b=e.target.closest('.chip'); if(!b) return; kind=b.dataset.k; $('#kinds').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on', x===b)); };
  $('#ncancel').onclick=closeSheet;
  $('#nsave').onclick=()=>{ const text=$('#nt').value.trim(); const quote=q || ($('#nqi')?$('#nqi').value.trim():'');
    if(!kind){ const m=$('#nmsg'); m.textContent='请先选一下是哪种时刻。'; m.classList.remove('hidden'); return; }
    S.notes.push({kind, pack:S.view.pack, ch, quote, text, at:now()}); lastSel=''; save(); updateFab(); closeSheet(); try{ window.getSelection().removeAllRanges(); }catch(e){} };
  $('#sheet').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ S.notes.splice(+b.dataset.del,1); save(); updateFab(); openNotes(); });
}
$('#fab').onclick=openNotes;

/* ---------- toc / prefs ---------- */
function openToc(){
  const f=frontier(); const open = PREVIEW ? N-1 : Math.min(f, N-1);
  const items=[]; for(let i=0;i<N;i++){ const ok = S.started && i<=open;
    items.push(ok ? `<a href="#" data-p="${i}" class="${S.view.mode==='read'&&S.view.pack===i?'cur':''}">${esc(pname(i))}<span>约 ${PACKS[i].chars.toLocaleString()} 字</span></a>`
                  : `<span class="lock">${esc(pname(i))}<br><small>读完前面的部分后打开</small></span>`); }
  const canQuit = S.started && !S.finished && !(S.sent.partial && !PREVIEW && S.quit);
  openSheet(`<h3>目录</h3><p class="sh">读过的部分可以随时回看。</p><div class="toc">${items.join('')}</div>
   <div class="btnrow">${(S.started && f<N && S.view.mode!=='card')?'<button class="ghost" id="tf">回到当前进度</button>':''}${canQuit?'<button class="ghost" id="tq">先读到这儿，把感受发给作者</button>':''}</div>`);
  $('#sheet').querySelectorAll('[data-p]').forEach(a=>a.onclick=e=>{ e.preventDefault(); closeSheet(); go('read', +a.dataset.p); });
  const tf=$('#tf'); if(tf) tf.onclick=()=>{ closeSheet(); go('read', f); };
  const tq=$('#tq'); if(tq) tq.onclick=()=>openQuit();
}
$('#bToc').onclick=openToc;
$('#bFs').onclick=()=>{ const steps=[16,18,20,22]; const i=steps.indexOf(S.fs); S.fs=steps[(i+1)%steps.length]; save(); applyPrefs(); };
$('#bNight').onclick=()=>{ S.night=!S.night; save(); applyPrefs(); };

/* ---------- reading time & scroll ---------- */
let lastAct=Date.now(); ['scroll','touchstart','keydown','mousemove','click'].forEach(ev=>window.addEventListener(ev,()=>{lastAct=Date.now();},{passive:true}));
setInterval(()=>{ if(document.visibilityState==='visible' && S.view.mode==='read' && Date.now()-lastAct<120000){ S.time[S.view.pack]+=5; save(); } },5000);
let st=null;
window.addEventListener('scroll',()=>{
  if(S.view.mode!=='read') return;
  const h=document.documentElement.scrollHeight-window.innerHeight; $('#progbar').style.width = (h>0? Math.min(100, window.scrollY/h*100):0)+'%';
  clearTimeout(st); st=setTimeout(()=>{ S.scroll[S.view.pack]=window.scrollY; save(); },400);
},{passive:true});

if(PREVIEW) $('#pv').classList.remove('hidden');
if(S.pending && !S.finished){ sendFeedback('card').catch(()=>{}); }
if(PREVIEW && S.lastErr){ $('#pv').textContent='作者预览模式 · 上一次发送失败：'+S.lastErr; }
render();
if(S.view.mode==='read') window.scrollTo(0, S.scroll[S.view.pack]||0);
</script>
