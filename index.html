const app = $('#app');
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function applyPrefs(){ document.documentElement.style.setProperty('--page-fs', S.fs+'px'); document.body.classList.toggle('night', !!S.night); $('#bNight').textContent = S.night ? '日间' : '夜间'; }

/* ---------- views ---------- */
function go(mode, pack){ S.view={mode, pack}; save(); render(); window.scrollTo(0, mode==='read' ? (S.scroll[pack]||0) : 0); }
function render(){
  const v=S.view; applyPrefs();
  $('#fab').classList.toggle('hidden', v.mode!=='read');
  updateFab();
  $('#progbar').style.width='0';
  if(v.mode==='welcome') return viewWelcome();
  if(v.mode==='read') return viewRead(v.pack);
  if(v.mode==='card') return viewCard(v.pack);
  if(v.mode==='inter') return viewInter();
  if(v.mode==='done') return viewDone();
}
function setWhere(t){ $('#where').textContent=t; }

  setWhere('试读邀请');
  const types=['科幻','悬疑 / 推理','网络小说','纯文学','历史 / 现实题材','平时很少读小说'];
  app.innerHTML = `
  <section class="cover fade"><h1>熵增契约</h1><div class="sub">长篇小说 · 试读稿 · 约十一万字</div></section>
  <section class="letter fade">

    <p>为了让您读得轻松一些，书稿分成了几小段。每读完一段，会请您花两三分钟写几句当下的感受；写完之后，下一段会自动打开。</p>

      <li>不好看的地方，请一定直说。您的一句“这里有点闷”，比十句“挺好的”更能帮到我。</li>

    <p class="sign">作者 敬上</p>

  <div class="field"><label class="l" for="nm">怎么称呼您？<span class="hint">方便我对上反馈，写昵称就好</span></label><input type="text" id="nm" value="${esc(S.name)}" placeholder="例如：小周"></div>
  <div class="field"><label class="l">您平时常读哪类书？<span class="hint">可多选，也可以不填</span></label><div class="chips" id="types">${types.map(t=>`<button class="chip ${S.types.includes(t)?'on':''}" data-t="${t}">${t}</button>`).join('')}</div></div>
  <button class="primary" id="start">${S.started?'继续阅读':'开始阅读'}</button>
  <p class="privacy">您的阅读进度和回答只保存在这台设备的浏览器里，不会自动上传。页面会粗略记录每一段的阅读时长，仅供作者参考。</p>`;
  app.querySelectorAll('#types .chip').forEach(b=>b.onclick=()=>{ const t=b.dataset.t; const i=S.types.indexOf(t); if(i>=0)S.types.splice(i,1); else S.types.push(t); b.classList.toggle('on'); save(); });
  $('#nm').oninput=e=>{ S.name=e.target.value.trim(); save(); };

function viewRead(i){
  setWhere('第'+CN[i]+'段');
  const f=frontier(); const done=!!S.submitted[CARD_IDS[i]];
  let endHtml;
  if(PREVIEW || !done) endHtml = `<p>这一段读完了。</p><button class="primary" id="toCard">写几句感受</button>`;
  else endHtml = `<p>这一段的感受卡您已经填过了。</p><button class="primary" id="back">回到当前进度</button>`;
  app.innerHTML = `<div class="packlabel">第${CN[i]}段</div><article class="book" id="book">${decode(i)}</article><div class="endpack">${endHtml}</div>`;
  const t=$('#toCard'); if(t) t.onclick=()=>{ S.scroll[i]=window.scrollY; go('card', i); };
  const bk=$('#back'); if(bk) bk.onclick=()=>{ f>=7 ? go('done',6) : go('read', f); };
  trackChapter();
}
let chObs=null, curCh='';
function trackChapter(){
  const hs=[...document.querySelectorAll('#book h3.ch')]; curCh = hs[0] ? hs[0].dataset.ch : '';
  if(chObs) chObs.disconnect();
}
function chapterAtScroll(){
  const hs=[...document.querySelectorAll('#book h3.ch')]; let c=hs[0]?hs[0].dataset.ch:'';
  for(const h of hs){ if(h.getBoundingClientRect().top < window.innerHeight*0.4) c=h.dataset.ch; else break; }
  return c;
}

function qHtml(q, ans, locked){
  const a = id => ans[id];
  const dis = locked ? 'disabled' : '';
  let h = `<div class="q" id="q_${q.id}"><div class="qt">${esc(q.q)}${q.req?'<span class="req">必填</span>':''}</div>`;
  if(q.type==='text') h+=`<input type="text" data-k="${q.id}" value="${esc(a(q.id))}" placeholder="${esc(q.ph||'')}" ${dis}>`;
  if(q.type==='textarea') h+=`<textarea data-k="${q.id}" placeholder="${esc(q.ph||'')}" ${dis}>${esc(a(q.id))}</textarea>`;
  if(q.type==='scale') h+=`<div class="scale"><div class="dots">${[1,2,3,4,5].map(n=>`<button class="dot ${a(q.id)==n?'on':''}" data-set="${q.id}" data-v="${n}" ${dis}>${n}</button>`).join('')}</div><div class="ends"><span>1　${esc(q.lo)}</span><span>${esc(q.hi)}　5</span></div></div>`;
  if(q.type==='stars') h+=`<div class="stars">${[1,2,3,4,5].map(n=>`<button class="star ${(a(q.id)||0)>=n?'on':''}" data-set="${q.id}" data-v="${n}" aria-label="${n} 星" ${dis}>★</button>`).join('')}</div>`;
  if(q.type==='choice') h+=`<div class="opts">${q.opts.map(o=>`<button class="opt ${a(q.id)==o?'on':''}" data-set="${q.id}" data-v="${esc(o)}" ${dis}><span class="box"></span>${esc(o)}</button>`).join('')}</div>`;
  if(q.type==='multi'){ const cur=a(q.id)||[]; h+=`<div class="opts">${q.opts.map(o=>`<button class="opt multi ${cur.includes(o)?'on':''}" data-tog="${q.id}" data-v="${esc(o)}" ${dis}><span class="box"></span>${esc(o)}</button>`).join('')}</div>`;
    if(q.other) h+=`<div class="sub"><div class="sl">其他：</div><input type="text" data-k="${q.other}" value="${esc(a(q.other))}" ${dis}></div>`; }
  if(q.type==='fields') h+=`<div class="pair">${q.fields.map(([k,l])=>`<div><label>${esc(l)}</label><input type="text" data-k="${k}" value="${esc(a(k))}" ${dis}></div>`).join('')}</div>`;
  if(q.type==='grid'){
    h+=`<div class="grid"><table><tr><th></th>${q.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${q.rows.map(([k,l])=>`<tr><td>${esc(l)}</td>${q.cols.map((c,ci)=>`<td><button class="cell ${a(k)==c?'on':''}" data-set="${k}" data-v="${esc(c)}" aria-label="${esc(l)}：${esc(c)}" ${dis}>${q.cols.length===5?c:''}</button></td>`).join('')}</tr>`).join('')}</table></div>`;
    if(q.colnote) h+=`<div class="ends" style="color:var(--page-faint);font-size:12.5px;margin-top:6px">${esc(q.colnote)}</div>`;
  }
  if(q.follow) h+=`<div class="sub"><div class="sl">${esc(q.follow.q)}</div><textarea data-k="${q.follow.id}" ${dis}>${esc(a(q.follow.id))}</textarea></div>`;
  return h+'</div>';
}
function viewCard(i){
  const c=card(i), id=CARD_IDS[i]; const ans=S.answers[id]||(S.answers[id]={});
  const locked = !PREVIEW && !!S.submitted[id];
  setWhere('第'+CN[i]+'段 · 读后感受');
  const btn = i===6 ? '提交，完成试读' : (i===5 ? '提交' : '提交，继续读下一段');
  app.innerHTML = `<div class="cardhead fade"><div class="packlabel">第${CN[i]}段 · 读后感受</div><h2>${esc(c.title)}</h2>${c.intro.map(p=>`<p>${esc(p)}</p>`).join('')}${c.important?`<div class="important">${esc(c.important)}</div>`:''}</div>
  <form id="cf" onsubmit="return false">${c.qs.map(q=>qHtml(q,ans,locked)).join('')}</form>
  ${locked?'<p class="locked">这张卡已经提交过了，谢谢您。</p><button class="primary" id="cont">继续</button>':`<div id="msg" class="msg hidden"></div><button class="primary" id="sub">${btn}</button>${i<5?'<button class="ghost" id="reread">回到这一段</button>':''}`}`;
  const f=$('#cf');
  f.addEventListener('input', e=>{ const k=e.target.dataset.k; if(k){ ans[k]=e.target.value; save(); } });
  f.addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b||locked) return;
    if(b.dataset.set){ const k=b.dataset.set, v=b.dataset.v; ans[k]= isNaN(+v)||v==='' ? v : +v;
      b.parentElement.closest('.dots,.stars,.opts,tr').querySelectorAll('[data-set="'+k+'"]').forEach(x=>{ const xv=isNaN(+x.dataset.v)?x.dataset.v:+x.dataset.v; x.classList.toggle('on', b.classList.contains('star') ? xv<=ans[k] : xv==ans[k]); });
      const qd=b.closest('.q'); if(qd) qd.classList.remove('miss'); save(); }
    if(b.dataset.tog){ const k=b.dataset.tog, v=b.dataset.v; const arr=ans[k]||(ans[k]=[]); const j=arr.indexOf(v); if(j>=0)arr.splice(j,1); else arr.push(v); b.classList.toggle('on'); save(); }
  });
  if(locked){ $('#cont').onclick=()=>advance(i); return; }
  const rr=$('#reread'); if(rr) rr.onclick=()=>go('read', i);
  $('#sub').onclick=()=>{
    const miss=[];
    c.qs.forEach(q=>{ if(!q.req) return; const ok = q.type==='grid' ? q.rows.every(([k])=>ans[k]!=null&&ans[k]!=='') : (ans[q.id]!=null&&ans[q.id]!==''); const el=$('#q_'+q.id); el.classList.toggle('miss',!ok); if(!ok) miss.push(el); });
    if(miss.length){ const m=$('#msg'); m.textContent='还有 '+miss.length+' 道必填题没有选，麻烦您补一下（标着“必填”的那几道）。'; m.classList.remove('hidden'); miss[0].scrollIntoView({behavior:'smooth',block:'center'}); return; }
    S.submitted[id]=now(); if(i===6) S.finished=now(); save(); advance(i);
  };
}
function advance(i){ if(i===5) return go('inter',6); if(i===6) return go('done',6); go('read', i+1); }
function viewInter(){
  setWhere('');
  app.innerHTML=`<section class="inter fade"><h2>谢谢您。</h2><p>其实，后面还有最后一小段。</p><p>请接着往下读。</p><div><button class="primary" id="go7">继续读</button></div></section>`;
  $('#go7').onclick=()=>go('read',6);
}

/* ---------- export ---------- */
function fmtMin(s){ const m=Math.round(s/60); return m<1?'不到 1 分钟':m+' 分钟'; }
function ansText(v){ if(Array.isArray(v)) return v.join('、'); return v==null?'':String(v); }
function buildExport(){
  const L=[]; L.push('《熵增契约》试读反馈'); L.push('称呼：'+(S.name||'（未填）')); L.push('常读：'+(S.types.join('、')||'（未填）'));
  L.push('开始：'+(S.started||'')+'　完成：'+(S.finished||'未完成'));
  L.push('各段阅读时长（粗略）：'+S.time.map((t,i)=>'第'+CN[i]+'段 '+fmtMin(t)).join('；')); L.push('');
  CARDS_B64.forEach((_,i)=>{ const c=card(i); const id=CARD_IDS[i], a=S.answers[id]||{}; L.push('==== 第'+CN[i]+'段 · 读后感受 ====');
    c.qs.forEach(q=>{ L.push('· '+q.q);
      if(q.type==='grid') q.rows.forEach(([k,l])=>L.push('    '+l+'：'+ansText(a[k])));
      else if(q.type==='fields') q.fields.forEach(([k,l])=>L.push('    '+l+'：'+ansText(a[k])));
      else { let v=ansText(a[q.id]); if(q.type==='scale') v=v?v+' / 5':''; if(q.type==='stars') v=v?v+' 星':''; L.push('    '+(v||'（未填）')); if(q.other&&a[q.other]) L.push('    其他：'+a[q.other]); }
      if(q.follow&&a[q.follow.id]) L.push('    '+q.follow.q+a[q.follow.id]);
    }); L.push(''); });
  L.push('==== 随手记（'+S.notes.length+' 条）====');
  S.notes.forEach((n,k)=>{ L.push((k+1)+'. ['+n.kind+'] 第'+CN[n.pack]+'段 · '+n.ch); if(n.quote) L.push('   原文：“'+n.quote+'”'); if(n.text) L.push('   想法：'+n.text); });
  L.push(''); L.push('---- 以下为数据，方便作者整理，请不要修改 ----');
  const data={name:S.name,types:S.types,started:S.started,finished:S.finished,time:S.time,answers:S.answers,submitted:S.submitted,notes:S.notes};
  L.push(JSON.stringify(data));
  return L.join('\n');
}
function viewDone(){
  setWhere('试读完成'); const txt=buildExport();
  app.innerHTML=`<section class="fade"><div class="cover" style="padding-top:24px"><h1 style="font-size:clamp(32px,8vw,52px)">谢谢您读完它。</h1><div class="sub">您的每一句话，作者都会认真看。</div></div>
  <div class="letter"><p>最后一步，麻烦您把下面的反馈图片发给我。</p></div>
  <p style="color:var(--page-muted);font-size:15px;margin:0">手机上：长按图片，选“保存图片”或直接“发送给朋友”。电脑上：点图片右下方的“下载”。如果生成了好几张，请都发过来。</p>
  <div id="imgs"><p class="msg">正在生成图片，请稍候……</p></div>
  <div class="btnrow"><button class="ghost" id="regen">重新生成图片</button><button class="ghost" id="showtxt">改发文字版</button><button class="ghost" id="rv">回看全书</button></div>
  <div id="txtbox" class="hidden"><div class="btnrow"><button class="primary" id="cp">复制文字</button><button class="ghost" id="dl">下载文字文件</button></div><div id="cpmsg" class="msg hidden"></div><textarea class="export" id="ex" readonly>${esc(txt)}</textarea></div>
  <p class="small">反馈只保存在您这台设备上。确认已经发给作者之后，如果想清除记录，可以<button id="clr">点这里</button>。</p></section>`;
  const gen=async()=>{ const box=$('#imgs'); box.innerHTML='<p class="msg">正在生成图片，请稍候……</p>';
    try{ const urls=await renderImages(); const nm=(S.name||'读者').replace(/[\\/:*?"<>|]/g,'');
      box.innerHTML=urls.map((u,i)=>`<figure class="shot"><img src="${u}" alt="试读反馈图片 第${i+1}张"><figcaption>${urls.length>1?`第 ${i+1} / ${urls.length} 张 · `:''}<a href="${u}" download="熵增契约_试读反馈_${esc(nm)}${urls.length>1?'_'+(i+1):''}.png">下载</a></figcaption></figure>`).join('');
    }catch(e){ box.innerHTML='<p class="msg">图片没能生成，请点下面的“改发文字版”，把文字复制发给作者。</p>'; } };
  gen();
  $('#regen').onclick=gen;
  $('#showtxt').onclick=()=>{ $('#txtbox').classList.remove('hidden'); $('#txtbox').scrollIntoView({behavior:'smooth'}); };
  $('#cp').onclick=async()=>{ const m=$('#cpmsg'); try{ await navigator.clipboard.writeText(txt); m.textContent='已复制，可以粘贴发给作者了。谢谢您！'; }catch(e){ const ta=$('#ex'); ta.focus(); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} m.textContent= ok?'已复制，可以粘贴发给作者了。谢谢您！':'浏览器不允许自动复制，请长按下面的文字全选后复制。'; } m.classList.remove('hidden'); };
  $('#dl').onclick=()=>{ const bl=new Blob([txt],{type:'text/plain;charset=utf-8'}); const u=URL.createObjectURL(bl); const a=document.createElement('a'); a.href=u; a.download='熵增契约_试读反馈_'+(S.name||'读者')+'.txt'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(u); a.remove();},500); };
  $('#rv').onclick=()=>openToc();
  $('#clr').onclick=()=>{ if(confirm('确定清除这台设备上的阅读记录和回答吗？清除后无法恢复。')){ localStorage.removeItem(KEY); S=blank(); render(); } };
}

/* ---------- feedback image ---------- */
const IMG={W:750, pad:48, maxH:4000, scale:2};
const IC={bg:'#F4F5F4', ink:'#1D2124', muted:'#5E676B', faint:'#8D9598', line:'#D3D8D8', accent:'#1E6A72', soft:'#DCE9EA', signal:'#A8651A', ssoft:'#F3E6D4', white:'#FFFFFF'};
const ISERIF='"Noto Serif SC","Songti SC","STSong","SimSun","Noto Serif CJK SC",serif';
const ISANS='"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
const IF={h1:`600 38px ${ISERIF}`, meta:`400 19px ${ISANS}`, sec:`700 23px ${ISANS}`, q:`400 19px ${ISANS}`, qb:`700 19px ${ISANS}`, a:`400 23px ${ISERIF}`, small:`400 16px ${ISANS}`, num:`600 17px ${ISANS}`, star:`400 30px ${ISANS}`};
function fpx(f){ return parseInt(f.match(/(\d+)px/)[1]); }
function wrapText(ctx, text, font, maxW){ ctx.font=font; const out=[]; String(text).split('\n').forEach(par=>{ let line=''; for(const ch of par){ const t=line+ch; if(ctx.measureText(t).width>maxW && line){ out.push(line); line=ch; } else line=t; } out.push(line); }); return out; }
function fmtDate(iso){ if(!iso) return '未完成'; const d=new Date(iso); const z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`; }
function buildItems(){
  const m=document.createElement('canvas').getContext('2d'); const P=IMG.pad, CW=IMG.W-P*2;
  let sink=[]; const root=sink;
  const put=it=>sink.push(it);
  const txt=(text,font,lh,color,gt=0,gb=0,x=P,w=CW)=>{ const lines=wrapText(m,text,font,w); const off=(lh-fpx(font))/2; put({h:gt+lines.length*lh+gb, draw(c,y){ c.font=font; c.fillStyle=color; c.textBaseline='top'; lines.forEach((l,i)=>c.fillText(l,x,y+gt+i*lh+off)); }}); };
  const gap=h=>put({h, draw(){}});
  const group=fn=>{ const g=[], prev=sink; sink=g; fn(); sink=prev; put({h:g.reduce((s,i)=>s+i.h,0), draw(c,y){ let yy=y; g.forEach(it=>{ it.draw(c,yy); yy+=it.h; }); }}); };
  const ans=v=>{ const s=ansText(v).trim(); if(s) txt(s, IF.a, 37, IC.ink, 2, 0); else txt('（未填）', IF.a, 37, IC.faint, 2, 0); };
  const rrect=(c,x,y,w,h,r)=>{ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); };
  const dots=(v,x0,y,size,gapx)=>(c)=>{ for(let i=1;i<=5;i++){ const x=x0+(i-1)*(size+gapx); rrect(c,x,y,size,size*0.86,6); if(v==i){ c.fillStyle=IC.accent; c.fill(); } else { c.fillStyle=IC.white; c.fill(); c.strokeStyle=IC.line; c.lineWidth=1; c.stroke(); } c.font=IF.num; c.fillStyle= v==i?IC.white:IC.faint; c.textAlign='center'; c.textBaseline='middle'; c.fillText(String(i), x+size/2, y+size*0.43+1); c.textAlign='left'; } };

  // header
  txt('《熵增契约》试读反馈', IF.h1, 52, IC.ink, 6, 14);
  const tot=S.time.reduce((a,b)=>a+b,0);
  txt('称呼：'+(S.name||'（未填）'), IF.meta, 31, IC.ink);
  txt('常读：'+(S.types.join('、')||'（未填）'), IF.meta, 31, IC.ink);
  txt('完成：'+fmtDate(S.finished), IF.meta, 31, IC.ink);
  txt('阅读时长：共约 '+Math.max(1,Math.round(tot/60))+' 分钟（'+S.time.map((t,i)=>CN[i]+' '+Math.round(t/60)).join(' · ')+'，单位：分钟）', IF.small, 25, IC.muted, 4, 0);
  put({h:34, draw(c,y){ c.fillStyle=IC.line; c.fillRect(P,y+20,CW,1); }});

  CARD_IDS.forEach((id,i)=>{
    const cd=card(i), a=S.answers[id]||{};
    put({h:78, draw(c,y){ c.font=IF.sec; c.fillStyle=IC.accent; c.textBaseline='top'; c.fillText('第'+CN[i]+'段 · 读后感受', P, y+30); c.fillRect(P, y+66, 36, 3); }});
    cd.qs.forEach(q=>group(()=>{
      gap(14);
      txt(q.q, IF.q, 29, IC.muted, 0, 6);
      if(q.type==='scale'){ const v=a[q.id]; put({h:44, draw(c,y){ dots(v,P,y+2,44,8)(c); c.font=IF.a; c.fillStyle=v?IC.ink:IC.faint; c.textBaseline='top'; c.fillText(v? v+' / 5':'（未选）', P+5*52+14, y+8); }});
        txt('1 = '+q.lo+'　5 = '+q.hi, IF.small, 24, IC.faint, 4, 0); }
      else if(q.type==='stars'){ const v=a[q.id]||0; put({h:44, draw(c,y){ c.font=IF.star; c.textBaseline='top'; for(let k=0;k<5;k++){ c.fillStyle= k<v?IC.signal:IC.line; c.fillText('★', P+k*38, y+4); } c.font=IF.a; c.fillStyle=v?IC.ink:IC.faint; c.fillText(v? v+' 星':'（未选）', P+5*38+14, y+8); }}); }
      else if(q.type==='multi'){ const arr=(a[q.id]||[]).slice(); if(q.other&&a[q.other]) arr.push('其他：'+a[q.other]); ans(arr.join('、')); }
      else if(q.type==='fields'){ q.fields.forEach(([k,l])=>{ const v=ansText(a[k]).trim(); txt(l+'：'+(v||'（未填）'), IF.a, 37, v?IC.ink:IC.faint, 2, 0); }); }
      else if(q.type==='grid'){
        const five=q.cols.length===5;
        if(five) put({h:22, draw(c,y){ c.font=IF.small; c.fillStyle=IC.faint; c.textBaseline='top'; c.fillText('1 = 完全没有　5 = 非常强烈', P, y); }});
        q.rows.forEach(([k,l])=>{ const v=a[k];
          put({h:46, draw(c,y){ c.fillStyle=IC.line; c.fillRect(P,y+45,CW,1); c.font=IF.q; c.fillStyle=IC.ink; c.textBaseline='middle'; c.fillText(l, P, y+23);
            if(five){ dots(v, P+CW-5*40+6, y+6, 34, 6)(c); }
            else { c.font=IF.qb; c.fillStyle=v?IC.accent:IC.faint; c.textAlign='right'; c.fillText(v||'（未选）', P+CW, y+23); c.textAlign='left'; } }});
        });
      }
      else ans(a[q.id]);
      if(q.follow && ansText(a[q.follow.id]).trim()){ txt(q.follow.q, IF.small, 24, IC.faint, 10, 0); ans(a[q.follow.id]); }
      gap(10);
    }));
  });

  put({h:78, draw(c,y){ c.font=IF.sec; c.fillStyle=IC.accent; c.textBaseline='top'; c.fillText('随手记 · '+S.notes.length+' 条', P, y+30); c.fillRect(P, y+66, 36, 3); }});
  if(!S.notes.length) txt('（这次没有记）', IF.a, 37, IC.faint, 14, 0);
  S.notes.forEach(n=>group(()=>{
    gap(16);
    txt('【'+n.kind+'】 第'+CN[n.pack]+'段 · '+(n.ch||''), IF.small, 25, IC.accent, 0, 6);
    if(n.quote){ const f=`400 20px ${ISERIF}`; const lines=wrapText(m,'“'+n.quote+'”',f,CW-22); put({h:lines.length*32+10, draw(c,y){ c.fillStyle=IC.line; c.fillRect(P,y+2,3,lines.length*32+2); c.font=f; c.fillStyle=IC.muted; c.textBaseline='top'; lines.forEach((l,i)=>c.fillText(l,P+18,y+6+i*32)); }}); }
    if(ansText(n.text).trim()) ans(n.text);
  }));

  txt('谢谢您读完这本书。', IF.meta, 31, IC.muted, 48, 0);
  txt('—— 作者 敬上', IF.meta, 31, IC.muted, 0, 8);
  return root;
}
function paginate(items){ const pages=[]; let cur=[],h=0; items.forEach(it=>{ if(h+it.h>IMG.maxH && cur.length){ pages.push({items:cur,h}); cur=[]; h=0; } cur.push(it); h+=it.h; }); if(cur.length) pages.push({items:cur,h}); return pages; }
async function renderImages(){
  try{ if(document.fonts && document.fonts.load){ await Promise.all([document.fonts.load(IF.a,'熵'),document.fonts.load(IF.q,'熵'),document.fonts.load(IF.sec,'熵')]); } }catch(e){}
  const pages=paginate(buildItems()); const n=pages.length, sc=IMG.scale, P=IMG.pad; const urls=[];
  pages.forEach((pg,pi)=>{
    const top=P+(pi?36:0), foot=72, H=Math.ceil(top+pg.h+foot);
    const cv=document.createElement('canvas'); cv.width=IMG.W*sc; cv.height=H*sc; const c=cv.getContext('2d'); c.scale(sc,sc);
    c.fillStyle=IC.bg; c.fillRect(0,0,IMG.W,H); c.fillStyle=IC.accent; c.fillRect(0,0,IMG.W,8);
    if(pi){ c.font=IF.small; c.fillStyle=IC.faint; c.textBaseline='top'; c.fillText('（接上一张）', P, P-4); }
    let y=top; pg.items.forEach(it=>{ it.draw(c,y); y+=it.h; });
    c.fillStyle=IC.line; c.fillRect(P, H-foot+18, IMG.W-P*2, 1);
    c.font=IF.small; c.fillStyle=IC.faint; c.textBaseline='top';
    c.fillText('《熵增契约》试读反馈 · '+(S.name||'读者'), P, H-foot+32);
    c.textAlign='right'; c.fillText('第 '+(pi+1)+' / '+n+' 张', IMG.W-P, H-foot+32); c.textAlign='left';
    urls.push(cv.toDataURL('image/png'));
  });
  return urls;
}

/* ---------- notes ---------- */
const KINDS=['想放下 / 走神','没看懂 / 被绕晕','出戏 / 觉得假','心里一动 / 想划线'];
let lastSel='';
document.addEventListener('selectionchange',()=>{ const s=window.getSelection(); if(!s||s.isCollapsed) return; const n=s.anchorNode; if(n && $('#book') && $('#book').contains(n)) lastSel=s.toString().trim().slice(0,300); });
function updateFab(){ const n=S.notes.length; const b=$('#fabn'); b.textContent=n; b.classList.toggle('hidden', !n); }
function openSheet(html){ $('#sheet').innerHTML=html; $('#sheet').classList.remove('hidden'); $('#sheetbg').classList.remove('hidden'); }
function closeSheet(){ $('#sheet').classList.add('hidden'); $('#sheetbg').classList.add('hidden'); }
$('#sheetbg').onclick=closeSheet;
function openNotes(){
  const ch = chapterAtScroll(); const q=lastSel; let kind='';
  const list = S.notes.map((n,k)=>({n,k})).reverse().map(({n,k})=>`<div class="note"><div class="nh"><span class="k">${esc(n.kind)}</span><span>第${CN[n.pack]}段 · ${esc(n.ch)}</span><button data-del="${k}">删除</button></div>${n.quote?`<div class="nq">“${esc(n.quote)}”</div>`:''}${n.text?`<div>${esc(n.text)}</div>`:''}</div>`).join('');
  openSheet(`<h3>随手记一笔</h3><p class="sh">${esc(ch)}　·　先在正文里选中一句话再点“随手记”，原文会自动带进来。</p>
   <div class="row"><div class="sl">这是哪种时刻？</div><div class="chips" id="kinds">${KINDS.map(k=>`<button class="chip" data-k="${k}">${k}</button>`).join('')}</div></div>
   <div class="row"><div class="sl">那一句（可以不填）</div>${q?`<div class="quote" id="nq">${esc(q)}</div>`:'<input type="text" id="nqi" placeholder="可以粘贴或简单写几个字">'}</div>
   <div class="row"><div class="sl">您当时的想法</div><textarea id="nt" placeholder="几个字就好"></textarea></div>
   <div class="btnrow"><button class="primary" id="nsave">记下</button><button class="ghost" id="ncancel">先不记了</button></div><div id="nmsg" class="msg hidden"></div>
   ${S.notes.length?`<div class="notelist">${list}</div>`:''}`);
  $('#kinds').onclick=e=>{ const b=e.target.closest('.chip'); if(!b) return; kind=b.dataset.k; $('#kinds').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on', x===b)); };
  $('#ncancel').onclick=closeSheet;
  $('#nsave').onclick=()=>{ const text=$('#nt').value.trim(); const quote=q || ($('#nqi')?$('#nqi').value.trim():'');
    if(!kind){ const m=$('#nmsg'); m.textContent='请先选一下是哪种时刻。'; m.classList.remove('hidden'); return; }
    S.notes.push({kind, pack:S.view.pack, ch, quote, text, at:now()}); lastSel=''; save(); updateFab(); closeSheet(); window.getSelection().removeAllRanges(); };
  $('#sheet').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ S.notes.splice(+b.dataset.del,1); save(); updateFab(); openNotes(); });
}
$('#fab').onclick=openNotes;

/* ---------- toc / prefs ---------- */
function openToc(){
  const f=frontier(); const max = PREVIEW ? 6 : Math.min(f,6);
  const items=[]; for(let i=0;i<=max;i++){ if(!PREVIEW && i===f && S.view.mode==='welcome' && !S.started) break; const chs=chaps(i); items.push(`<a href="#" data-p="${i}" class="${S.view.mode==='read'&&S.view.pack===i?'cur':''}">第${CN[i]}段<span>${esc(chs[0])}${chs.length>1?' — '+esc(chs[chs.length-1]):''}</span></a>`); }
  openSheet(`<h3>已经打开的段落</h3><p class="sh">读过的段落可以随时回看。</p><div class="toc">${items.join('')||'<p class="sh">还没有开始阅读。</p>'}</div>
  ${(!PREVIEW && f<7 && S.started && S.view.mode!=='card')?`<div class="btnrow"><button class="ghost" id="tf">回到当前进度</button></div>`:''}`);
  $('#sheet').querySelectorAll('[data-p]').forEach(a=>a.onclick=e=>{ e.preventDefault(); closeSheet(); go('read', +a.dataset.p); });
  const tf=$('#tf'); if(tf) tf.onclick=()=>{ closeSheet(); go('read', f); };
}
$('#bToc').onclick=openToc;
$('#bFs').onclick=()=>{ const steps=[16,18,20,22]; const i=steps.indexOf(S.fs); S.fs=steps[(i+1)%steps.length]; save(); applyPrefs(); };
$('#bNight').onclick=()=>{ S.night=!S.night; save(); applyPrefs(); };

/* ---------- reading time & scroll ---------- */
let lastAct=Date.now(); ['scroll','touchstart','keydown','mousemove','click'].forEach(ev=>window.addEventListener(ev,()=>{lastAct=Date.now();},{passive:true}));
setInterval(()=>{ if(document.visibilityState==='visible' && S.view.mode==='read' && Date.now()-lastAct<120000){ S.time[S.view.pack]+=5; save(); } },5000);
let st=null;
window.addEventListener('scroll',()=>{
  if(S.view.mode!=='read') return;
  const h=document.documentElement.scrollHeight-window.innerHeight; $('#progbar').style.width = (h>0? Math.min(100, window.scrollY/h*100):0)+'%';
  clearTimeout(st); st=setTimeout(()=>{ S.scroll[S.view.pack]=window.scrollY; save(); },400);
},{passive:true});

if(PREVIEW) $('#pv').classList.remove('hidden');
render();
if(S.view.mode==='read') window.scrollTo(0, S.scroll[S.view.pack]||0);
</script>
