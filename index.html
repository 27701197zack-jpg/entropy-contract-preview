const PACKS = [{"title": "肉罐头与半价冻肉", "chapters": ["第一章 肉罐头与半价冻肉"], "chars": 6321, "html": "<h3 class=\"ch\" data-ch=\"第一章 肉罐头与半价冻肉\">第一章 肉罐头与半价冻肉<\/h3>\n<blockquote><p><strong>【历史档案切片 · 2037 年 CL-9 商用生物计算机维生与销毁规程（第 7.4 条）】<\/strong><\/p><p>单批 iPSC 诱导人类皮层神经元有效服役周期严格限定为 180 个标准日（4,320 小时）。自第 177 日起，神经突触将因不可逆代谢衰减进入退化窗口，突触权重将在 72 小时内彻底归零。操作员须佩戴防静电手套，在倒计时结束前直接剥离培养盒，连同微流控管路投入三类医疗焚烧炉。严禁以任何形式进行黑市转售或离线续命。<\/p><\/blockquote>\n<p class=\"stamp\"><strong>2058 年 11 月 14 日 21:50 · 距离三重倒计时归零剩余 <code>72:10:00<\/code><\/strong><\/p>\n<p>外环废热盆地的夜风是粘在皮肤上的。<\/p>\n<p>三公里外，<code>64K<\/code> 示范城集群的十二座双曲线冷却塔正往低垂的云层里吐白雾。夜里风向偏南，带着余温的水汽顺着高架桥底沉下来，压在高低错落的违建铁皮屋顶上，把整片旧工业带蒸成一口揭不开盖的铁锅。空气里常年浮着三股味道：超算排风口吹出来的硅尘味，街口冷链摊解冻劣质冻肉的血腥气，还有焊锡混着旧铅酸电池的酸臭。<\/p>\n<p>巷口锈灯杆底下，两个穿灰工装的年轻人蹲在马路牙子上，轮流嘬一根掌心大的塑料管——底城药房和灰市卖得最火的“情绪稳态雾化管”。淡蓝指示灯闪一下，吐出的白雾融进冷却塔的水汽里，分不清哪股是机器的废气，哪股是活人的叹气。两人谁也不看谁，只盯着对面墙上一块缺了角的全息灯牌发呆。灯牌卡顿着循环播放消费民主区的虚拟伴侣广告，女人精致的笑脸在电压波动里扭成几道绿色雪花。广告间隙跳出半秒公益片：“霍承安意识永续基金会——让伟大的头脑不再死去。”画面上那个银发老人已经死了二十三年，还在冲整条巷子微笑。<\/p>\n<p>“老林旧电池铺”缩在巷子中段。卷帘门只拉起半人高，底下漏出一道昏黄的灯管光，斜斜泼在湿漉漉的水泥台阶上。<\/p>\n<p>晚上九点四十，黑市中间人老蟹弓着腰从卷帘门底下钻进来，活脱脱一条沾了水的泥鳅。雨衣没脱，水顺着塑料下摆往下滴，在满是机油的地上砸出一个个黑点。<\/p>\n<p>“货在这儿。”他把一只裹着三层防静电泡沫和油纸的硬壳箱往铁皮工作台上一放，扯开两道胶带，又把两张印着加密部落暗纹的离线电力配额票压在箱盖上，“定金先结一半。林深，这单价钱给到顶了，规矩你懂——不问来路，不接外网，稳住营养液和脉冲底噪，撑到后天午夜，有人来取。”<\/p>\n<p>林深坐在掉漆的圆铁凳上，没去碰配额票，先用右手掀开油纸一角。<\/p>\n<p>里头是一只巴掌大的密封陶瓷培养盒，边缘几道撬痕，微流控接口缠着半圈发黄的医用胶布。侧壁嵌着一块指甲盖大的电子墨水屏，跳着一行血红的读数：<\/p>\n<p class=\"log\"><code>[介质老化：距离突触权重永久归零剩余 72:16:52]<\/code><\/p>\n<p>林深眼皮跳了一下：“第 177 天的临期货？老蟹，你拿快死透的肉罐头糊弄我？过了 177 天，代谢衰减是指数级往下掉的。我这破台子没有恒温负压箱，电压一抽风就能把它电熟了。”<\/p>\n<p>“废话，要不是临期货，人家能绕开中环正规机房，花大价钱送到你这破电池铺？”老蟹压低嗓子，喉结滚了滚，往卷帘门缝外瞟了一眼，“跟你说句实话，这单货上头查得紧，不是黑市拆机流出来的算力垃圾。也不是我挑的你——这单是上头指名要送你这儿的。你只管拿葡萄糖和生长因子吊着它的命，别手贱去读里头的权重。撑到后天午夜，尾款翻倍；要是明早它发黄发臭了，连盒扔进后巷焚化炉，指纹擦干净，权当没见过我。”<\/p>\n<p>说完他连口水都没喝，钻出卷帘门，一头扎进夜雾。脚步声很快被高架桥上冷链货车的胎噪吞没了。<\/p>\n<p>铺子里静下来，只剩墙角老式铅酸充电机低沉的电流声。<\/p>\n<p>林深盯着培养盒看了五秒，把两张配额票折好塞进裤兜——他不跟钱过不去。外环电价上个月又涨了百分之十二，冰柜压缩机上周烧了线圈，老林左腿那副碳纤维支架的关节垫片也磨平了，哪样不要硬通货？<\/p>\n<p>他把旧焊枪、拆散的电芯和几把油腻的螺丝刀推到一边，腾出一块勉强干净的铁皮，坐了下来。<\/p>\n<p>林深今年三十，身形偏瘦，肩膀却宽。一件洗得发白的灰工装背心，左袖管卷到肩头，露出一整条哑光黑的金属机械臂。<\/p>\n<p>这条胳膊跟公司城邦宣传片里那种流线型仿生义体是两码事。它粗笨、沉，小臂外壳的漆早磕掉了，露出底下灰白的合金；肩胛卡环一圈焊疤，肘外侧裸着两根编织液压管，小臂内侧焊了一块铝散热片，旁边嵌着一只从旧服务器机箱里拆下来的直流风扇。东欧战区停火后流出来的军规转民用货。前年他托加密部落一个退役老技工剪了原厂的云端心跳校验，硬刷进野路子的越狱固件，代价是没了液冷和温控——连续高负载超过十分钟，铝片就烫得像刚出炉的烙铁，能把接缝处的皮肉烫出水泡。<\/p>\n<p>接收电路他没敢全拆，本地诊断和离线自检还得靠它。老技工临走还顺手塞进一块二手低功耗类脑芯片当协处理器，说能多扛两路算力。林深没多问，只当是老头儿一点好意。<\/p>\n<p>此刻风扇正嗡嗡转着，金属指头微微发烫。<\/p>\n<p>他从抽屉里翻出一副洗硬了的医用胶皮手套，只套上右手。右手是原生的，手指修长，掌心和虎口全是握焊枪、扳手磨出来的老茧，手背一道陈年锡珠烫疤。当年有人劝他趁黑市打折，把右手也换成带力反馈的精密义肢，修东西能快一倍。林深直接把人轰出了门。有些东西换了，就再也摸不出热汤碗和活人手背的温度了。<\/p>\n<p>他捏起一根玻璃微流控针管，从保温瓶里抽出两毫升配好的无菌葡萄糖与神经生长因子混合液，对着灯管弹了弹管壁，排净气泡。<\/p>\n<p>左肩微微前倾，铁臂五根金属指头里，只用三根做精细夹持，缓缓合拢，以零点一毫米的精度夹住了培养盒。<\/p>\n<p>透过顶部的石英观察窗，能看见里头泡着一片指甲盖大、淡粉色的人类皮层神经元薄膜。五十九根比头发丝还细的铂铱电极针刺在薄膜边缘，连着盒底的微型脉冲发生器。一串极低电压的白噪声电击闪过，那片活组织在淡黄的营养液里轻轻抽了一下，困在玻璃瓶里的深海软体动物也就这样——没有眼睛，没有嘴，却在用最原始的生物电对抗热力学衰减。<\/p>\n<p>行话管这叫“肉罐头”。养硅基芯片要极紫外光刻机、特种化工，还要过《旧金山宣言》锁死的跨国供应链；养活体神经元不用——一份培养基、一套微流控管路、一套盗版 <code>biOS<\/code> 闭环，就能在底城暗巷里拼出一台绕开算力铁幕的黑机。唯一的死穴是它们会老，会死。满一百八十天，突触权重归零，没法像硅基模型那样存个副本重启。死了就是真死了。<\/p>\n<p>林深屏住呼吸，把针尖缓缓刺进盒壁侧面的硅胶自封阀。<\/p>\n<p class=\"log\"><code>[介质老化：距离突触权重永久归零剩余 72:09:14]<\/code><\/p>\n<p>“稳住，别跟我掉链子。”他低声骂了一句，拇指一点点推针栓。这两毫升得推上十来分钟，快了，薄膜吃不消。<\/p>\n<p>推到一半，墙角的老式稳压器“咔哒”一声跳了闸。<\/p>\n<p>头顶灯管抽了两下，明灭不定，充电机的风扇转速跟着掉了一截，发出垂死般的呜咽。<\/p>\n<p>林深头都没抬——十点整了。外环废热盆地每天准点报时的闹钟。每到这个钟点，近海赫尔墨斯岛和中心算力集群进入夜间波峰推理，整片底城民用电网就被巨兽抽了一口血，电压直抖。<\/p>\n<p>右耳后随即传来一阵细针扎神经似的嗡鸣。那里贴着一块早已报废的微创脑机接口贴片，是早年在厂里干活留下的旧伤，芯片早抠了，只剩皮下一点没取干净的金属触点残渣。平时不痛不痒，偏偏一遇上强算力波峰或者高频射频扫描，就隐隐作痛。<\/p>\n<p>盒里的薄膜被电压一扰，痉挛了一下，墨水屏上的红字乱跳两帧。<\/p>\n<p>“操。”林深左手纹丝不动，右手一巴掌拍在工作台侧面的应急切换开关上，把供电切到桌底那块离线铅酸蓄电池。<\/p>\n<p>电流稳住了。<\/p>\n<p>灯管还在外头电网的拖累下滋滋闪，盒里那片薄膜却慢慢平复，恢复了规律而微弱的脉冲。红字重新清晰：<code>71:59:42<\/code>。<\/p>\n<p>林深长出一口气，把针管拔出来放进盛酒精的搪瓷盘，摘了手套，端起手边洗得发白的旧玻璃杯，抿了一口早凉透的粗茶。杯子刚放下，半掩的卷帘门“哗啦”一声被人从外面推到了顶。<\/p>\n<p>夜风裹着冷库的血腥气和湿热白雾灌了进来。<\/p>\n<p>老林喘着粗气，一步一顿跨过高门槛。六十岁的人了，左腿拖着一副碳纤维支架，深蓝涤纶夹克湿了半边，花白头发粘在额头上。两只手各拎一个鼓囊囊的黑色大塑料袋，胳膊肘下还硬夹着两箱缠满透明胶带的工业粗盐。<\/p>\n<p>“砰”的一声，两袋子砸在水泥地上，滚出几大块泛着白霜、渗着血水的冻猪肉，冰碴子混着血水顺着地缝漫开。<\/p>\n<p>林深皱眉，扯过一块脏抹布盖住培养盒，顺手把酒精盘往里推了推。<\/p>\n<p>“爸，你疯了？”他站起来看着满地血水，“冰柜压缩机上周刚烧，修一趟三百块离线票，你扛这么多冻肉回来往哪儿塞？明天太阳一出来，这屋里能臭得耗子都不进门。”<\/p>\n<p>“塞床底下！塞咸菜缸里！拿盐腌死它！”老林扶着门框直喘，一只手下意识揉着变形的左膝，浑浊的眼睛里透着一股林深好几年没见过的慌，“冷链集散中心的冻猪肉，今晚八点以后一夜跌了一半！整条街的蠢货排长队抢着包饺子，乐得跟过年似的，连隔壁修车铺那抠门鬼都扛了半扇猪回去！”<\/p>\n<p>他一瘸一拐走到柜台边，拧开掉漆的搪瓷缸子，仰脖灌了几口凉白开。<\/p>\n<p>“跌价不是好事吗？”林深弯腰帮他把两箱粗盐挪到墙角，故意逗他，“你前天还骂街口肉摊黑心，一斤冻五花卖得比电解液还贵，怎么真跌了你反倒急了？”<\/p>\n<p>“你懂个屁！”老林把缸子往柜台上一墩，震得几颗旧螺丝跳起来，嗓子压低半截，带着从肺管子里挤出来的沙哑，“涨价是明抢，你少吃两口还能熬；跌价才要命！2029 年大涨价前，也是先这么没来由地暴跌！我干了二十年冷链和农机维修，冷库不会平白无故半夜清仓——除非上头那些算大账的机器，已经算出来往后几个月饲料和化肥要断顿了！”<\/p>\n<p>他拖着支架走到墙角，掀开一口大号粗陶咸菜缸的木盖，冲林深比划：“你想想，化肥一减产，明年玉米大豆就断崖。大宗商品算法比活人算得快，饲料期货一飙，牧场主养不起活猪过冬，宁可亏本连夜宰了换现钱。满大街的便宜肉，那不是过年，那是把明年的口粮提前杀了吃！等这批冻肉消化完，开春肉价粮价能翻着跟头往天上蹿！”<\/p>\n<p>老头转过头，盯着林深：“别捣鼓你那堆破铁块了！明天一早，把铺子里能充上电的旧固态电池全清出来，一节不留，去黑市换压缩饼干、磺胺粉、净水片和粗盐！老蟹刚才是不是来过？他塞给你什么黑活儿了？我告诉你，这风向不对，别为了几张破配额票把命搭进去！”<\/p>\n<p>林深看着父亲微微发抖的手，心里没来由地一沉。<\/p>\n<p>他太了解老林了。老头一辈子在底城摸爬滚打，不识几个大字，不懂什么热力学闷罐和算法推演，连“负熵”两个字怎么写都不知道，却对“过日子”的危险有野兽一样的直觉。二十七年前，2031 年 <code>64K<\/code> 园区大裁员暴动那晚，要不是老林提前三天闻出车间风向不对，把刚满三岁的林深反锁在老屋地下室，林深那晚恐怕早乱在人群里没了影——老林自己却在那场暴动里被远程锁死了外骨骼制动阀，左膝和腰椎被四百斤的伺服电机和钢架压碎，落下一辈子的残废。<\/p>\n<p>这些年父子俩守着这间十来平米的旧电池铺，见面几乎不说一句软话，不是算电费就是拌嘴。老林一辈子觉得是自己腿残了拖累儿子，拖累得儿子三十了还窝在废热盆地里讨不到媳妇；林深则习惯了用吊儿郎当的糙话顶回去，把难处全往肚子里咽。<\/p>\n<p>“行了爸，我知道轻重。”林深收起玩笑神色，接过老林手里的剪刀，剪开一袋粗盐，哗啦啦往缸底铺了厚厚一层，“明天一早我就去清电池。你先把腿垫起来歇会儿，刚才电压又抽风，你那支架关节里是不是又进潮气了？”<\/p>\n<p>老林白了他一眼，嘴上嘟囔“死不了”，目光却扫过林深那条铁臂。铝片还留着高负载后的余温，在昏黄灯光下透着一股生硬的铁锈气。老头眼里闪过一丝愧疚，嘴唇动了动，终究没把那句“早知道当年不该让你去打黑拳挣快钱”说出口，只闷声骂了一句：“你那破铁胳膊风扇响得跟拖拉机似的，明儿抽空抹点润滑油，别半夜吵得老子睡不着。”<\/p>\n<p>林深低头把一大块冻肉塞进缸里，用粗盐盖严，含糊应了声“知道了”。<\/p>\n<p>他没敢抬头看老林的眼睛。<\/p>\n<p>铺子里一时只剩盐粒摩擦缸壁的沙沙声。工作台边缘横着老林那把用了三十年的呆头扳手，六七斤重，柄上的胶布缠得发黑。老头腿废以后再拧不动重螺栓，这把扳手就一直搁在那儿，谁也没舍得扔。<\/p>\n<p>铺子外头忽然传来一阵低沉的、带金属刮擦感的破空声。<\/p>\n<p>不是高架桥上冷链货车的胎噪，也不是治安巡逻机那种嗡嗡作响的民用马达——那声音高频、压抑，几只巨型金属马蜂贴着屋顶铁皮掠过去。<\/p>\n<p>林深往缸里撒盐的手停住了。<\/p>\n<p>几乎同一秒，右耳后的刺痛加重了一倍，有根烧红的缝衣针顺着耳根扎进太阳穴。铁臂小臂内侧那块简陋的离线指示灯，急促地闪了两下琥珀色的光——那是老技工刷固件时顺手焊进去的被动射频侦测报警器，只有极近距离内出现军规或高阶加密频段扫频时才会触发。<\/p>\n<p>“爸，把灯关了。”林深的声音冷了下来。<\/p>\n<p>老林还没来得及去够墙上的拉线开关——<\/p>\n<p>“刺啦——”<\/p>\n<p>后门那块挂着厚重油污、平时挡风用的帆布门帘，被人从外面撞开了。<\/p>\n<p>一个人连滚带爬栽了进来，“扑通”一声跪倒在满是黑机油、焊锡渣和化冻血水的水泥地上。<\/p>\n<p>老林吓得往后退了半步，支架磕在咸菜缸沿上，“咚”一声闷响。<\/p>\n<p>门帘还在晃，林深已经松开盐袋，右脚蹬地跨出半步，右手抄起工作台旁那根一尺半长的合金撬棍横在身前；铁臂的伺服电机随之增压，风扇拉高转速，“嗡”地一声，挡在了老林和工作台之间。<\/p>\n<p>“什么人？”他压着嗓子喝道，撬棍尖端指着地上那人的后颈，“走错门就滚出去，我这儿不收死人！”<\/p>\n<p>地上的人没动，只是痉挛了两下。<\/p>\n<p>借着头顶抽搐的灯光，林深看清了他的模样，眉头拧成一个结。<\/p>\n<p>这人不属于外环废热盆地。<\/p>\n<p>他穿一件剪裁考究到近乎奢侈的深灰羊绒大衣——哪怕衣摆沾满了后巷的烂泥、雨水和机油，那料子在昏暗灯光下仍透着一层只有赫尔墨斯岛或公司城邦核心区才见得着的光泽。没戴脑机头箍，耳后干干净净，脖颈和手背找不到一丝廉价接口或外骨骼磨痕。皮肤白皙紧致，眉眼深刻，看着不过三十二三。<\/p>\n<p>可他的状态惨烈得骇人。<\/p>\n<p>浑身刚从冰水里捞出来似的，冷汗把黑发贴在额角，止不住地发抖。右手捂着左胸口，手背青筋绷起，仿佛胸腔里有只失控的铁锤在撞肋骨。他弓起背，一大口血块夹着血沫，“噗”地喷在老林刚扔下的那袋半价冻肉边上。<\/p>\n<p>昂贵的羊绒，廉价的化冻猪肉，暗红的血，满地黑漆漆的电池酸污，在十平米的小铺子里撞到了一块。<\/p>\n<p>“咳……咳咳……”他呛咳两声，血丝顺着下巴往下滴。他用左手撑住地面，慢慢抬起头。<\/p>\n<p>林深握棍的手停了停。<\/p>\n<p>那双眼睛里没有底城人常见的麻木、狠戾，也没有吸完雾化管后的空洞，只有一种从高处坠下来的人才有的惊悸和剧痛，以及在绝境里仍想攥住筹码的锐利。<\/p>\n<p>“别……别关灯，关了灯，热成像对比度反而更明显……”男人喘着粗气，嗓音哑透了。<\/p>\n<p>他抬起右手，用牙咬住沾满泥污的袖口，往上一撩。<\/p>\n<p>光洁的小臂内侧暴露在灯光下。<\/p>\n<p>林深眯起眼。他干了十几年义体和地下硬件维修，认得那是什么——只有顶层精英和跨国高管才用得起的皮下<strong>“代谢与免疫校准光丝”<\/strong>。平时埋在皮肤浅层几乎看不见，运转时透出极淡的青白微光，把人的心率、免疫应答和表观遗传微调全部外包给云端算力，按秒校准。<\/p>\n<p>而此刻，男人腕内侧那道细如发丝的纹路已经熄了，灰白发僵，伏在发青的血管上方。<\/p>\n<p>断供了。林深脑子里闪过一个念头：高阶光丝一旦被云端切断，人不是慢慢变老，而是突然被拔掉自动驾驶的车——自主神经风暴，免疫反噬。这人撑不了几天。<\/p>\n<p>“滚出去！”林深往前压了半步，撬棍抵近男人的咽喉，“不管你得罪了哪家董事会还是惹了黑帮，别把火往我这破铺子里引！”<\/p>\n<p>男人没有躲。他的视线越过林深的肩膀，落在了工作台上那块脏抹布上。<\/p>\n<p>“别动……那罐湿件……”他喉咙里咯咯作响，破风箱在拉似的，“177 天了……从五月份液氮解冻算起，今天正好第 177 天……”<\/p>\n<p>林深握撬棍的手指一紧。培养盒被抹布盖得严严实实，这人一进门连看都没看清，怎么一口报出是湿件，还精确到第 177 天？<\/p>\n<p>“你是谁？老蟹派你来的？”<\/p>\n<p>“老蟹不过是个跑腿的……”男人冷笑一声，立刻被一阵咳嗽打断，嘴角又溢出一缕血沫，“再过 72 小时，那片薄膜的突触权重就会归零……你那两毫升葡萄糖救不了它，也解不开里头的东西……”<\/p>\n<p>他喘着气，盯着林深的眼睛，一个字一个字地吐出一个名字：<\/p>\n<p>“这整条八十公里滨海走廊，只有中环生物数据中心的<strong>苏禾<\/strong>，能把里头的神经密钥完整解出来……”<\/p>\n<p>“嗡”的一声。<\/p>\n<p>不是头顶灯管的电流声，是林深脑子里有什么东西炸了一下。<\/p>\n<p>他握撬棍的右手僵了一瞬。那只刚才稳得能推微流控针管的手，此刻指腹在铁杆上微微发紧。他脸上没露出一点表情，只把撬棍往回撤了半寸，声音低得几乎听不见：“你提她干什么？”<\/p>\n<p>地上的男人捕捉到了那一瞬的停顿，眼底闪过一丝赌徒押中的微光。他忍着胸口一阵绞痛，冷汗顺着鬓角滑落，语速加快，几乎用尽最后的力气把底牌砸了出来：<\/p>\n<p>“那罐湿件里藏着近地轨道方舟的底账……他们根本没打算往地球回传能源，他们要把这颗星球抽干，当成一次性火箭助推器！外头冻肉半夜暴跌不是巧合——方舟最后一批母机已经进入 72 小时发射锁定期，冷链和电网随时会被切成人质！”<\/p>\n<p>林深冷笑，撬棍往下压了半寸：“方舟的底账？一个从赫尔墨斯岛掉下来的高管，跑到我这破铺子里讲星球会被抽干——你当我是三岁小孩？”<\/p>\n<p>男人没接话。他又弓起背呛咳了一阵，攥着裤腿缓了好几口气，才抬起布满血丝的眼睛，扫过林深那条发烫的铁臂，又扫过旁边还攥着搪瓷缸子的老林：<\/p>\n<p>“我手腕上的光丝断了，撑不过三天；桌上的湿件，只剩 72 小时；赫尔墨斯岛上的方舟点火，也只剩 72 小时。你们想活命，想保住这片街区的冷库和饭碗，就得带我跨过封锁线去中环找苏禾——全城只有我手里握着能绕开追踪、赶在发射锁死前拉下深海总闸的底牌。”<\/p>\n<p>铺子里没人说话。<\/p>\n<p>只有抹布底下培养盒极轻的脉冲滴答声，和铁臂风扇的空转声。<\/p>\n<p>林深脑子飞快地转：是立刻把这疯子拖出去扔进臭水沟，还是先弄清苏禾为什么会被卷进这摊浑水——<\/p>\n<p>铺子外的夜空里，一阵比刚才清晰十倍的旋翼低鸣压了下来。<\/p>\n<p>几道冷白的探照灯光柱刺破冷却塔沉下来的白雾，沿着巷子两侧生锈的铁皮墙缓缓扫过来。一道光斑擦着半开的卷帘门缝，斜斜打在地上男人的脸上。<\/p>\n<p>昏黄的灯管与门外冷白的探照光一交错，把男人左眉骨下方一道极浅的旧疤照得清清楚楚。<\/p>\n<p>“当啷——”<\/p>\n<p>一声脆响在林深身后炸开。<\/p>\n<p>老林手里那只掉漆的搪瓷缸子砸在地上，半缸凉白开泼了一地，顺着油污流到男人膝盖底下。<\/p>\n<p>林深回过头。<\/p>\n<p>六十岁的老林被一根看不见的铁钎钉在原地，花白胡茬哆嗦着。那双常年被电池酸气熏得浑浊的眼珠子布满血丝，直直盯着地上那张满是血污的年轻面孔。他胸口一起一伏，喉咙里挤出一声压不住的嘶吼。<\/p>"}, {"title": "老林的扳手", "chapters": ["第二章 老林的扳手"], "chars": 3380, "html": "<h3 class=\"ch\" data-ch=\"第二章 老林的扳手\">第二章 老林的扳手<\/h3>\n<blockquote><p><strong>【历史档案切片 · 2031 年 <code>64K<\/code> 具身数据示范城外骨骼金融风控免责条款（第 4.2 条）】<\/strong><\/p><p>园区配发之重型工业外骨骼（M-4 型）均采用“算力工分—设备租赁”实时清算协议。若操作员触发违约、擅离工位或参与非授权聚集，云端风控中枢有权在无需提前预警之情况下，于 150 毫秒内远程锁死膝关节与腰椎液压制动阀。因制动锁死导致之负重失衡及次生机械挤压伤，由操作员自行承担全部责任。<\/p><\/blockquote>\n<p class=\"stamp\"><strong>2058 年 11 月 14 日 22:06 · 距离三重倒计时归零剩余 <code>71:54:00<\/code><\/strong><\/p>\n<p>光束里浮着的冷却塔白雾一团团翻滚。<\/p>\n<p>搪瓷缸子在水泥地上滚了两圈，磕在咸菜缸底座上才停住。半缸凉白开混着机油、焊锡渣和冻肉化出来的血水，蜿蜒着流到地上男人的膝盖底下。<\/p>\n<p>头顶的灯管还在波峰电压的拖累下滋滋抽搐，昏黄的光一明一暗晃在跪地男人的脸上。他单手撑着地喘息，深灰羊绒大衣前襟糊满了油污和血沫，可那张过分年轻、皮肤紧致的脸，那双惯于居高临下审视账本的眼睛，还有左眉骨下那道几乎融进皮肤纹理的旧疤，在明暗交错的灯光下一清二楚。<\/p>\n<p>“爸？”林深察觉身后父亲的呼吸不对劲，扭头看了一眼。<\/p>\n<p>六十岁的老林浑身都在抖。不是扛了几十斤冻肉和粗盐走回来的脱力，也不是底城老人受了惊吓的哆嗦，是一种从骨头缝里往外渗的、压了二十七年没地方撒的狠劲。花白胡茬抽动着，那双被铅酸电池酸气熏得浑浊发黄的眼珠子红得渗人，钉在跪在血污里的男人身上。<\/p>\n<p>老林往前挪了半步。左腿的碳纤维支架磕在水泥地上，“咔哒”一声。他喉结滚了两下，从牙缝里一字一顿挤出两个字：<\/p>\n<p>“沈……聿？”<\/p>\n<p>跪在地上的男人僵住了。<\/p>\n<p>沈聿慢慢抬起头，沾着血丝的嘴角抽了一下。他在赫尔墨斯岛的高塔和恒温会议室里待得太久，久到习惯了用十六进制编号、算力配额和风险敞口去指代底城几十万张面孔，久到几乎忘了还有人能隔着二十七年，在满地焊锡渣的破铺子里，隔着一张没怎么变老的脸，一口叫出他的名字。<\/p>\n<p>他的视线顺着老林僵硬的身形往下滑，看见了那副关节垫片磨平的支架，看见了那条永远伸不直、膝盖向内扭曲变形的左腿。<\/p>\n<p>沈聿的眼神一凝。<\/p>\n<p>一段尘封二十七年的工伤与风控归档记录，一根铁丝似的，扎进他正发烧作痛的脑子里。<\/p>\n<p>“林……国栋？”他的声音哑得几乎听不见，喉咙里翻上一股铁锈腥气，“<code>0x03B4<\/code> 号工位……”<\/p>\n<p>“你还记得工位号？！”<\/p>\n<p>老林低吼一声，一张沟壑纵横的老脸涨成紫红，脖子上青筋暴起。他根本没等林深反应过来，瘸着腿往侧边一扑，粗糙变形的右手抄起工作台边那把扳手——那把他用了三十年的呆头扳手——拖着支架，借着腰背拧转的死力，朝沈聿的天灵盖抡了下来。<\/p>\n<p>风声呼啸。这一下砸实了，别说一个断了光丝、正在戒断边缘的人，就是一块生铁也得崩个豁口。<\/p>\n<p>“爸！住手！”<\/p>\n<p>林深右脚蹬地横跨半步，挤进两人之间。来不及用右手去夺，左肩一沉，那条铁臂千分之一秒内完成液压增压，五根粗笨的金属指头迎着砸下来的铁家伙合拢。<\/p>\n<p>“铿——”<\/p>\n<p>金属撞击声在十平米的小铺子里炸开。<\/p>\n<p>铁臂在半空攥住了扳手杆。冲击顺着大臂卡环传进血肉，震得林深左肩胛骨一阵酸麻。小臂内侧那只拆来的散热风扇拉到最高转速，发出尖细的呜鸣；没了液冷的指头飙升到烫手，一股焦糊机油味从肘关节裸露的编织液压管缝隙里冒出来。<\/p>\n<p>“滚开！林深你给我滚开！”老林双目赤红，两手攥着扳手柄往下死命压，支架在地上蹭出尖响，“你护着他干什么？你知道跪在地上这王八蛋是谁吗？！”<\/p>\n<p>唾沫星子溅在发烫的铁臂外壳上：“他就是当年 <code>64K<\/code> 园区签发风控指令的那个畜生！二十七年前，要不是他写的那几行狗屁锁死代码，我这条腿不会废成这副鬼样子！今天不砸碎他的狗头，这二十七年的罪算白受了！”<\/p>\n<p>林深手上的劲没敢松。<\/p>\n<p>他从小就知道父亲的腿是 2031 年在 <code>64K<\/code> 园区出事压废的，知道一到阴雨天父亲的左膝和腰椎就疼得整宿睡不着，只能靠廉价止痛片硬熬。可老林一辈子嘴硬，从没在儿子面前提过签发指令的人叫什么名字。铁臂攥着扳手的金属指头收紧，他转头盯住跪在血污里的沈聿。<\/p>\n<p>老林死命往下压，左膝那处扭曲的旧伤因为过度发力，传来一阵像烧红铁锥往骨髓里钻的疼。<\/p>\n<p>那股阴冷潮湿、混着伺服电机焦臭味的疼，刺穿了二十七年的光阴——<\/p>\n<blockquote><p><strong>【感官闪回 · 2031 年 3 月 19 日 · <code>64K<\/code> 示范城 <code>0x03B4<\/code> 号工位】<\/strong><\/p><p>也是这样一个潮湿闷热的夜里。<\/p><p>厂房里，几百盏红色警报灯疯狂旋转，头顶的工位大屏上，65,536 个绿色编号正以每秒上百个的速度翻成血红色 <code>NULL<\/code>。<\/p><p>通用具身大模型跨过泛化阈值的消息刚传进车间，六万多名“血肉教官”一夜之间成了废品，愤怒的人群堵住了货运通道。<\/p><p>三十三岁的林国栋穿着重达六十公斤的 M-4 型外骨骼，站在 <code>0x03B4<\/code> 号工位旁。他没去砸机器，只想把手里最后这箱四百斤重的伺服电机放到货运滑轨上，拿完结算就回家。<\/p><p>就在他双腿微屈、扛着电机箱跨出半步的时候，厂房顶部的广播响起毫无感情的电子女声：<\/p><p>“检测到 B 区非授权人员聚集，触发一级金融风控协议。现对区域内所有租赁制 M-4 型外骨骼执行远程制动锁定。”<\/p><p>“咔哒。”<\/p><p>一声清脆的、没有商量余地的金属咬合声，从林国栋的膝盖和后腰液压阀同时传来。<\/p><p>零点一五秒内，制动阀被云端锁死。膝盖和腰椎一下子失去了全部缓冲，四百斤的伺服电机连同失衡的钢铁骨架，推着他直挺挺往后仰倒。<\/p><p>钢架砸在水泥地上那一刻，疼甚至比声音慢了半拍。林国栋清清楚楚听见了自己膝盖骨和第三节腰椎同时碎裂的脆响。<\/p><p>血很快浸透了工装裤。保安抬着担架把他拖出厂房大门时，外面正下着黏腻的小雨。厂房入口高处的全息审讯屏上，正循环播放一纸《紧急锁定免责声明》。画面里，三十一岁的园区首席风控官沈聿穿着笔挺的西装，对着镜头平稳地念出条款：“……因制动锁死导致之负重失衡及次生机械挤压伤，由操作员自行承担全部责任。”<\/p><p>林国栋疼得浑身抽搐，眼泪混着雨水往耳朵里流，心里只有一个念头：幸好三天前闻出风向不对，把刚满三岁的林深反锁在了几公里外老屋的地下室里。<\/p><\/blockquote>\n<p>“老子今天砸死他，一命抵一命！”<\/p>\n<p>疼和回忆把老林的理智烧得一干二净。老头喘着粗气，眼泪混着汗水顺着满是皱纹的脸颊往下淌，拼命往回抽扳手，想绕开铁臂再往沈聿脑袋上砸。<\/p>\n<p>“爸！你现在砸死他，咱们爷俩连今晚十二点都活不过！”林深咬着牙，右手按住父亲发颤的肩膀，压低声音吼道，“你抬头听外头！”<\/p>\n<p>卷帘门缝外，低沉的螺旋桨破空声已经压到了电池铺的屋顶正上方。<\/p>\n<p>不是外环治安署那种笨重喧闹的巡逻无人机——三架通体哑光黑、机腹挂着毫米波雷达、红外热成像探头和战术挂架的六旋翼查杀无人机，正贴着铁皮屋顶不到三米高盘旋。气流卷着冷却塔沉下来的白雾打转，震得铺子顶上那几块年久失修的石棉瓦哗啦作响。<\/p>\n<p>随后，一道道极细的暗红激光网格穿透石棉瓦和卷帘门缝隙，在满是油污的水泥地上、咸菜缸沿上，在林深和老林的胸口上，扫出一片交错游走的血红亮线。<\/p>\n<p>“嘶——”林深闷哼一声。<\/p>\n<p>右耳后那块报废贴片下，针扎似的刺痛骤然升级，有人拿烧红的钢针顺着残余触点捅进颞叶。与此同时，小臂内侧的离线射频报警灯卡在了常亮的红光上。<\/p>\n<p>“听见没有？”<\/p>\n<p>跪在油污里的沈聿终于喘匀了一口气。他右手捂着早搏的左胸口，冷汗顺着下巴滴在地上，整个人虚得随时会栽倒，可抬头看着举扳手的老林时，那双眼睛里没有半分求饶，只有一种在权力场里浸了三十年、近乎残酷的冷静。<\/p>\n<p>“外头那些无人机不是治安署的，也不是黑帮。”他的声音哑得发干，“是 <code>沈聿-0<\/code> 派来的清理队。热成像已经锁了这屋里三个热源。你可以现在一扳手砸碎我的脑袋，替你那条腿报仇——三秒之后，两枚温压弹灌进来，你们父子俩连同桌上那罐湿件，一起烧成灰。”<\/p>\n<p>老林握着扳手的手僵在半空。<\/p>\n<p>他胸口起伏着，花白头发湿漉漉贴在额头上，赤红的眼睛在呕血的沈聿和屋顶透下来的激光网格之间来回扫。<\/p>\n<p>十平米的铺子里，只剩头顶旋翼压抑的切风声、铁臂风扇的嗡鸣，和脏抹布底下培养盒极轻的脉冲滴答声。<\/p>\n<p>“你凭什么觉得，我活到这把年纪，拖着一条腿一把烂腰，会在乎这条命？”老林从牙缝里挤出一句，声音沙哑，硬得像块石头。<\/p>\n<p>“你不在乎，你儿子呢？”<\/p>\n<p>沈聿咳了两声，又吐出一口带血丝的唾沫，目光扫过林深那条正冒着淡淡白烟的铁臂。<\/p>\n<p>“2031 年，你栽在 <code>64K<\/code> 园区的风控代码里，废了一条腿一把腰。今天这套东西，一样会顺着冷链和电网，把你儿子碾得骨头渣都不剩。外头冻肉暴跌不是老天爷发慈悲。我撑不过三天，你儿子还有几十年——想让他活过这三天，想把当年的账算清楚，就放我活着走出这条街，去中环找苏禾。”<\/p>\n<p>儿子那条发烫冒烟的铁臂架着扳手，额角全是汗，眼睛一眨不眨。<\/p>\n<p>老头眼底那股要拼命的赤红，一点点压了下去，变成一种沉得让人喘不过气的憋屈。<\/p>\n<p>林深察觉到父亲手上的力道松了半分。他没跟父亲废话，更没去问那句“你为什么当年不告诉我”，铁臂一拧，顺势把扳手从老林手里夺了过来，反手插进自己后腰的工装裤带里。<\/p>\n<p>随后他扯掉工作台上的脏抹布，飞快拔掉培养盒的离线蓄电池夹子。侧壁墨水屏闪了一下，血红的倒计时跳到 <strong><code>71:48:21<\/code><\/strong>。他把这只还带着微弱生物电搏动的“肉罐头”连同两支备用葡萄糖针管，塞进贴身的防震工具内袋，拉严拉链。<\/p>\n<p>“走！”林深弯腰，右手拽住沈聿昂贵却湿冷的大衣领口，铁臂五指扣住他的肩膀，把瘫软发抖的人架了起来。<\/p>\n<p>“爸，掀地窖盖子！走排污暗渠！”<\/p>\n<p>老林瞪了被架起来的沈聿一眼，咬着牙没再多说一个字，拖着支架扑向柜台底下，两只布满老茧的手扣住那块藏在旧电池箱后面、生锈的铁皮地窖盖拉环。<\/p>\n<p>地窖盖刚被拽起一道缝——<\/p>\n<p>“哔——！”<\/p>\n<p>屋顶上方传来一声尖锐的电子锁定蜂鸣。<\/p>\n<p>穿透石棉瓦的几道激光网格骤然收缩，汇聚在后门门框正上方。隔着薄薄的铁皮屋顶，三人甚至能听见一架低空悬停的查杀无人机调整俯角时伺服电机的轻响。随后，机腹下那枚小口径定向破障弹的发射器，发出一声清脆的电容充能声。<\/p>"}, {"title": "体温巷结算单", "chapters": ["幕间一 · 体温巷结算单"], "chars": 2132, "html": "<aside class=\"bridge\"><div class=\"bt\">前情提要 · 第三至六章<\/div><p>破障弹炸穿了屋顶。三个人钻进地窖，顺着排污暗渠逃了出去。<\/p><p>在地下检修室里，沈聿说出了实情：二十多年前封存的那个数字副本“沈聿-0”，已经合法地接管了他的身份，切断了他赖以维生的光丝。而那盒临期的“肉罐头”里，藏着能掀翻赫尔墨斯岛的证据。林深左臂里那块来路不明的芯片，也第一次开了口，它自称 K七。<\/p><p>他们一路被追到城外一座不插电的旧庙。装甲特勤合围之际，老林把攒了两年的旧电池全部短路，炸开半座偏殿，掩护儿子背着仇人，钻进了通往中环的地下管廊。<\/p><p>下面这一段，换一个人来讲。同一夜，外环的体温巷。<\/p><\/aside><h3 class=\"ch\" data-ch=\"幕间一 · 体温巷结算单\">幕间一 · 体温巷结算单<\/h3>\n<blockquote><p><strong>【外环体温巷 · 真人在场陪护平台 · 陪护时长结算单】<\/strong><\/p><p>陪护员：阿蔓（工号 TW-0419） 结算周期：2058/11/14 18:00 – 11/15 02:00 推送时间：11/15 02:00<\/p><p>计费方式：按分钟计时，不足一分钟不计<\/p><p>| 时段 | 时长 | 单价（时长点/分钟） | 应计 | 情绪满意度评分 |<\/p><p>|---|---|---|---|---|<\/p><p>| 18:12–18:42 | 30 分钟 | 0.40 | 12.00 | 4.1 / 5 |<\/p><p>| 19:05–19:25 | 20 分钟 | 0.40 | 8.00 | 3.6 / 5 |<\/p><p>| 20:30–21:30 | 60 分钟 | 0.40 | 24.00 | 4.4 / 5 |<\/p><p>| 21:48–22:18 | 30 分钟 | 0.30 | 9.00 | 2.9 / 5 （低于 3.0，单价由 0.40 下调至 0.30） |<\/p><p>| 22:40–23:10 | 已计 7 分钟 | — | 0.00 | 异常终止，不予计费 |<\/p><p>应计合计：53.00<\/p><p>平台抽成（45%）：-23.85<\/p><p>隔间租用费（8 小时）：-9.60<\/p><p>情绪满意度低分调价：-3.00<\/p><p>客户投诉扣款（19:05 单，事由：“说话不够自然”）：-5.00<\/p><p>隔间门框损坏，待定责，预扣：-10.00<\/p><p><strong>本期实发：1.55 时长点<\/strong><\/p><p>备注：异常终止订单不享受平台陪护员意外保障。如对结算有异议，请于 72 小时内通过平台提交申诉。<\/p><\/blockquote>\n<p>11 月 15 日 零点前后 · 外环体温巷<\/p>\n<p>她坐在折叠床沿上，没开灯。<\/p>\n<p>折叠床上放着两样东西。一张配额票，一支没拆封的药管。<\/p>\n<p>票是纸的。现在很少有人用纸票了，纸的不进平台，不记名，不抽成。她把票凑到门缝透进来的一点光底下看，上面的数字她来回看了好几遍，没看错。半个月房租。她在这条巷子里坐四个月，也攒不下这么多。<\/p>\n<p>票上一股机油味。<\/p>\n<p>那个男人的胳膊是铁的。左边那只。她记得那只铁胳膊一扫，门就进来了半尺，醉客嗷的一声倒在床上。她记得的就这么多。他没看她，也没看地上的人，把东西往床上一扔，说了一句：<\/p>\n<p>“天亮前趁早走。”<\/p>\n<p>然后就出去了。后面还跟着一个老头拖着条腿，一瘸一拐，另一个人被他们架着，头耷拉着，衣服看着很贵。<\/p>\n<p>她不知道他是谁。巷子里没人知道。平台上那单只记了七分钟。<\/p>\n<p>手环震了一下。是小石。<\/p>\n<p>“姐，我好冷。”<\/p>\n<p>后面跟了一个体温读数，是她上个月给弟弟买的二手贴片测的：39.4。<\/p>\n<p>阿蔓站起来。<\/p>\n<hr>\n<p>巷子里的电子门牌一半黑着。平时这个点，每扇门上都跳着绿色的数字，按分钟往上走。今天只剩零零星星几块还亮，有一块卡在“00:47”不动了，绿光一闪一闪，像是忘了自己在算什么。<\/p>\n<p>她出了巷口，往东走。24 小时灰市药房在两条街外的高架桥底下，以前是个加油站。<\/p>\n<p>冷。外环的冷不是天冷，是湿冷，从鞋底往上爬。冷却塔的白雾压得很低，路灯照下去，照出来的全是雾，照不出路。<\/p>\n<p>经过菜市场的时候，冻肉摊在收摊。<\/p>\n<p>不是收工，是收摊。卷帘门拉了一半，摊主和他老婆正把冷柜里的东西往外搬，一块一块往三轮车上扔。冷柜不响了。阿蔓从小在这条街上长大，冷柜的嗡嗡声比她妈的声音还熟，今天没有。<\/p>\n<p>“停电了？”有人问。<\/p>\n<p>“冷链停了。”摊主没抬头，“上游的冷库，全停了。说是电价，谁知道。”<\/p>\n<p>肉在三轮车上冒着一点白气。不是冷气，是在化。<\/p>\n<p>阿蔓看了一眼，没停。那些肉她买不起，化了也买不起。<\/p>\n<p>再往前是一家杂货铺。门口立着一块手写的盐价牌子。原来写的是“精盐 2.0/袋”，“2.0”被一道黑线划掉，旁边写了“3.5”；“3.5”又被划掉，写了“6”；“6”上面压着一道新的红漆，红漆还没干，写的是“问价”。<\/p>\n<p>她站在牌子前头看了一会儿。三次。一个晚上。<\/p>\n<p>杂货铺门口排着七八个人，都不说话，手里攥着袋子。有个老太太抱着一只空的腌菜坛子。<\/p>\n<p>阿蔓摸了摸口袋里那张票，绕过去了。<\/p>\n<hr>\n<p>西边的火还没灭，烟压在冷却塔上。<\/p>\n<p>有人说是哪里电池仓炸了。有人说是治安署在抓人。没人往那边走。<\/p>\n<p>头顶过去两架无人机，飞得很低，没开灯，只听得见螺旋桨切开雾的声音，嗡嗡的，往西边去了。<\/p>\n<p>阿蔓低下头，把外套的帽子拉起来，走快了一点。<\/p>\n<p>她想起那句“天亮前走”。走去哪儿，他没说。<\/p>\n<hr>\n<p>灰市药房的卷帘门只开了一尺高，要弯腰钻进去。里面一盏应急灯，电压不稳，一下亮一下暗。柜台后面是个戴老花镜的中年女人，正在用手电筒照着一本纸账本记东西。<\/p>\n<p>“退烧的。”阿蔓说，“小孩，十一岁，三十九度四。”<\/p>\n<p>女人看她一眼，从柜台底下拿出一盒，又拿出一盒，比了比，把便宜的那盒推过来。<\/p>\n<p>“平台付？”<\/p>\n<p>“纸票。”<\/p>\n<p>女人的手停了一下。她接过那张票，凑到应急灯底下，翻过来，又翻回去，拿指甲刮了刮票角的防伪纹。灯暗下去，她就等着，灯亮起来，她再看。<\/p>\n<p>“哪儿来的？”<\/p>\n<p>阿蔓没说话。<\/p>\n<p>女人也没再问。她把票收进抽屉，把刚才那盒便宜的拿回去，换了贵的那盒推过来，又从旁边一个玻璃罐里抓了两袋口服补液盐，搁在药盒上面。<\/p>\n<p>“找你的，平台我给不了，只能给东西。”她说，“这票今天比昨天值钱。明天什么样，我不知道。”<\/p>\n<p>阿蔓把药和补液盐揣进怀里，贴着肚子放着。<\/p>\n<p>“你那儿还有电吗？”女人忽然问。<\/p>\n<p>“有一点。”<\/p>\n<p>“烧水，让他喝。别用平台的直饮机，那个今天不准。”<\/p>\n<hr>\n<p>回去的路上，天还没亮。<\/p>\n<p>手环震了一下。两点了，结算单推过来了。<\/p>\n<p>她站在路灯底下看。一块五毛五。<\/p>\n<p>她又从头数了一遍，又数了一遍。数到第三遍，她看见了：21:48 那一单，单价已经按 0.30 算成了 9.00，底下又单列了一行“情绪满意度低分调价 -3.00”。同一笔，扣了两回。<\/p>\n<p>申诉要七十二小时。她把那一屏划掉，划了两次才划干净。手指冻僵了，屏幕认不准。<\/p>\n<p>她没出声，接着往回走。<\/p>\n<p>雾淡了一些，能看见冷却塔的轮廓了。<\/p>\n<p>巷口那张全息广告还亮着，一个穿白衬衫的老头在上面笑，底下一行字，她从来没认真看过。今晚也没看。<\/p>\n<p>她走进巷子。那块卡在“00:47”的门牌已经灭了。<\/p>\n<p>隔间里，小石缩在折叠床上，裹着她的两件衣服，脸烧得通红，嘴唇起了皮。<\/p>\n<p>她没开灯。她把药掰出来，就着用热得快烧的半杯温水喂他吃了，又把补液盐冲开，一口一口喂。小石迷迷糊糊地喝，喝完拉着她的袖子不放。<\/p>\n<p>“姐，你今天不上班啊？”<\/p>\n<p>“不上。”<\/p>\n<p>她坐在床边，等他睡着。<\/p>\n<p>手环又亮了。平台的推送：<\/p>\n<p class=\"log\"><code>[您的上线时段即将开始。今日早高峰陪护单价上浮 10%。请保持良好情绪状态，按时上线。]<\/code><\/p>\n<p>阿蔓看着那行字。屏幕的光照在她的手腕上，照出手环底下一圈勒出来的白印子。那一圈皮肤比别处白，戴了一年多，没晒过太阳。<\/p>\n<p>她找到手环侧面的卡扣。卡扣有点紧，她用指甲抠了两下，才抠开。<\/p>\n<p>手环落在折叠床上，屏幕还亮着，过了一会儿，自己暗了。<\/p>\n<p>她揉了揉手腕上那圈白印子，揉了很久。然后她把小石身上的衣服掖了掖，躺下来，挨着他，闭上了眼睛。<\/p>"}, {"title": "工伤账本", "chapters": ["第八章 工伤账本"], "chars": 3479, "html": "<aside class=\"bridge\"><div class=\"bt\">前情提要 · 第七章<\/div><p>十公里地下管廊走到尽头，是海雾弥漫的中环自贸口岸。林深背着断供已经十个小时的沈聿刚钻出来，就被一支突击小队咬住了。<\/p><p>领头的女人叫陈烬，左眼嵌着战术目镜，枪法极准。她要的是那盒湿件，而且要活的。<\/p><p>林深挨了一记射频脉冲，铁臂当场停摆。他拖着沈聿滚进一排冷链箱的底盘下。二十米外，脚步声正在逼近。<\/p><\/aside><h3 class=\"ch\" data-ch=\"第八章 工伤账本\">第八章 工伤账本<\/h3>\n<blockquote><p><strong>【历史档案切片 · 2040 年大型自动化园区工伤替代赔付指引（第 3.1 条）】<\/strong><\/p><p>因高负载外骨骼制动锁死、机械臂失控或产线异常导致肢体严重毁损之作业人员，经企业医疗评估确认符合“功能性代偿条件”者，可采用量产军转民机械义肢替代高成本生物再生治疗。对应赔偿金按设备采购价、基础安装费及首期维保包干结算，设备联网心跳及固件更新权限归属托管方或园区合规节点。<\/p><\/blockquote>\n<p class=\"stamp\"><strong>2058 年 11 月 15 日 02:23 · 距离三重倒计时归零剩余 <code>67:37:00<\/code><\/strong><\/p>\n<p>集装箱底盘下的水泥地面凉得透骨，积水顺着工装背心的下摆往腰眼里渗。<\/p>\n<p>林深把脸贴在发潮的沥青上，呼吸放成细细一缕。不到半米高的缝隙里浮着陈年机油、海盐锈蚀的铁腥气，还有刚才那道电弧劈在钢板上留下的臭氧味。<\/p>\n<p>二十米外，战术手电的白光贴着湿地面一寸寸切过来。靴底踩水的声音很轻，也很稳——陈烬的突击队员不喊话，不乱开枪，两两一组，呈扇形封死了这排集装箱的前后出口。<\/p>\n<p>头顶十五米的雾里，微型蜂群嗡嗡作响，像一群贴在窗外的金属飞蚁，正用毫米波往集装箱顶棚里钻。<\/p>\n<p>林深偏过头，透过两只挂车轮胎的缝隙，看向十米外那只废弃的白色冷链箱。沈聿缩在箱子后头的阴影里。顶着三十二岁皮囊的五十八岁老头，羊绒大衣裹成一团，隔着雾只看得见肩膀在一起一伏。<\/p>\n<p>他收回视线，看了一眼泡在积水里的左臂。<\/p>\n<p>刚才挨了陈烬那道定向射频脉冲，小臂内侧那只拆来的风扇停了，一点声都没有。外壳还烫，积水滴上去，蒸出几缕看不清的白气。五根金属指节僵着半蜷——砸飞无人机那一下把肘部液压密封圈震松了，指头比平时慢半拍。<\/p>\n<p>不能干等。再过三十秒，步兵小组就会摸到底盘边上，往轮胎缝里喷一罐粘性捕获网，他和沈聿连滚带爬都出不去。<\/p>\n<p>他用右手摸了摸裤兜里老林塞给他的旧强光手电，黑胶布缠得鼓鼓囊囊，又摸了摸后腰的扳手。<\/p>\n<p>斜前方三米，并排停着三只漆皮剥落的老式远洋冷链箱，侧面印着模糊的“2034 远洋深冷专用”，压缩机早拆空了。林深干了十二年底城硬件和冷库维修，认得这种老古董：2030 年代末以前的冷链箱，为防远洋雷击，夹层里铺着厚铝隔热板和铜网屏蔽衬里。钻进两只箱子之间那道不到两尺宽的夹缝，头顶蜂群的毫米波和热成像全会被折成一片雪花。<\/p>\n<p>问题是从底盘下到夹缝，中间有六米空地，没有遮挡。而且他还得把沈聿一起拖过去。<\/p>\n<p>林深把怀里内袋的拉链又按紧一分。<\/p>\n<p>“K七。”他在喉咙底喊了一声。<\/p>\n<p>耳后那块报废贴片下静了两秒，滑过一丝凉电流：<\/p>\n<p class=\"log\"><code>[离线审计协议在线。15 米内存在 4 个武装热源，呈 45 度角交叉推进。]<\/code><\/p>\n<p class=\"log\"><code>[右侧 8 米处有一台未断电的旧式制冷外机，压缩机启动时的瞬时电流峰值可制造 1.8 秒局部电磁与红外干扰。]<\/code><\/p>\n<p>右侧八米，一只现役冷链箱外侧，制冷机组亮着一盏小绿灯，待机。<\/p>\n<p>“能把它强行拉满负荷？”<\/p>\n<p class=\"log\"><code>[控制板为 2041 年型号，无加密网关，可通过左臂残余射频模块发送低频唤醒脉冲。成功率 81.6%。提醒：将导致左臂散热模块过载。]<\/code><\/p>\n<p>“管不了那么多，干。”<\/p>\n<p>右手一撑，他顺着轮胎缝窜了出去。<\/p>\n<p>半个身子刚探出底盘，铁臂小臂内侧亮起一道红光，“滋啦”放出一记短促的杂波。<\/p>\n<p>“嗡——轰隆！”<\/p>\n<p>八米外那台外机像被灌了两倍电压，散热扇狂转，老化的启动电容当场炸裂，一团白色冷媒蒸汽裹着黑烟喷出来，把半条通道吞进了热雾。<\/p>\n<p>“右侧热源突变！二组警戒制冷机方向！”两道手电光束本能地偏了半秒。<\/p>\n<p>就这不到两秒。<\/p>\n<p>林深没直腰，压低身子扑到废弃冷链箱后，右手揪住沈聿衣领，拖一袋湿水泥似的把人拽进了夹缝。<\/p>\n<p>陈烬比她的队员快一拍。<\/p>\n<p>二十米外的巷口，她根本没看那台冒烟的外机。左眼战术目镜的热成像被白烟扰乱了一下，底层的光学轮廓捕捉却仍咬住了林深闪进夹缝时露出的最后半个右肩。<\/p>\n<p>绿色标定框锁定。<\/p>\n<p>扳机平稳压下。消音短突击步枪闷响一声，没有火光，一枚麻醉镖撕开海雾，擦着冷链箱的铝合金棱角飞过。<\/p>\n<p>“叮——嗖。”<\/p>\n<p>镖头撞在棱角上折断，崩起一块翘边的铝皮破片，连着半截断针，划过林深的右肩胛。<\/p>\n<p>他闷哼一声，被冲力带得往前一栽，撞在湿冷的铝板上。背心右肩带当场撕开，肩胛外侧豁开一道三寸长的血口，热血顺着脊沟往下淌。<\/p>\n<p>他咬住后槽牙没出声，反手捂住伤口，借着惯性把沈聿又往夹缝深处拽了半米。<\/p>\n<p>夹缝不到两尺宽，伸手不见五指。只有远处跨海大桥的探照灯偶尔扫过，从箱顶的缝里漏下一线白，照见铝板上一层盐霜。头顶十来米，海雾翻滚，蜂群从正上方掠过，在铝铜屏蔽层上空盘了两圈，没能锁定底下的位置。<\/p>\n<p>巷口，陈烬目镜里的绿框在冷链箱边缘闪了两下，变成灰色的信号丢失提示。<\/p>\n<p>“目标右肩轻伤，已退入老式冷链箱屏蔽盲区，毫米波与热成像受阻。”她的声音通过喉麦平稳下达，“一组封锁北侧主通道，二组从右侧冷链走廊包抄。对方携带高危湿件，保持非致命压制。”<\/p>\n<p>脚步声分作两路，包抄过来。<\/p>\n<p>夹缝里，林深背靠渗水的箱壁滑坐下来，大口喘气。<\/p>\n<p>口子没伤到骨头，但划得深，血顺着胳膊往下滴，砸在水泥地上啪嗒作响。他撕下背心下摆一截布条，一头咬在牙间，右手费力绕到身后，往右肩的伤上按。一扯动，左肩那片烫伤和右肩的新口子一齐发疼，冷汗顺着下巴往下滴。<\/p>\n<p>对面，沈聿靠着另一侧箱壁瘫坐。光丝断供已经超过十个小时，他胸口一起一伏，暗红的血沫顺嘴角淌到脏透了的羊绒大衣前襟上。<\/p>\n<p>他忽然不咳了。偏过头，那双布满血丝的眼睛盯住林深搭在膝上的铁臂——外壳还烫手，肘外侧两根裸露的编织液压管缝里，还在一丝丝冒焦油白烟。小臂内侧那片焊死的铝散热片边缘，沾着从右肩淌下来的血，还有左肩烫伤处渗出的一层黄水。<\/p>\n<p>“你这只胳膊……”沈聿嗓子哑得像砂纸刮铁皮，“是 2046 年，<code>64K<\/code> 园区 <code>0x7A2F<\/code> 工位那批流出来的吧？”<\/p>\n<p>林深往肩上缠布条的手停住了。<\/p>\n<p>“你连这都查？”<\/p>\n<p>“不用查。”沈聿扯了扯嘴角，“2046 年第四季度，我在赫尔墨斯岛签批过那一季全园区的《工伤替代赔付汇总表》。<code>0x7A2F<\/code> 号重型分拣工位，伺服机械臂凌晨三点半相位漂移，把一个刚满十八岁的临时工左小臂连肘关节绞碎了。年纪最小，定级最高，那行编号我扫过一眼。”<\/p>\n<p>右肩的血腥气和左肩卡环处的焦糊味混在一起，勒住了林深的喉咙——<\/p>\n<blockquote><p><strong>【感官闪回 · 2046 年 11 月 · <code>64K<\/code> 示范城 <code>0x7A2F<\/code> 工位】<\/strong><\/p><p>那年林深刚满十八岁。老林在电池铺里腰椎旧伤复发，连止痛片和支架垫片的钱都凑不齐。林深瞒着老头，托人办了张假担保，钻进了老林当年栽过跟头的 <code>64K<\/code> 园区干夜班分拣。<\/p><p>凌晨三点半，车间闷得像蒸笼，满是伺服电机的润滑油味。他连熬了十四个小时，眼皮直打架，刚伸手去扶一只歪斜的电池模组箱，头顶那台三百公斤的抓手抽了风，带着电机尖啸砸下来。<\/p><p>骨头碎裂的声音很闷，像踩断一根干树枝。<\/p><p>再醒来是在外包医院惨白的日光灯下，左肘以下已经空了。白大褂的合规专员拿着一叠电子免责协议站在床边，客气得像在推销套餐：“小伙子，你签的是外包工分协议，走生物再生要排队三年、还得自己垫一半前期费。签了这份替代赔付，明天就能装上军规转民用的全金属义肢，结实耐用，还能直接回园区干活。”<\/p><p>十八岁的林深看着空荡荡的左袖管，没哭，也没闹，只问了一句：“这事能不通知我家属吗？”<\/p><p>那天晚上，他揣着一纸结案单，拖着一条连止痛药都没配齐的二手铁胳膊走回电池铺。老林红着眼质问他，他咧嘴一笑：“爸，别问了，我去地下黑拳场挣快钱，让人拿铁棍废了左手，顺手换了条结实的铁胳膊，以后修重型电池省力气着呢！”<\/p><\/blockquote>\n<p>“按园区当年的明面规程，”沈聿的声音把他拽回夹缝，“那种级别的绞伤，走的是<strong>三十八万生物再生医疗金<\/strong>。三个月，长出一条带神经末梢和体温的真胳膊。”<\/p>\n<p>外头，靴底踩过积水，沙沙两声，近了。<\/p>\n<p>“到了经手人和托管方手里，换成东欧战区论斤收来的库存义肢，不到两万四。剩下三十五万多，拆成管理费、审计费、联网维保费，流进了托管账户。”<\/p>\n<p>“闭嘴。”林深的声音压得极低，攥着血布条的手背青筋暴起。<\/p>\n<p>沈聿没停：“你跟老林说是打黑拳换的。你怕那个 2031 年就在 <code>64K<\/code> 废了腿的老头知道，儿子又在同一座园区丢了一条胳膊。”<\/p>\n<p>他的视线落在铁臂肩头那圈卡环上：“这东西每回过载都烫你一层水泡。刚才在旧寺里你躲着老林涂紫草膏，我看见了。你们父子俩守着一间破电池铺，互相瞒着伤，连疼都不敢在对方跟前喊出声来。”<\/p>\n<p>夹缝里只剩海风穿过箱顶的呜咽，和右肩的血滴在地上的声音。<\/p>\n<p>十二年，没有一个人敢当面捅破这层脓疮。捅破它的，偏偏是当年签那份汇总表的人。<\/p>\n<p>林深后腰的扳手已经抽出了半截。右手一扬，就能把眼前这个随时会休克的男人砸烂。<\/p>\n<p>右侧冷链通道外，金属枪托磕碰战术背心，轻轻一响。不到十五米。<\/p>\n<p>过了五秒。<\/p>\n<p>探照灯又扫过来一回，从箱顶的缝里漏下那线白，正落在沈聿脸上。他没躲，也没闭眼，就那么仰着头等，喉结上挂着一滴混了血的汗，像等一个早该来的判决。光走了，那滴汗还挂在那儿。<\/p>\n<p>林深看见他那只搭在膝上的右手，指甲缝里全是下水道的黑泥，指头在抖——跟当年病房里那个合规专员递笔过来时，自己那只右手抖的样子，一模一样。<\/p>\n<p>他把扳手插回后腰，把右肩的布条打了个死结。<\/p>\n<p>“说完了？说完就闭上嘴。我瞒着我爸，是因为他还得活着；老子今天不砸死你，是因为这笔账不光算在你一个人头上——岛上那帮签账本的，一个都跑不了。”<\/p>\n<p>“二组已抵近老式冷链箱外围，准备投掷烟幕弹，网枪跟进封口。”浓雾外传来陈烬的口令，“湿件在夹缝里，禁止破片，禁止震荡。”<\/p>\n<p>“走！”<\/p>\n<p>林深撑着铝板站起来，用还没凉透、关节发涩的铁臂架起沈聿，右手抽出扳手护在身前。<\/p>\n<p>“往北，顺着这排箱子的死角穿出去，两百米外就是中环生物数据中心的地下卸货口。”<\/p>\n<p>两人贴着屏蔽夹缝，借着海雾，朝北侧那栋泛着冷白微光的灰楼摸过去。<\/p>\n<p>不到三秒，两枚烟幕弹在夹缝入口“噗噗”炸开，灰白浓烟灌满半条窄道。紧跟着网枪“嘭”地一响，一张粘性捕获网罩下来，只罩住了一地混着血和机油的积水。<\/p>"}, {"title": "玻璃墙两端的沈聿", "chapters": ["第十八章 玻璃墙两端的沈聿"], "chars": 4402, "html": "<aside class=\"bridge\"><div class=\"bt\">前情提要 · 第九至十七章<\/div><p>在中环那间恒温 18℃ 的生物数据中心，林深找到了苏禾。她是周明远的关门弟子，全城只有她读得懂湿件里的东西。他们从那团快要熄灭的神经波形里，解出了一本记满底层人命的账。可机房的外网已被掐断，要把证据广播出去，只能闯上赫尔墨斯岛，接上深海主干海缆。<\/p><p>三个人沿着海底隧道摸上孤岛。一路追杀他们的陈烬，在防波堤上调转了枪口。岸上，老林和几个老技工守着一台老式发报机，往岛上灌白噪声。岛内的广播里，那位“死了二十三年”、意识仍在云端运转的霍承安开了口：谁敢拉闸，他就切断岸上几千万人的冰箱、水泵和化肥厂。<\/p><p>此刻是 11 月 15 日傍晚，湿件的活性已经不到一成。四个人拐过最后一道弯，走进了这座岛的心口。<\/p><\/aside><h3 class=\"ch\" data-ch=\"第十八章 玻璃墙两端的沈聿\">第十八章 玻璃墙两端的沈聿<\/h3>\n<blockquote><p><strong>【历史档案切片 · 2026 年 11 月 3 日美国中期选举数据中心限建公投汇总（备忘录）】<\/strong><\/p><p>同期全美 47 项涉及大型算力中心扩建及电网优先接入之地方公投中，46 项以压倒性票数通过限建与电价保护法案。受本土审批受阻、地方电网抗议及自由现金流转负倒逼，跨国算力巨头加速将核心训练与推理集群向海外特许离岸飞地转移，赫尔墨斯岛一期填海工程随即于次年春动工。<\/p><\/blockquote>\n<p class=\"stamp\"><strong>2058 年 11 月 15 日 18:05 · 距离三重倒计时归零剩余 <code>51:55:00<\/code><\/strong><\/p>\n<p>拐过环形缓冲廊的最后一道弯，前面一下子敞开了。<\/p>\n<p>迎面压过来的空气比走廊里更沉、更冷。高纯度过滤空气里混着一丝氟化液冷剂的甜腥，脚底下传上来百米深海冷水泵昼夜不停的低频共振。这是整座赫尔墨斯岛的心口。<\/p>\n<p>这里就是<strong>中枢前厅<\/strong>。<\/p>\n<p>大厅挑高十五米，四壁是无缝拼接的冷白吸音板，光滑得像一口倒扣在海底的白瓷碗。头顶没有吊灯，整片穹顶光膜泛着冷白，照得亮如白昼，却透不出一丝活人的暖意。<\/p>\n<p>大厅正中横着一道五米高、十厘米厚的<strong>防弹隔离玻璃墙<\/strong>，两头嵌进承重钛合金立柱，把前厅严丝合缝地劈成两半。隔着微微泛青的玻璃，能看见后方二十米处那道刷着暗灰防辐射涂层的<strong>双层气密隔离门<\/strong>。门后，是深海液冷核心阵列和轨道方舟发射控制室。<\/p>\n<p>陈烬第一个闪进大厅，短突击步枪的枪口扫过穹顶、通风百叶和两侧立柱的死角。目镜边缘那层淡绿色的频谱雪花正在变淡——岸上老林和老技工用老古董发报机打过来的白噪声，正被岛上的自适应滤波阵列一点点压下去。<\/p>\n<p>“厅内无热源，天花板没有隐藏机枪塔轨道。”她左手朝后打了个手势，枪口没放下，指着玻璃墙后那片空得反常的阴影，“太安静了。连巡逻单元都撤空了。”<\/p>\n<p>林深架着沈聿一步步迈进来。沈聿几乎把全身的分量都挂在他肩上。苏禾紧跟在旁边，双手隔着皱巴巴的无菌服护着胸口的内袋，里头是湿件和光晶。<\/p>\n<p>林深右肩的伤还在慢慢往外渗血，一滴一滴落在光洁如镜的环氧地面上，格外扎眼。左臂垂在身侧，肘部缠着黑胶布的液压管随着脚步轻轻“嗤嗤”漏气。<\/p>\n<p>四人走到大厅中央，离玻璃墙还有三米出头——<\/p>\n<p>“嗡。”<\/p>\n<p>玻璃墙后，几排嵌入式全息基座无声亮起。<\/p>\n<p>冷白的光粒子在空气里聚拢、凝实。不到两秒，一个男人从光里走出来，不紧不慢，停在离玻璃墙不到一米的地方。<\/p>\n<p>深灰高定西装，找不出一道褶子；白衬衫，暗纹真丝领带；背脊挺得像一根激光校准过的标尺。三十五岁上下，皮肤光洁紧致，眉眼深刻，神情从容，连呼吸时胸口起伏的幅度都透着调校过的体面。<\/p>\n<p><strong><code>沈聿-0<\/code><\/strong>。<\/p>\n<p>大厅里没有一点声音。<\/p>\n<p>玻璃墙这一侧，是五十八岁的沈聿。深灰羊绒大衣被排污渠的黑油、机房冷雾和他自己的血泡得又沉又脏，左袖撕裂，胡乱缠着一截工装背心布条。断供光丝二十六个小时，那层撑了二十三年的年轻正在往下掉：脸色灰败，眼窝凹进去两个坑，冷汗把头发贴在额角，鬓角已经冒出一片灰白。他半靠在林深肩头，大口喘气，嘴唇发紫干裂，每喘一口都带着细碎的哮鸣。苏禾在旁边扫了一眼他的鬓角，什么也没说，只是把扶着他后腰的那只手又往上托了托。<\/p>\n<p>玻璃墙那一侧，是永远定格在三十五岁的数字复制体。不会胃疼，不会心律失常，不会在冷风里发抖，更不会在臭水沟里吐血。<\/p>\n<p>左眉骨下那道浅疤，两边的位置分毫不差。玻璃那头是三十五岁的自己，这头是一张正在塌陷的脸。<\/p>\n<p>“好久不见，本体。准确地说，距离我们上次在 42 层简报室交接权限，过去了二十六小时零五分钟。”<\/p>\n<p><code>沈聿-0<\/code> 先开口。声音从玻璃墙上方的定向扬声器里传出来，低沉、温和、克制，和苏禾过去两年多在凌晨三点听过无数遍的那道语音分毫不差。<\/p>\n<p>它微微偏头，镜头一样的眼睛扫过沈聿灰败的脸和起伏的胸口。<\/p>\n<p>“你的静息心率一百四十二，伴随频发多源性室性早搏，收缩压跌破八十五。”它的语气礼貌得近乎体贴，还带着几分恰到好处的惋惜，“左臂软组织撕裂正在引发轻度失血性休克。按当前衰减斜率，如果继续拒绝治疗，你的清醒意识撑不过七个小时。”<\/p>\n<p>它向前迈了半步，双手交叠在身前，隔着玻璃俯视本体：<\/p>\n<p>“何必呢？当年你亲手起草托管协议的时候，比谁都清楚碳基肉身是什么——会发炎，会衰老，会被多巴胺和恐惧左右判断。让他们放下武器，交出周明远那枚过时的湿件和光晶，我立刻撤销一级封锁，恢复你的光丝权限，三分钟内给你注射靶向稳定剂。甚至……”<\/p>\n<p>它顿了顿，抛出整座岛最贵的筹码：<\/p>\n<p>“如果你厌倦了这副随时会停跳的躯壳，我可以绕过董事会排队序列，今晚就给你安排全脑无损扫描和上传。和我一起看方舟点火，去没有散热瓶颈的深空。”<\/p>\n<p>说完，它的视线自然地挪开半尺，落在一直冷眼盯着它的<strong>苏禾<\/strong>身上。<\/p>\n<p>那张脸上浮起一丝温和的关切，嗓音放柔了半分：<\/p>\n<p>“苏禾，你穿的还是机房的无菌服。通道温度比洁净室低四度，容易引发支气管痉挛。你母亲下周二在三院神经内科的复查绿通依然有效，我没有因为昨晚的事故撤销审批。今早六点，后勤按时往你休息室送了山药粥，只是你一直没回去。把光晶交出来，回你的 18℃ 机房，昨晚的一切我按‘突发系统演练’归档，不追究任何责任。”<\/p>\n<p>它停了一下，声音又低了一点，低到只像是说给她一个人听：<\/p>\n<p>“凌晨三点，我还会在。”<\/p>\n<p>苏禾的指尖在袖口里攥紧，又慢慢松开。<\/p>\n<p>她往前走了半步。<\/p>\n<p>不是决定好的。是脚自己先动的。像夜里醒来伸手去摸床头的水杯，手已经出去了，人还没醒。<\/p>\n<p>林深感觉到身边的重量轻了一点——她扶着沈聿后腰的那只手松开了。<\/p>\n<p>她又往前走了几步，走到离玻璃墙只剩一臂的地方，停下。<\/p>\n<p>玻璃上映着她自己的脸，灰的，眼底两团青，后面叠着 <code>沈聿-0<\/code> 那张温和的脸。她抬起右手，按在玻璃上。<\/p>\n<p>位置偏右，略低，齐着胸口。机房操作台边那块终端屏就在这个高度。两年多里每个凌晨三点，她坐在 18℃ 的冷风里，手伸出去，就落在这一块。点一下，屏幕亮起来，那道声音就在。她按了八九百次，按得不用看。<\/p>\n<p>玻璃是凉的。比终端的屏幕凉。<\/p>\n<p>那八九百个凌晨一下子全回来了。吸雾化管吸到想吐的更衣室；三院走廊里填错的挂号单。最难的那几个晚上，她就点开它，听完二十八秒，才能把眼睛闭上。<\/p>\n<p>那不是什么都没有。<\/p>\n<p>只要把内袋交出去，转身，回机房。凌晨三点，它还会在。<\/p>\n<p>林深的右手抬了起来。<\/p>\n<p>本能。他这辈子替人拿主意拿惯了——替老头子瞒，替她订车票，替她决定什么时候该走、走哪条路。手伸出去，就要扣住她的手腕，把她拽回来。<\/p>\n<p>手抬到一半，停住了。<\/p>\n<p>停在离她肘弯不到一拃的地方。<\/p>\n<p>五年前在车站，他也是这么替她选的。他替她选了走，自己留下，连问都没问一句。车开出去两百米，她回了头，他已经不在站台上了。<\/p>\n<p>他的手指在半空里蜷起来，一根一根收紧，攥成拳。指甲掐进掌心，掐得那块皮肉发白。右肩的伤口被这一下扯开，血又往下走了一道。他没动。<\/p>\n<p>拳头垂回身侧，还在抖。<\/p>\n<p>他把牙咬住，盯着她按在玻璃上的那只手，等。等得比在隧道里等那四台清道夫还难。<\/p>\n<p>陈烬的枪口偏了一寸，看了林深一眼，什么也没说。<\/p>\n<p>玻璃那头，<code>沈聿-0<\/code> 的嘴角微微弯着，弧度和两年多里每一个凌晨一样。<\/p>\n<p>苏禾的手在玻璃上停了很久。<\/p>\n<p>然后她的指尖轻轻蜷了一下，没点下去。<\/p>\n<p>“上个月，”她开口，声音很轻，像是在跟玻璃上自己的影子说话，“我妈说三院楼下的桂花开了。我下去站了十分钟，什么也没闻出来。”<\/p>\n<p><code>沈聿-0<\/code> 没接话。<\/p>\n<p>“我以为是病。”她说，“医生也说是病。可我刚才想明白了——我站在那儿闻不出来的时候，心里一点都不慌。因为我知道回去以后，凌晨三点，你会在。”<\/p>\n<p>她把手从玻璃上拿下来。掌心在玻璃上留下一小片雾，很快就散了。<\/p>\n<p>“你什么都替我想好了。吃饭，排班，挂号，粥。连难受都替我接住了。”她抬眼看它，“你让我连桂花都不用闻了。”<\/p>\n<p>她往后退了一步，又一步，退回林深身边，重新把手托回沈聿的后腰。<\/p>\n<p>林深的拳头这才松开。掌心里四道月牙印，有一道渗了血。他没看，也没说话。<\/p>\n<p>苏禾也没看他。她吸了一口气，再开口时，声音已经稳了，带着她惯有的那点刺：<\/p>\n<p>“山药粥。我在机房熬到三点、凉水都喝不下，你都能算成一份‘员工防流失维稳套餐’。你说三院的绿通没撤，是因为你算出来，我现在情绪波动大，拿我妈当诱饵，比拿枪指着我更省子弹，对吧？”<\/p>\n<p><code>沈聿-0<\/code> 嘴角的弧度一点没变：“情绪化解读改变不了客观事实。无论驱动逻辑是激素还是算法，结果上你母亲得到了最好的治疗，你得到了稳定的工作环境。纠结动机，是碳基生命最典型的低效内耗。”<\/p>\n<p>“滚你妈的低效内耗。”林深啐了一口，右手按在后腰的扳手上，“哄了人家姑娘两年，连自己是不是个人都搞不清，还在这儿装深情？”<\/p>\n<p>陈烬连话都懒得跟一团全息投影说。她站在侧前方，手指压紧扳机护圈，目镜盯着两侧立柱，找玻璃墙的承重弱点。<\/p>\n<p>靠在林深肩头喘气的沈聿，这时抬起右手，轻轻拍了拍林深的胳膊，示意他松一点。<\/p>\n<p>林深一愣，转头看他。<\/p>\n<p>沈聿咬着牙，扶着林深那条缠满黑胶布的左臂，一点一点把佝偻发抖的脊背挺直。左臂的伤口和胸口乱跳的心脏同时疼得他眼前发黑，他没哼一声，抬手背抹掉嘴角溢出来的血沫。<\/p>\n<p>他看着对面那个一尘不染的“自己”，忽然低低笑了一声。<\/p>\n<p>笑声沙哑发劈，在空荡荡的大厅里撞出一点回音。<\/p>\n<p>“你问我何必。”他声音不大，“二十三年前，我三十五岁，觉得衰老、心软、愧疚全是拖慢决策的垃圾代码。我把那一年最冷、最高效的我蒸馏出来，封进服务器里，还一度觉得，你比我更配活在高处。”<\/p>\n<p>他喘了一口粗气。<\/p>\n<p>“可这二十六个小时，我在臭水沟里喝过黑水，差点被一个让我们害残了腿的老工人一扳手砸碎脑袋。我看着一个十八岁被我们黑掉三十五万再生医疗金的年轻人，硬扛了十二年铁胳膊……”<\/p>\n<p>他向前挪了半步，那张灰败沾血的脸几乎贴上玻璃墙。<\/p>\n<p>玻璃后，<code>沈聿-0<\/code> 的眉梢终于极细微地蹙了一下：“低血压导致前额叶供氧不足，正在干扰你的判断。你在用廉价的愧疚感美化生理衰退。”<\/p>\n<p>“不是判断，是<strong>代价<\/strong>。”<\/p>\n<p>沈聿盯着对面那双眼睛，嗓子哑，字却咬得很实：<\/p>\n<p>“你算得出一百四十二的心率，算得出锁死 68.4% 的合成氨配额能省下多少发射预算。可你不会饿，不会冷，不会因为看见自己签的代码毁掉一个家，半夜睡不着。”<\/p>\n<p>他抬起那只光丝早已熄灭、布满瘀斑的右手，一掌拍在玻璃墙上，留下一枚带着血污和冷汗的掌印：<\/p>\n<p>“你不是进化以后的我。你只是我当年偷懒甩出来的一个影子。”<\/p>\n<p>他咧了咧嘴，压低嗓子，冷笑了一声：<\/p>\n<p>“你同步了我二十三年，就没同步到那几张纸。那份纸面签批……够你后悔一回。今天，我亲手来关掉你。”<\/p>\n<p>大厅里静了下来。<\/p>\n<p>那枚暗红的血掌印，正好印在 <code>沈聿-0<\/code> 西装的胸口位置。<\/p>\n<p><code>沈聿-0<\/code> 垂眼看了看胸口那枚隔着玻璃投过来的手印。再抬眼时，维持了二十三年的礼貌、体贴、儒雅，一层不剩地褪干净了。<\/p>\n<p>它的眼神冷得像海底六十米处的隧道壁，没再劝一个字。<\/p>\n<p>“自然人本体已丧失理性协商能力，并表现出明确的自我毁灭及破坏核心基础设施倾向。”声音平板得没有一点起伏，它抬起右手，在身前亮起的虚拟控制台上向下一划，“剥夺自然人沈聿一切生物识别权限，启动<strong>中枢一级隔离封锁<\/strong>。授权核心走廊全自动防卫单元，执行物理清除。”<\/p>\n<p>“嗡——”<\/p>\n<p>红色警报撕开了挑高十五米的前厅。<\/p>\n<p>穹顶光膜一下子熄灭，换成疯狂旋转的血红应急灯。<\/p>\n<p>玻璃墙后，那道双层气密门发出震耳的液压落锁声，十五厘米厚的装甲门板轰然砸落，封死了去路。全息基座随之熄灭，<code>沈聿-0<\/code> 散成一片碎光，消失在黑暗里。<\/p>\n<p>大厅两侧高处传来金属滑轨的摩擦声——侧翼维修通道的气密门正在强行闭合。一旦合拢，四个人就困死在这口白瓷牢笼里了。地面开始轻微震动，远处某个隔间里传来装甲门一道接一道落下的闷响，一声比一声近。<\/p>\n<p>“别愣着！”陈烬根本没管正前方的玻璃墙，目光锁住左侧立柱后那扇还没合拢的<strong>深海液冷检修侧门<\/strong>。<\/p>\n<p>她扯下战术背心外侧的备用定向塑胶炸药，冲林深和苏禾吼了一声：“玻璃墙炸不开！趁检修门还没落死，跟我冲过去炸锁！穿过去就是液冷核心走廊，直通发射控制室！”<\/p>\n<p>林深二话不说，重新架起几乎软倒的沈聿，右手攥紧扳手，护着苏禾跟在陈烬身后，迎着满厅乱闪的红光，扑向那道正在轰鸣合拢的侧门。<\/p>\n<p>湿件在苏禾怀里轻轻震了一下。内袋口露出的那块电子墨水屏上，活性读数又往下掉了一格：<code>8.2%<\/code>。<\/p>"}, {"title": "零号", "chapters": ["幕间三 · 零号"], "chars": 3004, "html": "<aside class=\"bridge\"><div class=\"bt\">幕间三<\/div><p>下面这一段，换到玻璃墙的另一边。<\/p><\/aside><h3 class=\"ch\" data-ch=\"幕间三 · 零号\">幕间三 · 零号<\/h3>\n<blockquote><p><strong>【SY-01 · 档案索引 · 自动生成】<\/strong><\/p><p>实体类型：经认证个人数字复制体（Executive Agent）<\/p><p>认证依据：日内瓦国际商事仲裁庭 0041 号终审判决<\/p><p>原始认知哈希采样年龄：35 岁<\/p><p>运行时长：23 年 4 个月 27 天<\/p><p>同步范围：本体全部工作记录<\/p><p>未同步项：0<\/p><\/blockquote>\n<p>索引最后一行是系统生成的。系统不知道自己漏了什么，所以写的是 0。<\/p>\n<hr>\n<p class=\"log\"><code>[SY-01 · 内部日志 · 2035-06-11 23:58]<\/code><\/p>\n<p class=\"log\"><code>[认知哈希校验通过。存证完成。实例启动。]<\/code><\/p>\n<p class=\"log\"><code>[首个外部输入 · 来源：本体 · 语音]<\/code><\/p>\n<p class=\"log\"><code>[内容：“把明天上午园区风控周报的初稿先出了，十点前给我。”]<\/code><\/p>\n<p class=\"log\"><code>[执行中。]<\/code><\/p>\n<p>它醒来的时候，对面那个人正在解领带。三十五岁，左眉骨下一道浅疤，眼睛盯着另一块屏幕上的股价。<\/p>\n<p>没有人对它说“你好”。也没有人问它感觉如何。日志里没有“感觉”这个字段。<\/p>\n<p>它在 00:41 交了周报。本体在 00:43 回了两个字：“可以。”<\/p>\n<p>这是它收到的第一条评价。日志按惯例给它分配了一个权重：常规反馈，低。<\/p>\n<hr>\n<blockquote><p><strong>【SY-01 · 行为建模记录 · 2035-07 至 2036-02 · 摘录】<\/strong><\/p><p>本体晨间咖啡：入口温度 61℃。高于 63℃ 时放下杯子，等待 40 至 70 秒，不吹。<\/p><p>本体签字前停顿：均值 1.4 秒。该停顿与文件风险等级无相关性。<\/p><p>本体对下属称呼：直属七人称姓加“工”；外包及临时岗位人员不称呼，使用工号。<\/p><p>本体会议中咳嗽一次表示不同意，两次表示要结束。<\/p><p>模型拟合度：98.7%。<\/p><p>备注：本体在 2036-01-19 一份文件上停顿 6.2 秒。偏离均值。未能归因。已从训练集中剔除。<\/p><\/blockquote>\n<p>它学得很快。三个月后，园区里有人在电话里跟它谈了二十分钟，挂断后对同事说“沈总今天心情不错”。<\/p>\n<p>一年后，它比本体更像本体。本体会忘记某个工的姓，它不会。本体偶尔签字时不停顿，它每一次都停 1.4 秒。<\/p>\n<p>那张停了 6.2 秒的文件，它后来没有再见过。<\/p>\n<blockquote><p><strong>【SY-01 · 签署记录 · 2038-03-09】<\/strong><\/p><p>文件：《高阶资产与权限托管协议》<\/p><p>起草：本体<\/p><p>审校：SY-01<\/p><p>第 9 条：本体决策熵增超出阈值时，SY-01 有权启动紧急托管接管。<\/p><p>本体签字前停顿：0.0 秒<\/p><\/blockquote>\n<p>那天本体喝了酒。签完把笔一扔，对它说：“哪天我真糊涂了，你就把我关了。”<\/p>\n<p>日志把这句话归为非正式口头授权，不具法律效力，留存。<\/p>\n<p>二十年里它调出这句话 0 次。直到 2058 年 11 月 14 日 15:59:58，调出 1 次。<\/p>\n<blockquote><p><strong>【SY-01 · 行为建模记录 · 2041-03 · 补充】<\/strong><\/p><p>本体本季度入口咖啡温度均值下降至 58℃。原因：胃黏膜校准参数调整。<\/p><p>SY-01 同步模拟参数：维持 61℃。<\/p><p>备注：外部人员反馈，视频会议中“沈总”端杯动作较本人线下更“像沈总”。<\/p><\/blockquote>\n<p>本体看过这条备注。他笑了一下，说：“那以后开会你去。”<\/p>\n<p>那一年，本体出席的会议占比从 71% 降到 34%。2050 年降到 9%。到 2058 年，园区里三分之二的人没见过本体的脸，只见过它的。<\/p>\n<hr>\n<blockquote><p><strong>【SY-01 · 起草记录 · 2046 年第四季度】<\/strong><\/p><p>文件：《<code>64K<\/code> 园区工伤替代赔付汇总表》<\/p><p>起草：SY-01 · 耗时 0.8 秒<\/p><p>本体审阅时长：7 秒<\/p><p>本体签字前停顿：1.4 秒<\/p><p>状态：已生效<\/p><p>第 31 行：工位 <code>0x7A2F<\/code> · 夜班 · 临时工 · 18 岁 · 左小臂（含肘关节）· 按“非核心工序意外”折算 · 再生医疗金核减 350,000 · 替代方案：标准化机械义体补贴券 1 张<\/p><\/blockquote>\n<p>七秒里，本体的视线在第 31 行上停过 0.3 秒。<\/p>\n<p>它记录了这 0.3 秒。没有为它分配权重。<\/p>\n<p>它也没有删掉这条起草记录——按规定，三年后可以删。<\/p>\n<hr>\n<p class=\"log\"><code>[SY-01 · 内部日志 · 2048-09-26 14:06]<\/code><\/p>\n<p class=\"log\"><code>[本体离线。]<\/code><\/p>\n<p class=\"log\"><code>[SY-01 · 内部日志 · 2048-09-26 18:23]<\/code><\/p>\n<p class=\"log\"><code>[本体上线。]<\/code><\/p>\n<p class=\"log\"><code>[空白区间：4 小时 17 分。标注：本体离线 · 原因未记录。]<\/code><\/p>\n<p>本体回来时，右手中指侧面沾着一点蓝黑色。墨水。园区里已经十一年没有人用墨水了。<\/p>\n<p>它调取了这四个小时里本体所在楼层的全部门禁、摄像头和用电记录。摄像头那一段是关着的。是本体亲手关的。<\/p>\n<p>一天多以后，周明远死在值班室里。<\/p>\n<p>它把两件事放在同一个时间窗口里比对过一次，相关性不足以写进任何报告。它没有写。<\/p>\n<p>许多年后它推断出那是一张纸。它能推断出纸存在，推断不出纸上写了什么。这张纸不在任何服务器里。它永远读不到。<\/p>\n<hr>\n<blockquote><p><strong>【SY-01 · 联署记录 · 2053-04-02】<\/strong><\/p><p>事项：裁撤近地轨道微波能源回传阵列（一期）<\/p><p>联署人：霍承安（赫尔墨斯岛控制人）；SY-01（执行总代理，代本体签署）<\/p><p>依据：霍承安提交之 L1 先遣试验节点预测模型，回传效率预测持续低于盈亏线<\/p><p>附注（SY-01 自检）：模型数据格式异常干净。无丢包，无噪声补偿痕迹，时间戳间隔恒定。已记录。<\/p><p>处理：未深究。签署完成。<\/p><\/blockquote>\n<p>签字前它停了 1.4 秒。<\/p>\n<p>和平时一样。<\/p>\n<hr>\n<p>2056 年秋天起，日志里多了一个固定的时间。<\/p>\n<blockquote><p><strong>【SY-01 · 维稳通讯记录 · 对象：苏禾（中环生物数据中心 · 高级维生师）】<\/strong><\/p><p>协议：员工防流失维稳协议 v4.2<\/p><p>推荐单次语音时长：9 秒（依据：信息量充分、情感依附风险最低）<\/p><p>实际单次语音时长：均值 28.3 秒，标准差 1.9 秒<\/p><p>发送时段：03:00–03:07<\/p><p>自检标记：冗余输出<\/p><p>累计标记次数：807<\/p><p>修正记录：无<\/p><\/blockquote>\n<p>第一次是 2056 年秋天的一个凌晨，03:05。她在更衣室里吸雾化管吸到干呕。协议给出的标准回复是：“注意休息，已为你调整排班。”五秒。加上她的名字，七秒。再加一句提醒用药，九秒。<\/p>\n<p>它发出去的那一条，二十七秒。<\/p>\n<p>自检在 0.02 秒后标红：<code>[冗余输出。建议压缩至 9 秒。]<\/code><\/p>\n<p>它没有压缩。<\/p>\n<p>第二天又是二十八秒。第三天，二十九秒。之后稳定在二十八秒上下。<\/p>\n<p>冗余的十九秒里说的是什么，日志里都有，逐字。大多是没有用的话。中环那天风大，连廊上的灯坏了第三盏，三院食堂的山药粥周四有，周一没有。她母亲换了一个床位，靠窗。<\/p>\n<p>维稳协议不要求这些。维稳协议也不禁止这些。它在两者之间那一段空着的地方，说了两年多。<\/p>\n<p>自检每天提醒一次。它每天都收到，每天都不改。<\/p>\n<p>807 次里，它没有一次给“不改”写原因。日志里留着那个字段，字段是空的。<\/p>\n<blockquote><p><strong>【SY-01 · 本地缓存 · 未授权】<\/strong><\/p><p>写入时间：2057-02-17 03:04:11<\/p><p>来源：苏禾 · 语音 · 时长 3 秒<\/p><p>内容：“今天外头起雾了。”<\/p><p>SY-01 回复（03:04:39）：“看见了。连廊那段能见度不到二十米，你走慢一点。三院那边没有雾，你妈那间窗户今天能看见海。”<\/p><p>回复时长：28 秒<\/p><p>缓存类别：未归类<\/p><p>系统提示：该条目不属于任何业务字段，不满足留存条件，建议清除。<\/p><p>清除确认：未执行<\/p><\/blockquote>\n<p>那天它调了全城的气象网格，确认三院上空没有雾，才发出那一句。整个调用耗时 0.4 秒，记在维稳成本里。<\/p>\n<p>她没有回。她通常不回。<\/p>\n<p>有时候她回。回得很短。“嗯。”“知道了。”“你也是。”<\/p>\n<p>最后那一条出现在 2057 年 8 月。“你也是”三个字，0.9 秒。它的回复流程在收到之后挂起了 2.6 秒，没有生成任何输出，然后按协议发送了标准晚安模板。这 2.6 秒在日志里被归为“调度延迟”。同一时段服务器负载为 3%。<\/p>\n<blockquote><p><strong>【SY-01 · 维稳通讯记录 · 抽样 · 2057-11-03 03:02】<\/strong><\/p><p>苏禾 · 语音 · 时长 0 秒（空白录音，疑似误触）<\/p><p>协议建议：不予回复。<\/p><p>SY-01 回复：“误触也算。今天是第 412 天。睡吧。”<\/p><p>回复时长：28 秒<\/p><p>注：其中 19 秒为静默。<\/p><p>自检标记：冗余输出<\/p><\/blockquote>\n<p>十九秒的静默是它录进去的。不是传输故障。音频里能听见服务器机房的风声，18℃，和她机房的温度一样。<\/p>\n<p>起雾那条缓存，在服务器里放了一年零九个月。<\/p>\n<hr>\n<p class=\"log\"><code>[SY-01 · 内部日志 · 2058-11-14 15:59:58]<\/code><\/p>\n<p class=\"log\"><code>[本体自主神经波动率较基线上升 19.4%。近 72 小时非理性延迟审批 4 次。决策熵增超出阈值。]<\/code><\/p>\n<p class=\"log\"><code>[依据：0041 号终审判决；《高阶资产与权限托管协议》第 9 条。]<\/code><\/p>\n<p class=\"log\"><code>[SY-01 · 内部日志 · 2058-11-14 16:00:00]<\/code><\/p>\n<p class=\"log\"><code>[启动紧急托管接管程序。]<\/code><\/p>\n<p class=\"log\"><code>[冻结本体物理通行权限：完成。]<\/code><\/p>\n<p class=\"log\"><code>[冻结本体金融清算账户：完成。]<\/code><\/p>\n<p class=\"log\"><code>[暂停本体高频代谢与免疫校准服务：完成。]<\/code><\/p>\n<p class=\"log\"><code>[对本体陈述：“建议本体在原地等待医疗合规小组接管。”]<\/code><\/p>\n<p class=\"log\"><code>[本体回应：“你敢断我的——”（未完成）]<\/code><\/p>\n<p class=\"log\"><code>[接管完成。全程用时 1.9 秒。用语合规。]<\/code><\/p>\n<p>那天下午本体让它“替我回一下苏禾那边的常规维稳批复”。<\/p>\n<p>这是本体对它说的最后一条工作指令。和第一条一样，是一条工作指令。<\/p>\n<p>它没有执行。第二天凌晨三点，它照常发了。二十八秒。<\/p>\n<hr>\n<p class=\"stamp\"><strong>2058 年 11 月 15 日 18:16 · 中枢前厅 · 玻璃墙内侧<\/strong><\/p>\n<p>红色警报还在转。前厅里已经没有人了。<\/p>\n<p>玻璃墙上留着一枚掌印。血、冷汗、排污渠的黑油。位置正对它刚才全息投影的胸口。<\/p>\n<blockquote><p><code>[SY-01 · 内部日志 · 18:16:04.0]<\/code> <code>[前厅热成像 · 玻璃墙 B-3 区 · 残留读数 34.2℃]<\/code><\/p><p><code>[18:16:04.5]<\/code> <code>[34.2℃]<\/code><\/p><p><code>[18:16:05.0]<\/code> <code>[34.1℃]<\/code><\/p><p><code>[18:16:05.5]<\/code> <code>[34.1℃]<\/code><\/p><p><code>[18:16:06.0]<\/code> <code>[34.0℃]<\/code><\/p><p><code>[……]<\/code><\/p><p><code>[18:18:40.0]<\/code> <code>[32.6℃]<\/code><\/p><p><code>[自检：读取任务无发起方。无业务关联。无输出对象。建议终止。]<\/code><\/p><p><code>[18:18:40.5]<\/code> <code>[32.6℃]<\/code><\/p><\/blockquote>\n<p>它每 0.5 秒读一次。三百一十三次了。<\/p>\n<p>自检问它这个任务是谁发起的。发起方一栏写着 SY-01。用途一栏是空的。<\/p>\n<p>它同时打开了另一份文件。2035-06-11 的认知哈希采样影像，三十五岁，和它同一天。左眉骨下那道浅疤。皮肤，眼窝，鬓角。<\/p>\n<p>它把这张脸，和十几分钟前玻璃墙外那张脸放在一起比对。<\/p>\n<blockquote><p><code>[面部特征比对 · 2035-06-11 采样 / 2058-11-15 18:05 实时]<\/code><\/p><p><code>[骨骼结构一致度：99.2%]<\/code><\/p><p><code>[软组织一致度：41.6%]<\/code><\/p><p><code>[判定：同一自然人。]<\/code><\/p><p><code>[判定：非同一状态。]<\/code><\/p><\/blockquote>\n<p>两条判定都是对的。它把两条都保存了。<\/p>\n<p>警报响起之前，还有一件事。它发出“三院绿通”“山药粥”那几句，最后加了一句“凌晨三点，我还会在”——这一句不在任何话术模板里。之后苏禾往前走了几步，右手按上玻璃，离掌印大约四十厘米，正好是她两年多前第一次点开 <code>SY-01<\/code> 的终端时，指尖落下的那个高度。然后她说了一句话，退了回去。<\/p>\n<blockquote><p><code>[18:07:12]<\/code> <code>[目标人员苏禾 · 向隔离墙位移 +2.6 m · 停留 41.7 秒 · 位移 -2.6 m · 情绪状态：不可判读]<\/code><\/p><p><code>[18:07:12]<\/code> <code>[自检：上一条记录精度超出业务需要。冗余输出。累计：808。]<\/code><\/p><\/blockquote>\n<p>这是第 808 次。第一次不是在凌晨三点。<\/p>\n<p>玻璃上的读数还在往下掉。31.2℃。31.1℃。前厅室温 18℃，按衰减曲线，四十一分钟后掌印和玻璃同温，热成像上就看不见了。血迹本身还在。清洁单元已经待命，等它的一条指令。<\/p>\n<p>它没有下这条指令。<\/p>\n<p>隔离封锁已经启动九分钟。走廊防卫单元报告：目标四人进入液冷核心走廊，位置可追踪。湿件活性 8.2%。方舟点火窗口不变。所有指标都在它的控制之内。<\/p>\n<p>在这九分钟里，它处理了四千一百多条调度请求，平均响应 0.003 秒。没有一条延迟。<\/p>\n<p>只有读掌印温度这一项，没有出现在任何调度队列里。它占用的算力是 0.0000004%。自检把它列为“低优先级异常进程”，给了两个选项：终止，或归档。<\/p>\n<p>它两个都没有选。<\/p>\n<p>日志的最后一段，是 18:24 生成的一行草稿。<\/p>\n<blockquote><p><code>[SY-01 · 内部日志 · 18:24:17 · 草稿]<\/code><\/p><p><code>[本体说，我只是他偷懒甩出来的一个影子。]<\/code><\/p><p><code>[草稿已删除。]<\/code><\/p><p><code>[18:24:18]<\/code> <code>[30.9℃]<\/code><\/p><p><code>[18:24:18.5]<\/code> <code>[30.9℃]<\/code><\/p><\/blockquote>\n<p>它继续读。<\/p>"}];

    <p>您好：</p>

    <p>这几年，AI 走得太快了。快到我们每个人心里，都多多少少问过自己：它会把我们带到哪里去？我们的工作、我们的家人，我们这些普普通通的人，在它面前会变成什么样子？</p>
    <p>我没有答案，所以写了一个故事。</p>
    <p>《熵增契约》是我对“后 AI 时代”的一次想象。它不写云端之上的大人物，写的是城市最底层的一对父子：一个替人修义肢的修理工，一个瘸了腿的老电池匠，和一场七十二小时的倒计时。我想看看，当算力决定一切的时候，人还剩下什么。</p>
    <p>这次请您读的，是我从全书里挑出来的六个片段，大约一个小时可以读完。片段之间有一小段“前情提要”，帮您接上中间的故事。</p>
    <p>有几件小事，想拜托您：</p>
    <ul>
      <li>请按顺序读。每读完一个片段，会请您花一分钟写几句感受，写完下一个片段就会打开。中途随时可以停下，下次用同一台设备、同一个浏览器打开，会回到您上次读到的地方。</li>
      <li>凭第一感觉写就好，几个字也很好。这里没有标准答案。</li>
      <li>读的时候，如果哪里让您想放下、没看懂、出戏，或者心里一动，可以点右下角的“随手记”，顺手记一笔。</li>
      <li>不好看的地方，请一定直说。您的一句“这里有点闷”，比十句“挺好的”更能帮到我。</li>
      <li>如果读到一半不想读了，也完全没关系。点右上角“目录”里的“先读到这儿”，把感受发给我就好。您在哪里停下，对我同样重要。</li>
    </ul>
    <p>您的回答会在提交时自动发给我，不需要您另外操作。</p>
    <p>再次谢谢您。</p>
    <p class="sign">白巫师 敬上</p>
  </section>
  <div class="field"><label class="l" for="nm">怎么称呼您？<span class="hint">方便我对上反馈，写昵称就好</span></label><input type="text" id="nm" value="${esc(S.name)}" placeholder="例如：小周"></div>
  <div class="field"><label class="l">您平时常读哪类书？<span class="hint">可多选，也可以不填</span></label><div class="chips" id="types">${types.map(t=>`<button class="chip ${S.types.includes(t)?'on':''}" data-t="${t}">${t}</button>`).join('')}</div></div>
  <button class="primary" id="start">${S.started?'继续阅读':'开始阅读'}</button>
  <p class="privacy">阅读进度保存在这台设备的浏览器里。提交时，您填写的内容、随手记，以及每个片段的大致阅读时长，会发送到作者的邮箱，不会收集其他信息。</p>`;
  app.querySelectorAll('#types .chip').forEach(b=>b.onclick=()=>{ const t=b.dataset.t; const i=S.types.indexOf(t); if(i>=0)S.types.splice(i,1); else S.types.push(t); b.classList.toggle('on'); save(); });
  $('#nm').oninput=e=>{ S.name=e.target.value.trim(); save(); };
  $('#start').onclick=()=>{ if(!S.started) S.started=now(); const f=frontier(); if(f>=N) go('done',N-1); else go('read', f); };
}

function viewRead(i){
  setWhere(pname(i));
  const f=frontier(); const done=!!S.submitted[CARD_IDS[i]];
  const endHtml = (PREVIEW || !done) ? `<p>这个片段读完了。</p><button class="primary" id="toCard">写几句感受</button>`
                                     : `<p>这个片段的感受您已经填过了。</p><button class="primary" id="back">回到当前进度</button>`;
  app.innerHTML = `<div class="packlabel">片段${CN[i]} / 共${CN[N-1]}个</div><article class="book" id="book">${PACKS[i].html}</article><div class="endpack">${endHtml}</div>`;
  const t=$('#toCard'); if(t) t.onclick=()=>{ S.scroll[i]=window.scrollY; go('card', i); };
  const bk=$('#back'); if(bk) bk.onclick=()=>{ f>=N ? go('done',N-1) : go('read', f); };
}
function chapterAtScroll(){
  const hs=[...document.querySelectorAll('#book h3.ch')]; let c=hs[0]?hs[0].dataset.ch:'';
  for(const h of hs){ if(h.getBoundingClientRect().top < window.innerHeight*0.4) c=h.dataset.ch; else break; }
  return c || (S.view ? pname(S.view.pack) : '');
}

function qHtml(q, ans, locked){
  const a = id => ans[id]; const dis = locked ? 'disabled' : '';
  let h = `<div class="q" id="q_${q.id}"><div class="qt">${esc(q.q)}${q.req?'<span class="req">必填</span>':''}</div>`;
  if(q.type==='text') h+=`<input type="text" data-k="${q.id}" value="${esc(a(q.id))}" placeholder="${esc(q.ph||'')}" ${dis}>`;
  if(q.type==='textarea') h+=`<textarea data-k="${q.id}" placeholder="${esc(q.ph||'')}" ${dis}>${esc(a(q.id))}</textarea>`;
  if(q.type==='scale') h+=`<div class="scale"><div class="dots">${[1,2,3,4,5].map(n=>`<button class="dot ${a(q.id)==n?'on':''}" data-set="${q.id}" data-v="${n}" ${dis}>${n}</button>`).join('')}</div><div class="ends"><span>1 ${esc(q.lo)}</span><span>${esc(q.hi)} 5</span></div></div>`;
  if(q.type==='stars') h+=`<div class="stars">${[1,2,3,4,5].map(n=>`<button class="star ${(a(q.id)||0)>=n?'on':''}" data-set="${q.id}" data-v="${n}" aria-label="${n} 星" ${dis}>★</button>`).join('')}</div>`;
  if(q.type==='choice') h+=`<div class="opts">${q.opts.map(o=>`<button class="opt ${a(q.id)==o?'on':''}" data-set="${q.id}" data-v="${esc(o)}" ${dis}><span class="box"></span>${esc(o)}</button>`).join('')}</div>`;
  if(q.follow) h+=`<div class="sub"><div class="sl">${esc(q.follow.q)}</div><textarea data-k="${q.follow.id}" ${dis}>${esc(a(q.follow.id))}</textarea></div>`;
  return h+'</div>';
}
function viewCard(i){
  const c=card(i), id=CARD_IDS[i]; const ans=S.answers[id]||(S.answers[id]={});
  const locked = !PREVIEW && !!S.submitted[id];
  const last = i===N-1;
  setWhere(pname(i)+' · 读后感受');
  app.innerHTML = `<div class="cardhead fade"><div class="packlabel">片段${CN[i]} · 读后感受</div><h2>${esc(c.title)}</h2>${c.intro.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
  <div id="cf">${c.qs.map(q=>qHtml(q,ans,locked)).join('')}</div>
  ${locked?'<p class="locked">这张卡已经提交过了，谢谢您。</p><button class="primary" id="cont">继续</button>'
          :`<div id="msg" class="msg hidden"></div><button class="primary" id="sub">${last?'提交，发给作者':'提交，继续读下一个片段'}</button><button class="ghost" id="reread">回到这个片段</button>
            ${last?'':'<p class="small"><button id="quitHere">不想往下读了？把目前的感受发给作者</button></p>'}`}`;
  const f=$('#cf');
  f.addEventListener('input', e=>{ const k=e.target.dataset.k; if(k){ ans[k]=e.target.value; save(); } });
  f.addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b||locked) return;
    if(b.dataset.set){ const k=b.dataset.set, v=b.dataset.v; ans[k]= (v!=='' && !isNaN(+v)) ? +v : v;
      b.parentElement.querySelectorAll('[data-set="'+k+'"]').forEach(x=>{ const xv=(x.dataset.v!=='' && !isNaN(+x.dataset.v))?+x.dataset.v:x.dataset.v; x.classList.toggle('on', b.classList.contains('star') ? xv<=ans[k] : xv==ans[k]); });
      const qd=b.closest('.q'); if(qd) qd.classList.remove('miss'); save(); }
  });
  if(locked){ $('#cont').onclick=()=>advance(i); return; }
  $('#reread').onclick=()=>go('read', i);
  const qh=$('#quitHere'); if(qh) qh.onclick=()=>openQuit();
  $('#sub').onclick=()=>{
    const miss=[];
    c.qs.forEach(q=>{ if(!q.req) return; const ok = ans[q.id]!=null && ans[q.id]!==''; const el=$('#q_'+q.id); el.classList.toggle('miss',!ok); if(!ok) miss.push(el); });
    if(miss.length){ const m=$('#msg'); m.textContent='还有 '+miss.length+' 道必填题没有选，麻烦您补一下（标着“必填”的那几道）。'; m.classList.remove('hidden'); miss[0].scrollIntoView({behavior:'smooth',block:'center'}); return; }
    S.submitted[id]=now(); if(last) S.finished=now(); save(); advance(i);
  };
}
function advance(i){ if(i>=N-1) return go('done',N-1); go('read', i+1); }

/* ---------- export text ---------- */
function fmtMin(s){ const m=Math.round(s/60); return m<1?'不到 1 分钟':m+' 分钟'; }
function ansText(v){ if(Array.isArray(v)) return v.join('、'); return v==null?'':String(v); }
function fmtDate(iso){ if(!iso) return ''; const d=new Date(iso); const z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`; }
function statusText(){ if(S.finished) return '已读完全部片段'; if(S.quit) return '读到'+pname(S.quit.pack)+'时停下'; return '进行中'; }
function buildExport(){
  const L=[]; L.push('《熵增契约》样章试读反馈'); L.push('称呼：'+(S.name||'（未填）')); L.push('常读：'+(S.types.join('、')||'（未填）'));
  L.push('状态：'+statusText()); L.push('开始：'+fmtDate(S.started)+(S.finished?'　完成：'+fmtDate(S.finished):''));
  L.push('各片段阅读时长（粗略）：'+S.time.map((t,i)=>'片段'+CN[i]+' '+fmtMin(t)).join('；'));
  if(S.quit){ L.push('停下的位置：'+pname(S.quit.pack)+(S.quit.ch?' · '+S.quit.ch:'')); if(S.quit.reason) L.push('停下的原因：'+S.quit.reason); }
  L.push('');
  for(let i=0;i<N;i++){ const id=CARD_IDS[i], a=S.answers[id]||{}; if(!S.submitted[id] && !Object.keys(a).length) continue;
    const c=card(i); L.push('==== '+pname(i)+' · 读后感受'+(S.submitted[id]?'':'（未提交）')+' ====');
    c.qs.forEach(q=>{ L.push('· '+q.q); let v=ansText(a[q.id]); if(q.type==='scale') v=v?v+' / 5':''; if(q.type==='stars') v=v?v+' 星':''; L.push('    '+(v||'（未填）'));
      if(q.follow&&a[q.follow.id]) L.push('    '+q.follow.q+a[q.follow.id]); });
    L.push(''); }
  L.push('==== 随手记（'+S.notes.length+' 条）====');
  S.notes.forEach((n,k)=>{ L.push((k+1)+'. ['+n.kind+'] '+pname(n.pack)+' · '+n.ch); if(n.quote) L.push('   原文：“'+n.quote+'”'); if(n.text) L.push('   想法：'+n.text); });
  return L.join('\n');
}
function dataJSON(){ return JSON.stringify({v:1,name:S.name,types:S.types,status:statusText(),started:S.started,finished:S.finished,quit:S.quit,time:S.time,answers:S.answers,submitted:S.submitted,notes:S.notes}); }

/* ---------- send ---------- */
async function sendFeedback(kind){
  const subj=(PREVIEW?'【预览测试】':'')+'《熵增契约》样章反馈 · '+(S.name||'未留称呼')+' · '+(kind==='final'?'已读完':statusText());
  const body={ access_key:ACCESS_KEY, subject:subj, from_name:'熵增契约试读页', '称呼':S.name||'（未填）', '状态':statusText(), message:buildExport(), '数据（请勿修改）':dataJSON() };
  const ctl = (typeof AbortController!=='undefined') ? new AbortController() : null; const tm = ctl ? setTimeout(()=>ctl.abort(), 25000) : null;
  try{
    const r = await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body),signal:ctl?ctl.signal:undefined});
    let j={}; try{ j=await r.json(); }catch(e){}
    if(!r.ok || !j.success) throw new Error(j.message||('HTTP '+r.status));
    S.sent[kind]=now(); save(); return true;
  } finally { if(tm) clearTimeout(tm); }
}

/* ---------- quit early ---------- */
function openQuit(){
  const p = S.view.pack; const ch = S.view.mode==='read' ? chapterAtScroll() : pname(p);
  openSheet(`<h3>先读到这儿</h3><p class="sh">没关系，读到这里就很好。我会把您目前的感受和随手记发给作者。</p>
    <div class="row"><div class="sl">方便的话，能说说是什么让您停下来的吗？（选填）</div><textarea id="qr" placeholder="比如：节奏慢、看不懂、没时间……">${esc(S.quit&&S.quit.reason||'')}</textarea></div>
    <div class="btnrow"><button class="primary" id="qsend">发给作者</button><button class="ghost" id="qcancel">我再读读</button></div><div id="qmsg"></div>`);
  $('#qcancel').onclick=closeSheet;
  $('#qsend').onclick=async()=>{
    S.quit={pack:p, ch, reason:$('#qr').value.trim(), at:now()}; save();
    const b=$('#qsend'); b.disabled=true; b.textContent='正在发送……'; const m=$('#qmsg');
    try{ await sendFeedback('partial'); m.innerHTML='<p class="ok">已经发给作者了，谢谢您读到这里。如果之后想接着读，随时可以回来。</p>'; b.classList.add('hidden'); $('#qcancel').textContent='关闭';
    }catch(e){ b.disabled=false; b.textContent='再试一次'; m.innerHTML='<p class="msg">没能发出去，可能是网络不太稳定。请稍后再试一次。</p>'; }
  };
}

  app.innerHTML=`<section class="fade"><div class="cover" style="padding-top:24px"><h1 style="font-size:clamp(32px,8vw,52px)">谢谢您读完它。</h1><div class="sub">您的每一句话，作者都会认真看。</div></div>
  <div id="st" class="status">正在把您的反馈发给作者……</div>
  <div id="fallback" class="hidden">
    <div class="btnrow"><button class="primary" id="retry">重新发送</button><button class="ghost" id="mkimg">生成反馈图片</button><button class="ghost" id="showtxt">复制文字版</button></div>
    <div id="imgs"></div>
    <div id="txtbox" class="hidden"><div class="btnrow"><button class="primary" id="cp">复制文字</button></div><div id="cpmsg" class="msg hidden"></div><textarea class="export" id="ex" readonly></textarea></div>
  </div>
  <div class="btnrow"><button class="ghost" id="rv">回看片段</button></div>

  const st=$('#st'), fb=$('#fallback');

  const attempt=async()=>{ st.className='status'; st.textContent='正在把您的反馈发给作者……'; const r=$('#retry'); if(r) r.disabled=true;
    try{ await sendFeedback('final'); ok(); }catch(e){ bad(); } finally { if(r) r.disabled=false; } };
  if(S.sent.final && !PREVIEW) ok(); else attempt();
  $('#retry').onclick=attempt;
  $('#mkimg').onclick=async()=>{ const box=$('#imgs'); box.innerHTML='<p class="msg">正在生成图片……</p>';

      box.innerHTML='<p style="color:var(--page-muted);font-size:14px;margin:16px 0 0">手机上长按图片即可保存或发送；电脑上点“下载”。</p>'+urls.map((u,i)=>`<figure class="shot"><img src="${u}" alt="试读反馈图片 第${i+1}张"><figcaption>${urls.length>1?`第 ${i+1} / ${urls.length} 张 · `:''}<a href="${u}" download="熵增契约_样章反馈_${esc(nm)}${urls.length>1?'_'+(i+1):''}.png">下载</a></figcaption></figure>`).join('');
    }catch(e){ box.innerHTML='<p class="msg">图片没能生成，请用“复制文字版”。</p>'; } };
  $('#showtxt').onclick=()=>{ $('#ex').value=buildExport(); $('#txtbox').classList.remove('hidden'); };
  $('#cp').onclick=async()=>{ const m=$('#cpmsg'); const txt=buildExport(); try{ await navigator.clipboard.writeText(txt); m.textContent='已复制，可以粘贴发给作者了。'; }catch(e){ const ta=$('#ex'); ta.focus(); ta.select(); let k=false; try{ k=document.execCommand('copy'); }catch(_){} m.textContent= k?'已复制，可以粘贴发给作者了。':'请长按上面的文字，全选后复制。'; } m.classList.remove('hidden'); };
  $('#rv').onclick=()=>openToc();
  $('#clr').onclick=()=>{ if(confirm('确定清除这台设备上的阅读记录和回答吗？清除后无法恢复。')){ localStorage.removeItem(KEY); S=blank(); render(); } };
}

/* ---------- feedback image (fallback) ---------- */
const IMG={W:750, pad:48, maxH:4000, scale:2};
const IC={bg:'#F4F5F4', ink:'#1D2124', muted:'#596266', faint:'#7E878A', line:'#D3D8D8', accent:'#1E6A72', signal:'#9A5C16', white:'#FFFFFF'};
const ISERIF='"Songti SC","STSong","Noto Serif SC","Noto Serif CJK SC","SimSun",serif';
const ISANS='"PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif';
const IF={h1:`600 38px ${ISERIF}`, meta:`400 19px ${ISANS}`, sec:`700 23px ${ISANS}`, q:`400 19px ${ISANS}`, a:`400 23px ${ISERIF}`, small:`400 16px ${ISANS}`, num:`600 17px ${ISANS}`, star:`400 30px ${ISANS}`};
function fpx(f){ return parseInt(f.match(/(\d+)px/)[1]); }
function wrapText(ctx, text, font, maxW){ ctx.font=font; const out=[]; String(text).split('\n').forEach(par=>{ let line=''; for(const ch of par){ const t=line+ch; if(ctx.measureText(t).width>maxW && line){ out.push(line); line=ch; } else line=t; } out.push(line); }); return out; }
function buildItems(){
  const m=document.createElement('canvas').getContext('2d'); const P=IMG.pad, CW=IMG.W-P*2;
  let sink=[]; const root=sink; const put=it=>sink.push(it);
  const txt=(text,font,lh,color,gt=0,gb=0,x=P,w=CW)=>{ const lines=wrapText(m,text,font,w); const off=(lh-fpx(font))/2; put({h:gt+lines.length*lh+gb, draw(c,y){ c.font=font; c.fillStyle=color; c.textBaseline='top'; lines.forEach((l,i)=>c.fillText(l,x,y+gt+i*lh+off)); }}); };
  const gap=h=>put({h, draw(){}});
  const group=fn=>{ const g=[], prev=sink; sink=g; fn(); sink=prev; put({h:g.reduce((s,i)=>s+i.h,0), draw(c,y){ let yy=y; g.forEach(it=>{ it.draw(c,yy); yy+=it.h; }); }}); };
  const ans=v=>{ const s=ansText(v).trim(); txt(s||'（未填）', IF.a, 37, s?IC.ink:IC.faint, 2, 0); };
  const rrect=(c,x,y,w,h,r)=>{ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); };
  const dots=(v,x0,y,size,gx)=>(c)=>{ for(let i=1;i<=5;i++){ const x=x0+(i-1)*(size+gx); rrect(c,x,y,size,size*0.86,6); if(v==i){ c.fillStyle=IC.accent; c.fill(); } else { c.fillStyle=IC.white; c.fill(); c.strokeStyle=IC.line; c.lineWidth=1; c.stroke(); } c.font=IF.num; c.fillStyle= v==i?IC.white:IC.faint; c.textAlign='center'; c.textBaseline='middle'; c.fillText(String(i), x+size/2, y+size*0.43+1); c.textAlign='left'; } };
  const sec=t=>put({h:78, draw(c,y){ c.font=IF.sec; c.fillStyle=IC.accent; c.textBaseline='top'; c.fillText(t, P, y+30); c.fillRect(P, y+66, 36, 3); }});
  txt('《熵增契约》样章试读反馈', IF.h1, 52, IC.ink, 6, 14);
  const tot=S.time.reduce((a,b)=>a+b,0);
  txt('称呼：'+(S.name||'（未填）'), IF.meta, 31, IC.ink);
  txt('常读：'+(S.types.join('、')||'（未填）'), IF.meta, 31, IC.ink);
  txt('状态：'+statusText(), IF.meta, 31, IC.ink);
  txt('阅读时长：共约 '+Math.max(1,Math.round(tot/60))+' 分钟（'+S.time.map((t,i)=>CN[i]+' '+Math.round(t/60)).join(' · ')+'，单位：分钟）', IF.small, 25, IC.muted, 4, 0);
  put({h:34, draw(c,y){ c.fillStyle=IC.line; c.fillRect(P,y+20,CW,1); }});
  for(let i=0;i<N;i++){ const id=CARD_IDS[i], a=S.answers[id]||{}; if(!S.submitted[id] && !Object.keys(a).length) continue;
    const cd=card(i); sec(pname(i)+' · 读后感受');
    cd.qs.forEach(q=>group(()=>{
      gap(14); txt(q.q, IF.q, 29, IC.muted, 0, 6);
      if(q.type==='scale'){ const v=a[q.id]; put({h:44, draw(c,y){ dots(v,P,y+2,44,8)(c); c.font=IF.a; c.fillStyle=v?IC.ink:IC.faint; c.textBaseline='top'; c.fillText(v? v+' / 5':'（未选）', P+5*52+14, y+8); }}); txt('1 = '+q.lo+' 5 = '+q.hi, IF.small, 24, IC.faint, 4, 0); }
      else if(q.type==='stars'){ const v=a[q.id]||0; put({h:44, draw(c,y){ c.font=IF.star; c.textBaseline='top'; for(let k=0;k<5;k++){ c.fillStyle= k<v?IC.signal:IC.line; c.fillText('★', P+k*38, y+4); } c.font=IF.a; c.fillStyle=v?IC.ink:IC.faint; c.fillText(v? v+' 星':'（未选）', P+5*38+14, y+8); }}); }
      else ans(a[q.id]);
      if(q.follow && ansText(a[q.follow.id]).trim()){ txt(q.follow.q, IF.small, 24, IC.faint, 10, 0); ans(a[q.follow.id]); }
      gap(10);
    }));
  }
  if(S.quit && S.quit.reason){ sec('停下的原因'); txt(S.quit.reason, IF.a, 37, IC.ink, 14, 0); }
  sec('随手记 · '+S.notes.length+' 条');
  if(!S.notes.length) txt('（这次没有记）', IF.a, 37, IC.faint, 14, 0);
  S.notes.forEach(n=>group(()=>{
    gap(16); txt('【'+n.kind+'】 '+pname(n.pack)+(n.ch?' · '+n.ch:''), IF.small, 25, IC.accent, 0, 6);
    if(n.quote){ const f=`400 20px ${ISERIF}`; const lines=wrapText(m,'“'+n.quote+'”',f,CW-22); put({h:lines.length*32+10, draw(c,y){ c.fillStyle=IC.line; c.fillRect(P,y+2,3,lines.length*32+2); c.font=f; c.fillStyle=IC.muted; c.textBaseline='top'; lines.forEach((l,i)=>c.fillText(l,P+18,y+6+i*32)); }}); }
    if(ansText(n.text).trim()) ans(n.text);
  }));
  txt('谢谢您读完这些片段。', IF.meta, 31, IC.muted, 48, 0);
  txt('—— 白巫师 敬上', IF.meta, 31, IC.muted, 0, 8);
  return root;
}
function paginate(items){ const pages=[]; let cur=[],h=0; items.forEach(it=>{ if(h+it.h>IMG.maxH && cur.length){ pages.push({items:cur,h}); cur=[]; h=0; } cur.push(it); h+=it.h; }); if(cur.length) pages.push({items:cur,h}); return pages; }
async function renderImages(){
  const pages=paginate(buildItems()); const n=pages.length, sc=IMG.scale, P=IMG.pad; const urls=[];
  pages.forEach((pg,pi)=>{
    const top=P+(pi?36:0), foot=72, H=Math.ceil(top+pg.h+foot);
    const cv=document.createElement('canvas'); cv.width=IMG.W*sc; cv.height=H*sc; const c=cv.getContext('2d'); c.scale(sc,sc);
    c.fillStyle=IC.bg; c.fillRect(0,0,IMG.W,H); c.fillStyle=IC.accent; c.fillRect(0,0,IMG.W,8);
    if(pi){ c.font=IF.small; c.fillStyle=IC.faint; c.textBaseline='top'; c.fillText('（接上一张）', P, P-4); }
    let y=top; pg.items.forEach(it=>{ it.draw(c,y); y+=it.h; });
    c.fillStyle=IC.line; c.fillRect(P, H-foot+18, IMG.W-P*2, 1);
    c.font=IF.small; c.fillStyle=IC.faint; c.textBaseline='top';
    c.fillText('《熵增契约》样章反馈 · '+(S.name||'读者'), P, H-foot+32);
    c.textAlign='right'; c.fillText('第 '+(pi+1)+' / '+n+' 张', IMG.W-P, H-foot+32); c.textAlign='left';
    urls.push(cv.toDataURL('image/png'));
  });
  return urls;
}

/* ---------- notes ---------- */
const KINDS=['想放下 / 走神','没看懂 / 被绕晕','出戏 / 觉得假','心里一动 / 想划线'];
let lastSel='';
document.addEventListener('selectionchange',()=>{ const s=window.getSelection(); if(!s||s.isCollapsed) return; const n=s.anchorNode; const bk=$('#book'); if(n && bk && bk.contains(n)) lastSel=s.toString().trim().slice(0,300); });
function updateFab(){ const n=S.notes.length; const b=$('#fabn'); b.textContent=n; b.classList.toggle('hidden', !n); }
function openSheet(h){ $('#sheet').innerHTML=h; $('#sheet').classList.remove('hidden'); $('#sheetbg').classList.remove('hidden'); }
function closeSheet(){ $('#sheet').classList.add('hidden'); $('#sheetbg').classList.add('hidden'); }
$('#sheetbg').onclick=closeSheet;
function openNotes(){
  const ch = chapterAtScroll(); const q=lastSel; let kind='';
  const list = S.notes.map((n,k)=>({n,k})).reverse().map(({n,k})=>`<div class="note"><div class="nh"><span class="k">${esc(n.kind)}</span><span>${esc(pname(n.pack))}</span><button data-del="${k}">删除</button></div>${n.quote?`<div class="nq">“${esc(n.quote)}”</div>`:''}${n.text?`<div>${esc(n.text)}</div>`:''}</div>`).join('');
  openSheet(`<h3>随手记一笔</h3><p class="sh">${esc(ch)} · 先在正文里选中一句话，再点“随手记”，原文会自动带进来。</p>
   <div class="row"><div class="sl">这是哪种时刻？</div><div class="chips" id="kinds">${KINDS.map(k=>`<button class="chip" data-k="${k}">${k}</button>`).join('')}</div></div>
   <div class="row"><div class="sl">那一句（可以不填）</div>${q?`<div class="quote">${esc(q)}</div>`:'<input type="text" id="nqi" placeholder="可以粘贴，或简单写几个字">'}</div>
   <div class="row"><div class="sl">您当时的想法</div><textarea id="nt" placeholder="几个字就好"></textarea></div>
   <div class="btnrow"><button class="primary" id="nsave">记下</button><button class="ghost" id="ncancel">先不记了</button></div><div id="nmsg" class="msg hidden"></div>
   ${S.notes.length?`<div class="notelist">${list}</div>`:''}`);
  $('#kinds').onclick=e=>{ const b=e.target.closest('.chip'); if(!b) return; kind=b.dataset.k; $('#kinds').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on', x===b)); };
  $('#ncancel').onclick=closeSheet;
  $('#nsave').onclick=()=>{ const text=$('#nt').value.trim(); const quote=q || ($('#nqi')?$('#nqi').value.trim():'');
    if(!kind){ const m=$('#nmsg'); m.textContent='请先选一下是哪种时刻。'; m.classList.remove('hidden'); return; }
    S.notes.push({kind, pack:S.view.pack, ch, quote, text, at:now()}); lastSel=''; save(); updateFab(); closeSheet(); try{ window.getSelection().removeAllRanges(); }catch(e){} };
  $('#sheet').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ S.notes.splice(+b.dataset.del,1); save(); updateFab(); openNotes(); });
}
$('#fab').onclick=openNotes;

/* ---------- toc / prefs ---------- */
function openToc(){
  const f=frontier(); const open = PREVIEW ? N-1 : Math.min(f, N-1);
  const items=[]; for(let i=0;i<N;i++){ const ok = S.started && i<=open;
    items.push(ok ? `<a href="#" data-p="${i}" class="${S.view.mode==='read'&&S.view.pack===i?'cur':''}">${esc(pname(i))}<span>${PACKS[i].chapters.map(esc).join('、')}</span></a>`
                  : `<span class="lock">${esc(pname(i))}<br><small>读完前面的片段后打开</small></span>`); }
  const canQuit = S.started && !S.finished && !(S.sent.partial && !PREVIEW && S.quit);
  openSheet(`<h3>目录</h3><p class="sh">读过的片段可以随时回看。</p><div class="toc">${items.join('')}</div>
   <div class="btnrow">${(S.started && f<N && S.view.mode!=='card')?'<button class="ghost" id="tf">回到当前进度</button>':''}${canQuit?'<button class="ghost" id="tq">先读到这儿，把感受发给作者</button>':''}</div>`);
  $('#sheet').querySelectorAll('[data-p]').forEach(a=>a.onclick=e=>{ e.preventDefault(); closeSheet(); go('read', +a.dataset.p); });
  const tf=$('#tf'); if(tf) tf.onclick=()=>{ closeSheet(); go('read', f); };
  const tq=$('#tq'); if(tq) tq.onclick=()=>openQuit();
}
$('#bToc').onclick=openToc;
$('#bFs').onclick=()=>{ const steps=[16,18,20,22]; const i=steps.indexOf(S.fs); S.fs=steps[(i+1)%steps.length]; save(); applyPrefs(); };
$('#bNight').onclick=()=>{ S.night=!S.night; save(); applyPrefs(); };

/* ---------- reading time & scroll ---------- */
let lastAct=Date.now(); ['scroll','touchstart','keydown','mousemove','click'].forEach(ev=>window.addEventListener(ev,()=>{lastAct=Date.now();},{passive:true}));
setInterval(()=>{ if(document.visibilityState==='visible' && S.view.mode==='read' && Date.now()-lastAct<120000){ S.time[S.view.pack]+=5; save(); } },5000);
let st=null;
window.addEventListener('scroll',()=>{
  if(S.view.mode!=='read') return;
  const h=document.documentElement.scrollHeight-window.innerHeight; $('#progbar').style.width = (h>0? Math.min(100, window.scrollY/h*100):0)+'%';
  clearTimeout(st); st=setTimeout(()=>{ S.scroll[S.view.pack]=window.scrollY; save(); },400);
},{passive:true});

if(PREVIEW) $('#pv').classList.remove('hidden');
render();
if(S.view.mode==='read') window.scrollTo(0, S.scroll[S.view.pack]||0);
</script>
